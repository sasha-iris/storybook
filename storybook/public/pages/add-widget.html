<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Widget — Iris React test</title>
  <link rel="stylesheet" href="../assets/iris-components.css" />
  <style>
    body { margin: 0; background: #6b7280; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: inherit; }

    /* modal-backdrop */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(75,85,99,0.5); }

    /* override modal-dialog for this size */
    .modal-dialog--lg-wide { max-width: 720px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; background: #fff; }

    /* internal layout */
    .aw-layout { display: flex; flex: 1; overflow: hidden; background: #fff; }
    .aw-sidebar { width: 200px; flex-shrink: 0; border-right: 1px solid var(--color-border-default); padding: 8px 0; display: flex; flex-direction: column; justify-content: space-between; background: #fff; }
    .aw-content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: #fff; }

    /* sidebar nav items */
    .aw-nav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; font-size: var(--text-sm); color: var(--color-text-primary); cursor: pointer; border-radius: 0; }
    .aw-nav-item:hover { background: var(--color-bg-secondary); }
    .aw-nav-item.active { background: var(--color-bg-secondary); font-weight: var(--font-semibold); }
    .aw-nav-count { font-size: var(--text-xs); color: var(--color-text-secondary); }

    /* sidebar footer links */
    .aw-sidebar-footer { padding: 8px 0; border-top: 1px solid var(--color-border-default); }
    .aw-footer-link { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: var(--text-sm); color: var(--color-text-secondary); cursor: pointer; }
    .aw-footer-link:hover { color: var(--color-text-primary); }

    /* search + filter row */
    .aw-search-row { display: flex; gap: 8px; align-items: center; }
    .aw-search-row .form-group { flex: 1; margin: 0; }
    .aw-search-row .form-search-wrap { margin: 0; }

    /* section heading */
    .aw-section-label { font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--color-text-secondary); letter-spacing: 0.05em; text-transform: uppercase; }

    /* widget grid */
    .aw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* create new widget card */
    .aw-card-new { border: 2px dashed var(--color-border-default); border-radius: 8px; padding: 40px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--color-text-secondary); font-size: var(--text-sm); }
    .aw-card-new:hover { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-bg-secondary); }
    .aw-card-new__icon { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; }

    /* widget preview card */
    .aw-card-widget { border: 1px solid var(--color-border-default); border-radius: 8px; padding: 16px; cursor: pointer; background: var(--color-bg-white); }
    .aw-card-widget:hover { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
    .aw-card-widget__title { font-size: var(--text-sm); color: var(--color-text-secondary); margin: 0 0 24px; }
    .aw-card-widget__value { font-size: 1.75rem; font-weight: var(--font-semibold); color: var(--color-text-primary); margin: 0; }

    /* modal footer */
    .aw-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--color-border-default); background: #fff; }
    .aw-footer-count { font-size: var(--text-sm); color: var(--color-text-secondary); }
  </style>
</head>
<body>

<div class="modal-backdrop" aria-hidden="true"></div>

<div role="dialog" aria-modal="true" aria-labelledby="modal-title"
     class="modal-dialog modal-dialog--lg-wide">

  <!-- Header -->
  <div class="modal-header">
    <h2 class="modal-title" id="modal-title">Add Widget</h2>
    <button type="button" class="modal-close" aria-label="Close dialog">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
    </button>
  </div>

  <!-- Body -->
  <div class="modal-body" style="padding:0; flex:1; overflow:hidden; display:flex; flex-direction:column;">

    <div class="aw-layout">

      <!-- Sidebar -->
      <div class="aw-sidebar">
        <div>
          <div class="aw-nav-item active">
            All Widgets <span class="aw-nav-count">(918)</span>
          </div>
          <div class="aw-nav-item">
            Custom <span class="aw-nav-count">(896)</span>
          </div>
          <div class="aw-nav-item">
            Income <span class="aw-nav-count">(3)</span>
          </div>
          <div class="aw-nav-item">
            Cash <span class="aw-nav-count">(4)</span>
          </div>
          <div class="aw-nav-item">
            Profitability <span class="aw-nav-count">(11)</span>
          </div>
          <div class="aw-nav-item">
            Marketing <span class="aw-nav-count">(4)</span>
          </div>
        </div>

        <div class="aw-sidebar-footer">
          <div class="aw-footer-link">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.396 0 2.695.37 3.8 1.014A7.97 7.97 0 0113 14.5c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0013 4c-1.255 0-2.443.29-3.5.804V4h-.5zM9 6.414V15.5A7.97 7.97 0 005.5 14c-.93 0-1.82.163-2.643.463L2.5 5.968A6.97 6.97 0 015.5 5.5c1.17 0 2.267.3 3.212.82L9 6.414zm2 9.086V6.414l.288-.094A6.97 6.97 0 0114.5 5.5c1.05 0 2.047.23 2.943.634L17.5 14.5A6.968 6.968 0 0014.5 14a7.97 7.97 0 00-3.5.914V15.5z"/></svg>
            Help docs
          </div>
          <div class="aw-footer-link">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/></svg>
            Share feedback
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="aw-content">

        <!-- Search + filter -->
        <div class="aw-search-row">
          <div class="form-group" style="flex:1;margin:0;">
            <div class="form-search-wrap">
              <span class="form-search-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M14 14L10.0001 10M11.3333 6.66667C11.3333 9.24399 9.24399 11.3333 6.66667 11.3333C4.08934 11.3333 2 9.24399 2 6.66667C2 4.08934 4.08934 2 6.66667 2C9.24399 2 11.3333 4.08934 11.3333 6.66667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <input type="search" class="form-input" placeholder="Quick search..." aria-label="Search widgets" />
            </div>
          </div>
          <button type="button" class="btn-icon" aria-label="Filter widgets">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M6 10h8M9 15h2"/></svg>
          </button>
        </div>

        <!-- Section label -->
        <div class="aw-section-label">Custom (896)</div>

        <!-- Widget grid -->
        <div class="aw-grid">

          <!-- Create new -->
          <div class="aw-card-new" role="button" tabindex="0" aria-label="Create a new widget">
            <div class="aw-card-new__icon" aria-hidden="true">+</div>
            <span>Create a new widget</span>
          </div>

          <!-- Amazon Gross Revenue -->
          <div class="aw-card-widget" role="button" tabindex="0">
            <p class="aw-card-widget__title">Amazon Gross Revenue</p>
            <p class="aw-card-widget__value">$224,169.29</p>
          </div>

          <!-- MER -->
          <div class="aw-card-widget" role="button" tabindex="0">
            <p class="aw-card-widget__title">Overall Marketing Efficiency Ratio (MER)</p>
            <p class="aw-card-widget__value">3.2×</p>
          </div>

          <!-- Income -->
          <div class="aw-card-widget" role="button" tabindex="0">
            <p class="aw-card-widget__title">Total Income</p>
            <p class="aw-card-widget__value">$1,842,300</p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="aw-footer">
    <span class="aw-footer-count">0 on dashboard</span>
    <div style="display:flex;gap:8px;">
      <button type="button" class="btn btn-alternative btn-md">Cancel</button>
      <button type="button" class="btn btn-primary btn-md" disabled style="opacity:0.5;cursor:not-allowed;">Confirm</button>
    </div>
  </div>

</div>

</body>
</html>
