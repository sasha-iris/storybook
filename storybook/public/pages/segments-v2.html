  The segment list in the Data Rooms visual language.

  Data Rooms never showed us a list — both screenshots are the detail page of one
  room holding three files, so its table has no sort and its rail cannot change
  the result. At forty segments neither of those holds, so this page keeps the
  Data Rooms atoms (rail, toolbar, card-wrapped table, tinted icon tiles) and
  makes them work at this scale.

  Components come from the library wherever it has one: .card-icon for the type
  tile, .badge for status, .progress for the share-of-base bar, brand purple for
  the primary action. No Calculate anywhere: metrics are computed on the fly.
-->

             Read together those are not a contradiction. The column is useful

             channels a segment uses is expanded from that count, like the SKUs.
             An index has to be true; a filter can carry the caveat that says so.

<script>
/* ── page state ─────────────────────────────────────────────────────────── */
let fState = 'all', fFolder = 'all', q = '';

/* ── Grouping ─────────────────────────────────────────────────────────────
   Data Rooms' table is flat because it holds three files. Ours holds forty
   segments, and a flat forty-row scroll is the thing the live product already
   gets wrong: you cannot hold it in your head, so you never find the segment
   you half-remember.

   Grouping is by FOLDER. It was by a derived Type, which assigned each segment
   one label from its first matching condition — a machine's guess presented as
   an arrangement. Folders are the user's own, so grouping by them is the thing
   that makes creating one worth the trouble.

   Which is why it cannot be the default on a fresh account: with no folders,
   grouped and flat are the same forty rows under one heading. It turns itself
   on the moment the first folder exists. */
/* ── Selecting several segments ───────────────────────────────────────────
   the product owner, 2026-09-03: "I think you should be able to select any of these
   customer segments". There was no way to act on more than one: Compare took
   exactly two chosen from two dropdowns on another page, and filing a segment
   was one trip through one row's overflow menu — forty trips to fill a folder,
   which is why every one of the forty is still unfiled in the live product.

   Selection survives filtering. Narrowing the rail to find the next few, then
   widening it again, is how anyone would actually build a folder, and a
   selection that emptied itself on every filter change would make that
   impossible. What the bar acts on is stated in it. */
const PICKED = new Set();

let grouped = FOLDERS.length > 0;
/* Grouping used to be switched off behind the reader's back — by a column sort,
   by the rail already being down to one folder, by there being no folders —
   while the control stayed lit and a screen reader read it as checked. Two of
   those three refusals were unnecessary:
     — a column sort orders the rows, and the groups keep whatever order the
       rows arrive in, so sorting INSIDE groups is what a reader expects anyway;
     — one folder selected is one group, which the single-group rule below
       already renders without a header.
   So nothing is blocked. What remains is the one case worth a word: an account
   with no folders has nothing to group by. */
function groupHint() {
  return FOLDERS.length ? null : 'Grouping is by folder.';
}
const COLLAPSED = new Set();

/* ── Folders ──────────────────────────────────────────────────────────────
   Data Rooms groups its records into folders: the meta row counts them, the
   rail filters by them, "+ New folder" creates one, and every ungrouped record
   says "Unfiled" under its name. This redesign had dropped the whole concept
   and put a saved filter in its place, which is a different thing — a saved
   filter remembers a question, a folder is where a thing lives. The product owner's own
   note was "it's more about organizing the segments", and grouping forty of
   them is the plainest reading of that.

   FOLDERS, saveFolders, folderOf and fileInto now live in segments-v2-shared.js
   so the segment page can file itself into a folder too. Only the filter below
   is page-local, because only this page has an fFolder to filter by. */
const matchFolder = s => fFolder === 'all' ? true
                       : fFolder === 'none' ? !folderOf(s)
                       : (folderOf(s) || {}).id === fFolder;
/* Default order is attention, not size.
   Sorting by customers descending puts the five segments that report the whole
   customer base at the very top — which is precisely the failure of the live
   product this redesign exists to fix, reproduced by our own default. v1 had an

/* ── rail ───────────────────────────────────────────────────────────────

   number, which is the only thing that differs, sat at the end of four

};
function navLabel(k, l) {
  let s = l;
  (NAV_TRIM[k] || []).some(([re, to]) => re.test(s) && (s = s.replace(re, to), true));
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* Thresholds read as a scale, so they are ordered as one. "over 25%, over 0%,
   over 10%, over 5%" is the facet convention — commonest first — and it is the
   wrong convention for a number line: nobody scans a scale by popularity. Only
   when every value in the group carries a number; otherwise the count order
   stands. */
const NAV_NUM = s => { const m = String(s).match(/-?[\d.]+/); return m ? parseFloat(m[0]) : null; };
const FILTER_DIMS = ['ctype', 'channel'];
const isFilterTok = t => FILTER_DIMS.indexOf(String(t).split('|')[0]) !== -1;
const filterVals = () => new Set([...VSEL].filter(isFilterTok));
/* Everything the column is NOT responsible for: what the panel, the search box
   and the range picker have already ruled out. */
const navBase = () => SEGMENTS.filter(x =>
  matchValues(x, filterVals()) && matchState(x) && matchWin(x) && matchBy(x) && matchQ(x));

function drawNav() {
  const base = navBase();
  const navSel = new Set([...VSEL].filter(t => !isFilterTok(t)));

  const countIf = (dims, vals, folder) => base.filter(x =>
    matchDimSet(x, dims) && matchValues(x, vals) &&
    (folder === 'all' ? true : folder === 'none' ? !folderOf(x) : (folderOf(x) || {}).id === folder)).length;

  /* ── One row ────────────────────────────────────────────────────────────
     `state` is 'off', 'path' or 'current', and only ONE row on screen is
     'current'. The column used to paint Geography, US and postal code CA with
     the same filled block, three rounded slabs stacked on top of each other:
     nothing said which of the three was the place and which two were the way to
     it, and the fill read as one shape rather than three rows.

     So the deepest choice is the current one and takes the fill and the left
     marker; its ancestors carry the brand colour in the label alone. Cloudscape
     puts it plainly — one link in a side navigation is active, and the parent of
     an active child is shown as its parent, not as a second active item.

     The indent is a reserved column rather than padding on the text, the way
     Primer builds its tree rows, so a child's label lands one step right of its
     parent's label — not one step right of the parent's ICON, which is what put
     "postal code IL" and "US" at two unrelated x positions. */
  const row = (state, nav, label, n, depth, icon) =>
    '<button class="list-group-item dr-nv dr-nv--' + depth +
      (state === 'current' ? ' is-current' : state === 'path' ? ' is-path' : '') +
      '" data-nav="' + esc(nav) + '" aria-pressed="' + (state !== 'off') + '"' +
      (state === 'current' ? ' aria-current="true"' : '') +
      (n === 0 && state === 'off' ? ' aria-disabled="true"' : '') + '>' +
      (icon ? '<span class="dr-nv__i">' + svg(icon, 15) + '</span>' : '') +
      '<span class="dr-nv__l">' + esc(label) + '</span>' +
      '<span class="dr-rail__n">' + n + '</span></button>';

  const lab = t => '<div class="dr-rail__lab">' + t + '</div>';

  const navSearchBox = k =>
    '<div class="dr-navsearch"><div class="form-search-wrap form-search-wrap--end">' +
      '<label class="seg-sr" for="navq-' + k + '">Search ' + esc(DIM[k].l) + '</label>' +
      '<input class="form-input" id="navq-' + k + '" type="search" data-navq="' + k + '"' +
      ' placeholder="Country or postal code" value="' + esc(GQ['nav:' + k] || '') + '">' +
      (GQ['nav:' + k] ? '<button class="form-search-icon" data-navqclear="' + k + '"' +
                        ' aria-label="Clear the search">' + svg('M6 18 18 6M6 6l12 12', 14) + '</button>' : '') +
    '</div></div>';

  /* All segments. Its count ignores both axes, because clicking it drops them. */
  const atRoot = !DSEL.size && !navSel.size && fFolder === 'all';
  let html = '<div class="dr-rail__g dr-rail__g--root">' +
    row(atRoot ? 'current' : 'off', 'all', 'All segments',
        countIf(new Set(), filterVals(), 'all'), 0, IC.layers) + '</div>';

  if (FOLDERS.length) {
    /* A folder is a place and so is a dimension, and they can be true at once —
       "Retention, narrowing by geography". So a chosen folder is 'current' only
       when nothing in the other axis is. */
    const folderState = id => fFolder !== id ? 'off'
      : (DSEL.size || navSel.size) ? 'path' : 'current';
    html += '<div class="dr-rail__g">' + lab('Folders') +
      FOLDERS.map(f => row(folderState(f.id), 'folder:' + f.id, f.name,
        countIf(DSEL, VSEL, f.id), 0, IC.folder)).join('') +
      row(folderState('none'), 'folder:none', 'Unfiled',
        countIf(DSEL, VSEL, 'none'), 0, IC.folder) + '</div>';
  }

  /* The drill-down inside the active dimension: one value at a time, and a
     second level only inside the value it belongs to. A path, not a set — so
     the deepest chosen node is the current one and the rest of the path is
     shown as the path. */
  /* ONE token, the deepest one. Holding "geo|US" alongside "geo|US|CA" put two
     values of the same dimension in VSEL, and matchValues ORs within a
     dimension — so picking a postal code inside the US widened the result back
     to every US segment and the header read "8 of 40" under a row counting 1.
     A path is not an OR. The ancestors are read off the token itself. */
  const sel = [...navSel][0] || null;

  /* ── Two levels, and a ceiling on the second ────────────────────────────
     There WAS a third level: postal codes inside a country, SKU codes inside
     SKUs. It came out, because it does not survive a real account. This one has
     five SKU codes; an account can have thousands, and so can its postal codes.
     A navigation column that lists them is a column that is taller than the
     table it is navigating, and the values it would list here were expanded from
     a count rather than read — the caveat under Products was a sign that the
     level should not have been there, not a way of keeping it.

     Which loses the product owner's "product sub items" at 11:40 as CODES, and keeps it as
     the split he can actually act on: SKUs against product families. That is two
     items, read straight from the conditions, invented nowhere.

     The second level is also capped. Baymard's filtering work puts the ceiling
     at four to eight before a list starts costing more than it gives; at eight
     the rest go behind one more row rather than off the page, and the toolbar
     search reaches any of them by name. */
  const NAV_CAP = 8;
  const valueRows = k => {
    const tree = dimTree(k, base.filter(x => matchFolder(x)));

    /* ── Geography and the postal codes ───────────────────────────────────
       the product owner, 2026-09-08: "most filters stay in the left column — products,
       geography, zip/postcode COMBINED". Combined, not enumerated: one filter
       reaches both, and the postal codes are found by typing rather than listed.
       This account has two of them; an account has thousands, and a column that
       lists them is taller than the table it navigates.

       So the rows stay countries, and a search box under the dimension matches
       BOTH levels — "US" finds the country, "IL" finds the postal code inside
       it. Which is the pattern every product we looked at uses for a facet that
       does not fit: top-N plus typeahead, never the full list. */
    const q2 = (GQ['nav:' + k] || '').trim().toLowerCase();
    const deep = [];
    if (k === 'geo') tree.forEach(c => (c.kids || []).forEach(x => deep.push(x)));
    if (q2 && deep.length) {
      const hits = deep.filter(x => x.l.toLowerCase().includes(q2) ||
                                    String(x.tok).toLowerCase().includes(q2));
      const cs = tree.filter(c => c.l.toLowerCase().includes(q2));
      const rows = cs.concat(hits);
      return navSearchBox(k) + (rows.length
        ? rows.map(v => {
            const probe = new Set([...VSEL].filter(isFilterTok)); probe.add(v.tok);
            const p = String(v.tok).split('|');
            return row(sel === v.tok ? 'current' : 'off', 'val:' + v.tok,
                       p.length > 2 ? p[1] + ' · ' + v.l : v.l,
                       countIf(new Set([k]), probe, fFolder), 1);
          }).join('')
        : '<div class="dr-navempty">Nothing matches “' + esc(q2) + '”</div>');
    }

    const nodes = tree
      /* Anything below the top level is a code, not a place. */
      .filter(v => String(v.tok).split('|').length === 2);
    /* One value is not a drill-down. Tags held exactly one — "1 tag" under a
       heading reading Tags — so opening it added a row that repeated its parent
       and led somewhere the parent already was. */
    if (nodes.length < 2) return '';
    if (nodes.every(v => NAV_NUM(v.l) != null)) {
      nodes.sort((a, b) => NAV_NUM(a.l) - NAV_NUM(b.l));
    }
    const open = NAV_MORE.has(k) || nodes.length <= NAV_CAP + 1;
    const shown = open ? nodes : nodes.slice(0, NAV_CAP);
    return (deep.length ? navSearchBox(k) : '') + shown.map(v => {
      const probe = new Set([...VSEL].filter(isFilterTok)); probe.add(v.tok);
      return row(sel === v.tok ? 'current' : 'off',
                 'val:' + v.tok, navLabel(k, v.l), countIf(new Set([k]), probe, fFolder), 1);
    }).join('') +
      (open ? '' :
        '<button class="list-group-item dr-nv dr-nv--1 dr-nv__more" data-more="' + esc(k) + '">' +
          '<span class="dr-nv__l">Show all ' + nodes.length + '</span></button>');
  };

  const dims = NAV_DIMS.filter(k => SEGMENTS.some(x => x.dims.indexOf(k) !== -1));
  const dimState = k => !DSEL.has(k) ? 'off' : (navSel.size ? 'path' : 'current');
  html += '<div class="dr-rail__g">' + lab('Narrows by') +
    dims.map(k => {
      const on = DSEL.has(k);
      return row(dimState(k), 'dim:' + k, DIM[k].l, countIf(new Set([k]), filterVals(), fFolder), 0, DIM[k].ic) +
        (on ? valueRows(k) : '');
    }).join('') +
    row(dimState('none'), 'dim:none', 'No conditions',
        countIf(new Set(['none']), filterVals(), fFolder), 0, IC.slash) +
    '</div>';

  /* Result belongs in the navigation column, not the filter panel. "Which of
     these come back with nobody" is a place you go and stand, the same as a
     dimension or a folder, and it was the one group in the panel that answered
     that kind of question. Pressing the row you are already on clears it, the
     way every other row here does. */
  const nStateNav = k => SEGMENTS.filter(x =>
    matchDim(x) && matchFolder(x) && matchWin(x) && matchBy(x) && matchQ(x) && stateOf(x, k)).length;
  html += '<div class="dr-rail__g">' + lab('Result') +
    ['ready', 'nomatch', 'unknown'].map(k =>
      row(fState === k ? 'current' : 'off', 'state:' + k, STATE[k].l, nStateNav(k), 0, STATE[k].ic)
    ).join('') + '</div>';

  document.getElementById('lsNav').innerHTML = '<div class="list-group dr-rail">' + html + '</div>';
}

/* ── table ──────────────────────────────────────────────────────────────── */
const COLS = [
  { k:'n',   l:'Segment' },
  { k:'c',   l:'Customers', n:1 },
  { k:'o',   l:'Orders',    n:1 },
  { k:'net', l:'Net sales', n:1 },
  { k:'ltv', l:'Avg LTV',   n:1 },
  /* Two date columns, not one. The live product carries Created and Updated
     side by side, and the product owner at 16:40 asked for exactly that pair, by user:
     "the metrics here should be like a user based — you created, edited, user
     created, user edited." This variant had collapsed them into a single
     "Definition updated", which loses the age of a segment: "US Customers" was
     created and last touched on the same day in Aug 2026, "SKU B004" was made
     in May and rewritten in August, and with one column those two read alike.
     Both dates come from the product's own list, pulled on 2026-09-01.

     The person is still missing on both, because segments record none. See M8. */
  { k:'cr',  l:'Created', n:1 },
  { k:'up',  l:'Updated', n:1 }
];

function nameCell(s) {
  const kind = tileOf(s);
  const err  = s.flags.filter(f => f.danger);
  const warn = s.flags.filter(f => f.sev === 'warn');
  const st   = v2state(s);
  /* The condition view lists every condition, including the ones that filter
     nothing, and marks those. That is the whole difference between the two
     readings: the summary says what the definition amounts to, this says what
     was actually configured. */
  const conds = esc(s.sentence);
  /* ── One mark, no sentence ──────────────────────────────────────────────
     the product owner, 2026-09-08: "the alerts in the main list are too loud, it's too
     difficult for me to parse through what's important and what isn't. I think
     if you just have some alert and no text, it might be fine."

     A row used to carry up to three of them: a filled status pill on the name
     line, a red line reading "Reports your whole customer base · same numbers as
     2 other segments", and an amber "Average LTV is negative" under it. Forty
     rows of that is a page about what is broken, which is the note he has now
     made three times.

     So every finding on a row collapses into ONE mark, and the mark says only
     that there is something to look at. It sits at the right edge of the Segment
     cell, so the marks line up in a column and the eye runs down them instead of
     hunting them at the end of names of different lengths.

     One severity, not two. Red-for-error beside amber-for-warning is a
     distinction carried by colour alone — which is both a WCAG 1.4.1 failure and
     the exact thing he says he cannot parse. What is behind the mark is still
     written out in full, in three places that are not the list: the tooltip, the
     Result filter, and the segment's own page.

     The status pills go with them. "No customers match" is the Customers column
     reading 0, and "No data" is that column reading —; the pill repeated in
     colour what the number already said plainly. */
  /* Negative LTV is NOT one of these. It is not a fault in the definition — the
     segment is built correctly and the customers in it cost more than they
     bring — and the Avg LTV column already says it, in red, in the column whose
     job that is. Carrying it here too put the mark on 19 of 40 rows and made it
     mean "something or other", which is the complaint. It means one thing now:
     the definition has a problem. Fourteen rows. */
  const findings = err.map(f => f.t).concat(warn.map(f => f.t));
  /* A mark with no affordance is decoration. The first version was a bare icon
     carrying a `title`: nothing on hover but the OS tooltip half a second later,
     nothing on focus, nothing at all on a touch screen — so the row said "there
     is a problem" and gave you no way to find out what.

     It is a button now, with a hover and a focus state, and what it holds is the
     library's own .tooltip-bubble rather than the browser's. The findings are
     one per line: this is the "no text" the product owner asked for, in the sense that the
     text is not ON the row, it is one hover away from it. */
  const mark = findings.length
    ? '<span class="tooltip-wrap dr-flagmark">' +
        '<button class="dr-flagbtn" aria-describedby="fl-' + s.id + '"' +
        ' aria-label="' + findings.length + ' finding' + (findings.length > 1 ? 's' : '') +
        ' on this segment">' + svg(IC.warn, 15) + '</button>' +
        '<span class="tooltip-bubble tooltip-left dr-flagtip" role="tooltip" id="fl-' + s.id + '">' +
          findings.map(t => '<span>' + esc(t) + '</span>').join('') +
        '</span>' +
      '</span>'
    : '';
  /* Line 1 is the name, and nothing else. The condition count moved down to the
     definition line, where it belongs: on the name line it competed with the
     title and pushed it onto its own row in a 290px column, which broke the name
     away from its own tile. */
  return '<div class="dr-name"><span class="card-icon dr-tile ' + kind.c + '" title="' + kind.l + '" aria-hidden="true">' + svg(kind.ic, 19) + '</span>' +
    '<div class="dr-name__t"><div class="dr-name__l">' +
      '<a class="dr-name__a" href="./segment-detail-v2.html?id=' + s.id + '">' + esc(s.n) + '</a>' +
    '</div><div class="dr-name__s">' +
      (s.conds.length ? '<span class="iris-chip iris-chip--light">' + s.conds.length + ' condition' + (s.conds.length > 1 ? 's' : '') + '</span>' : '') +
      (folderOf(s) ? '<span class="iris-chip iris-chip--light">' + svg(IC.folder, 12) + esc(folderOf(s).name) + '</span>' : '') +
      '<span>' + conds + '</span>' +
    '</div></div>' + mark + '</div>';
}

/* Customers is the lead metric, so it gets the weight and a bar. The bar is the
   finding made visible: a track filled end to end is a segment that is not a
   segment, and it is red before you have read a single digit. */
function customersCell(s) {
  if (s.c == null) return DASH;
  const whole = s.share >= 0.95;
  return '<div class="dr-share"><span class="lead' + (whole ? ' ' : '') + '"' +
    (whole ? ' style="color:var(--color-text-fg-danger)"' : '') + '>' + fmtN(s.c) + '</span>' +
    (s.c ? bar(s.share, whole ? 'progress-bar-danger' : 'progress-bar-indigo') +
           /* He asked for both: "I really like this percentage of base and a
              number of customers", and then "it might be interesting to see how
              they rank as well, like other segments, relatively". The share
              says how much of the business; the rank says where this one sits
              among the segments that returned anything. */
           /* Two facts, two lines. Joined by a middot they were one phrase too
              long for a 110px column, so it broke wherever it ran out of room
              — "100.0% of" over "base · #1 of 23" — and the cell read as
              ragged rather than as two readings of the same number. */
           '<span class="sub">' + pct(s.share) + ' of base</span>' +
           (s.rank ? '<span class="sub dr-rank">#' + s.rank + ' of ' + s.rankOf + '</span>' : '')
           : '') + '</div>';
}

/* Drawn on its own so that ticking a checkbox does not rebuild the table under
   the pointer — and, worse, under the keyboard: a full redraw replaced the very
   input that had just been given focus with Space, and focus fell to the top of
   the document. */
function drawPickBar() {
  const bar = document.getElementById('lsPick');
  /* Never removed from the flow: it is what reserves the row's height, so the
     table cannot move when a selection starts or ends. Hidden with visibility,
     and taken out of the tab order and the accessibility tree while empty. */
  bar.hidden = false;
  bar.setAttribute('aria-hidden', PICKED.size === 0 ? 'true' : 'false');
  bar.inert = PICKED.size === 0;
  /* The wrapper carries the state so the bar can sit ON the summary row rather
     than above it — see .dr-sumwrap.is-picking. */
  const wrap = document.getElementById('lsSumWrap');
  if (wrap) wrap.classList.toggle('is-picking', PICKED.size > 0);
  const shownIds = new Set(SEGMENTS.filter(x => matchDim(x) && matchState(x) && matchFolder(x) && matchWin(x) && matchBy(x) && matchQ(x)).map(x => x.id));
  const hidden = [...PICKED].filter(id => !shownIds.has(id)).length;
  bar.innerHTML =
    '<span class="dr-pickbar__n"><b>' + PICKED.size + '</b> selected' +
      (hidden ? ' <span class="dr-pickbar__off">' + hidden + ' not shown by the current filters</span>' : '') +
    '</span>' +
    '<button class="btn btn-xs btn-alternative" id="pkMove" aria-haspopup="menu" aria-expanded="false">' +
      svg(IC.folder, 15) + 'Move to folder' + svg('m19.5 8.25-7.5 7.5-7.5-7.5', 13) + '</button>' +
    /* Compare reads two segments against each other, so it says so instead of
       failing after the click. */
    '<button class="btn btn-xs btn-alternative" id="pkCompare"' + (PICKED.size === 2 ? '' : ' aria-disabled="true"') + '>' +
      svg(IC.chart, 15) + 'Compare' + (PICKED.size === 2 ? '' : ' <span class="dr-pickbar__hint">pick 2</span>') + '</button>' +
    '<button class="btn btn-xs btn-alternative" id="pkArchive">' + svg(IC.box, 15) + 'Archive</button>' +
    '<button class="btn-link" id="pkClear">Clear selection</button>';
}

/* The header box reflects three states, and "some" is not "none". */
function syncPickAll() {
  const all = document.getElementById('lsAll');
  if (!all) return;
  const shown = SEGMENTS.filter(x => matchDim(x) && matchState(x) && matchFolder(x) && matchWin(x) && matchBy(x) && matchQ(x));
  const on = shown.filter(x => PICKED.has(x.id)).length;
  all.checked = shown.length > 0 && on === shown.length;
  all.indeterminate = on > 0 && on < shown.length;
  /* Three states, and the drawn span carries all three: the library ships
     --checked and --intermediate for exactly this. */
  const box = all.parentElement.querySelector('.iris-checkbox');
  if (box) {
    box.classList.toggle('iris-checkbox--checked', all.checked);
    box.classList.toggle('iris-checkbox--intermediate', all.indeterminate);
  }
}

function render() {
  syncArrangement();
  drawNav();
  drawRail();
  let rows = SEGMENTS.filter(s => matchDim(s) && matchState(s) && matchFolder(s) && matchWin(s) && matchBy(s) && matchQ(s));
  rows = [...rows].sort((a, b) => {
    if (sort.k === 'attention') {
      const d = ATT(a) - ATT(b);
      return d || (b.c || 0) - (a.c || 0);   /* inside a band, biggest first */
    }
    let A = a[sort.k], B = b[sort.k];
    /* Dates sort as dates. As strings "Aug 14, 2026" lands before "Jul 3, 2026". */
    if (sort.k === 'up' || sort.k === 'cr') { A = new Date(A); B = new Date(B); }
    if (A == null && B == null) return 0;
    if (A == null) return 1;          /* rows with no value sink, either direction */
    if (B == null) return -1;
    const r = typeof A === 'string' ? A.localeCompare(B) : A - B;
    return sort.dir === 'desc' ? -r : r;
  });

  /* Applied filters are removable chips, not a sentence with one "Clear filters"
     hammer at the end. Three reasons this is the better control:
     — you can drop ONE filter. The button could only drop all of them, so
       narrowing from four filters to three meant starting over.
     — what is applied is visible as objects, not buried in a run-on line.
     — "clear all" stops being a bordered button competing with the real actions
       and becomes what it is: a quiet reset, last in the row.
     The × is inside the chip, so it is one control per filter, where it applies. */
  const chips = [];
  /* A dimension chip is dropped once one of its own values is applied: the value
     already says which dimension it belongs to, and "Narrows by Products ·
     Products SKUs" printed the word twice in a row. */
  DSEL.forEach(k => {
    if ([...VSEL].some(t => String(t).split('|')[0] === k)) return;
    chips.push(['dim:' + k, 'Narrows by', k === 'none' ? 'No conditions' : DIM[k].l]);
  });
  /* A postal code implies its country, so the country chip beside it says the
     same thing twice and takes a second click to undo something already gone. */
  const deepest = [...VSEL].filter(v => ![...VSEL].some(o => o !== v && o.indexOf(v + '|') === 0));
  /* The child's own words, not geography's. "DTC · postal code Shopify DTC"
     was the geography formatter applied to a channel. */
  deepest.forEach(v => {
    const p = String(v).split('|');
    /* The deepest name only. "DTC · Amazon Seller Partner" repeated the group
       the chip is already labelled with and made three channels wider than the
       row, so they wrapped and shoved the sort controls down. Geography keeps
       its parent, because "postal code IL" without a country is not a place. */
    /* Trimmed the same way the column trims it. An applied chip is a group name
       and a value side by side, so "Order value · orders over $20" said order
       twice in four words — the same repetition, in the one line that reports
       what is currently on. */
    const label = !p[2] ? navLabel(p[0], p[1])
                : p[0] === 'geo' ? p[1] + ' · postal code ' + p[2]
                : p[2];
    chips.push(['val:' + v, DIM[p[0]] ? DIM[p[0]].l : 'Value', label,
                CHANNEL_LOGO[p[2]] || CHANNEL_LOGO[p[1]] || null]); });
  /* Only when it narrows something — the full span is the resting state, and a
     chip for it would claim a filter that is not on. */
  if (!fullSpan()) chips.push(['win', 'Dates', fmtDate(fFrom) + ' - ' + fmtDate(fTo)]);
  if (fBy !== 'all')  chips.push(['by', 'Updated by', fBy === 'me' ? 'You' : 'Not recorded']);
  if (fCreatedBy !== 'all') chips.push(['created', 'Created by', fCreatedBy === 'me' ? 'You' : 'Not recorded']);
    if (fState !== 'all')  chips.push(['state',  'Result', fState === 'issues' ? 'Data issues'
                                     : fState === 'negltv' ? 'Negative LTV' : STATE[fState].l]);
  if (fFolder !== 'all') chips.push(['folder', 'Folder', fFolder === 'none' ? 'Ungrouped'
                                     : (FOLDERS.find(f => f.id === fFolder) || {}).name]);
  if (q)                 chips.push(['q',      'Search', '“' + q + '”']);

  document.getElementById('lsRangeLabel').textContent = fmtDate(fFrom) + '  -  ' + fmtDate(fTo);
  document.getElementById('lsRange').classList.toggle('iris-datepicker-input--filled', !fullSpan());

  syncFilterBtn();
  drawPickBar();

  document.getElementById('lsSum').innerHTML =
    '<span class="dr-sum__n"><b>' + rows.length + '</b> of ' + SEGMENTS.length + ' segments</span>' +
    /* No conjunctions and no group name on an applied chip. Both were mine, and
       neither is theirs: read off /cohorts on 2026-09-08, an applied channel is
       a 34x30 button carrying its logo and nothing else — no text, no "or", no
       label in front of it. The group name lives inside the panel, where it
       reads "DTC Sales channels".

       The kind of filter is still named for a value that is not self-evident —
       a country code or a percentile means little on its own — but a channel
       carries its own mark and needs no word in front of it. */
    chips.map((c, i) =>
      '<span class="iris-chip iris-chip--light dr-fchip' + (c[3] ? ' dr-fchip--logo' : '') + '">' +
        (c[3] || (i && chips[i - 1][1] === c[1]) ? '' : '<span class="dr-fchip__k">' + c[1] + '</span>') +
        /* A channel is its mark and nothing else, the way the product shows one.
           The name is on the chip's label and its tooltip, so it is there for a
           screen reader and on hover without spending a third of the row. */
        /* No remove button. Theirs has none: an applied channel on /cohorts is a
           logo and nothing else, and a filter comes off in the panel it went on
           in. The chip is a statement of what is applied, not a control. */
        (c[3] ? '<img class="dr-fchip__logo" src="' + c[3] + '" alt="' + esc(c[1] + ' ' + c[2]) + '" width="18" height="18" title="' + esc(c[2]) + '">'
              : esc(c[2])) +
        '</span>').join('') +
    (chips.length > 1 ? '<button class="dr-rail__reset dr-appliedreset" id="lsClear">Reset all</button>' : '') +
    '';

  const head = '<thead><tr>' +
      /* The library's checkbox, not the browser's. .iris-checkbox is a
         <span role="checkbox"> in the library; the native input stays because
         it is what a keyboard and a screen reader operate, clipped out of
         sight, and the span is what is drawn. Tinting the native control with
         accent-color left the operating system drawing the box. */
      '<th class="dr-pick"><label class="dr-pick__hit"><input type="checkbox" id="lsAll" class="seg-sr"' +
        ' aria-label="Select all ' + rows.length + ' segments shown">' +
        '<span class="iris-checkbox" aria-hidden="true"></span></label></th>' +
      COLS.map(c =>
      '<th class="' + (c.n ? 'n' : '') + '" data-col="' + c.k + '"' + (sort.k === c.k ? ' aria-sort="' + (sort.dir === 'desc' ? 'descending' : 'ascending') + '"' : '') + '>' +
      '<button class="dr-sort" data-sort="' + c.k + '">' + c.l + ' <span class="c" aria-hidden="true">▾</span></button></th>').join('') +
      '<th style="width:108px;"><span class="seg-sr">Actions</span></th></tr></thead>';

  const rowHtml = s =>
    '<tr data-href="./segment-detail-v2.html?id=' + s.id + '"' + (PICKED.has(s.id) ? ' class="is-picked"' : '') + '>' +
      /* The label is the target, not the 16px box: WCAG 2.5.8 asks 24x24 and a
         checkbox renders at 16 in every browser. Clicking anywhere in the cell
         ticks it. */
      '<td class="dr-pick"><label class="dr-pick__hit"><input type="checkbox" class="seg-sr" data-pick="' + s.id + '"' +
        (PICKED.has(s.id) ? ' checked' : '') +
        ' aria-label="Select ' + esc(s.n) + '">' +
        '<span class="iris-checkbox' + (PICKED.has(s.id) ? ' iris-checkbox--checked' : '') + '" aria-hidden="true"></span></label></td>' +
      '<td>' + nameCell(s) + '</td>' +
      '<td class="n">' + customersCell(s) + '</td>' +
      '<td class="n">' + (s.o == null ? DASH : fmtN(s.o)) + '</td>' +
      '<td class="n">' + (s.net == null ? DASH : fmt$(s.net)) + '</td>' +
      '<td class="n">' + ltvCell(s.ltv) + '</td>' +
      '<td class="n" style="white-space:nowrap;">' + fmtDate(s.cr) + '</td>' +
      '<td class="n" style="white-space:nowrap;">' + fmtDate(s.up) +
        '<div class="sub">' + relTime(s.up) + '</div></td>' +
      /* The live product reveals four buttons on row hover: Analyze segment
         (a bar chart), Ask Fin (a robot), Calculate metrics (a play triangle)
         and the overflow. Two of them are kept, with the product's own glyphs
         and its own words — I had merged them into one "Analyze with Fin",
         which is two different actions wearing one name.

         Calculate metrics is not kept. It is the Run button, and the product owner's first
         note was that nothing on this page should need running. */
      '<td class="dr-rowacts">' +
      '<button class="seg-iconbtn dr-rowact" data-analyze="' + s.id + '" aria-label="Analyze ' + esc(s.n) + '" title="Analyze segment">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9h4v11H4zm12 4h4v7h-4zm-6-9h4v16h-4z"/></svg></button>' +
      '<button class="seg-iconbtn dr-rowact dr-ask" data-ask="' + s.id + '" aria-label="Ask Fin about ' + esc(s.n) + '" title="Ask Fin">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3M7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5M16 17H8v-2h8zm-1-4c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13"/></svg></button>' +
      '<button class="seg-iconbtn dr-kebab" data-menu="' + s.id + '" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ' + esc(s.n) + '">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></td>' +
    '</tr>';

  /* Groups are FOLDERS now, not the old derived Type.
     Type grouped by a machine guess: one label per segment, picked from its
     first matching condition, so the same segment could not appear beside the
     others that share its product. Folders are the user's own arrangement, and
     grouping by them is what makes the folder worth creating.

     Grouping is off while the rail is already showing one folder — the groups
     would be a single group — and while a column sort is in force, because
     that sort is a question about all rows at once. */
  const canGroup = grouped;
  const groupBody = () => FOLDERS.map(f => [f.id, f.name])
    .concat([['none', 'Ungrouped']])
    .map(([k, label]) => {
      const g = rows.filter(r => (folderOf(r) || { id: 'none' }).id === k);
      if (!g.length) return '';
      /* One surviving group still gets its header when that group is a real
         folder — it says which. "Ungrouped" over everything is the honest
         picture of an account with no folders yet, and it beats a Grouped
         control that appears to do nothing. */
      if (g.length === rows.length && k !== 'none' && !FOLDERS.length)
        return '<tbody>' + g.map(rowHtml).join('') + '</tbody>';
      const open = !COLLAPSED.has(k);
      /* NOT a sum. Segments overlap, so adding their customer counts produced
         223,690 against a base of 35,590 — the additive trap that got
         "% of company revenue" removed from the segment page. The largest
         member is a real number and answers what the header is for. */
      return '<tbody class="dr-grp">' +
        /* Nine columns, not eight: the pick box, the seven in COLS and the
           actions. At 8 the group header stopped 132px short of the table's
           right edge and the band looked cut off. */
        '<tr class="dr-grp__h"><td colspan="' + (COLS.length + 2) + '">' +
        '<button class="dr-grp__b" data-grp="' + k + '" aria-expanded="' + open + '">' +
          svg(open ? 'm19.5 8.25-7.5 7.5-7.5-7.5' : 'm8.25 4.5 7.5 7.5-7.5 7.5', 14) +
          '<span class="card-icon card-icon-indigo" aria-hidden="true">' +
            svg(k === 'none' ? IC.folderOpen : IC.folder, 15) + '</span>' +
          '<b>' + esc(label) + '</b>' +
          '<span class="dr-grp__n">' + g.length + '</span>' +
        '</button></td></tr>' +
        (open ? g.map(rowHtml).join('') : '') + '</tbody>';
    }).join('');

  const body = rows.length ? (canGroup ? groupBody() : '<tbody>' + rows.map(rowHtml).join('') + '</tbody>')
    : '<tbody><tr><td colspan="' + (COLS.length + 2) + '">' +
      '<div class="dr-empty"><span class="card-icon card-icon-gray">' + svg(IC.box, 22) + '</span>' +
      '<h3>No segments match these filters</h3>' +
      '<p>All ' + SEGMENTS.length + ' segments are still here. Clear the filters to see them.</p>' +
      '<button class="btn btn-md btn-primary" id="lsClear2" style="display:inline-flex;">Reset all</button></div></td></tr></tbody>';

  document.getElementById('lsTable').innerHTML =
    '<div class="dr-tablecard"><div class="dr-tw"><table class="dr-t dr-t--list">' + head + body + '</table></div></div>';
  /* After the table exists, not before: the header checkbox is part of it, and
     "some of the shown rows" is a third state that `checked` alone cannot say. */
  syncPickAll();
  document.getElementById('lsLive').textContent = rows.length + ' of ' + SEGMENTS.length + ' segments shown.';
}

/* ── interaction ────────────────────────────────────────────────────────── */
/* "Reset all" under the toolbar is on the line that lists everything applied,
   navigation included, so it resets everything. One word for one idea across
   the whole redesign: "Reset all" wherever a control empties a whole set,
   "Reset" where it empties one group. It used to say "Clear all" here and
   "Reset all" in the panel eighty pixels away, for the same kind of act. */
function clearAll() { DSEL.clear(); VSEL.clear(); fFrom = SPAN.from; fTo = SPAN.to; fBy = 'all'; fCreatedBy = 'all'; fState = 'all'; fFolder = 'all'; q = ''; document.getElementById('lsQ').value = ''; render(); }
/* "Reset all" inside the Filters panel clears the filters and leaves you
   standing where you were. It is inside a dialog headed "Filters"; taking the
   reader out of the folder or the dimension they had opened, from a control
   that never mentions either, is the panel reaching outside itself. */
function clearFilters() {
  [...VSEL].forEach(t => { if (isFilterTok(t)) VSEL.delete(t); });
  fState = 'all'; fBy = 'all'; fCreatedBy = 'all';
  render();
}

/* What the badge counts is what the button HIDES. The navigation column, the
   search box and the range picker are all on screen already and say their own
   state; adding them here made the badge read 3 when nothing was behind the
   button at all. */
function countFilters() {
  return filterVals().size + (fBy !== 'all' ? 1 : 0) +
         (fCreatedBy !== 'all' ? 1 : 0) + (fState !== 'all' ? 1 : 0);
}
function syncFilterBtn() {
  const n = countFilters(), b = document.getElementById('lsFilterN');
  if (!b) return;
  b.hidden = !n; b.textContent = n;
  document.getElementById('lsFilters').setAttribute('aria-label',
    n ? 'Filters, ' + n + ' applied' : 'Filters');
}
(function panel() {
  const btn = document.getElementById('lsFilters'), box = document.getElementById('lsPanel');
  const open = on => {
    box.hidden = !on;
    btn.setAttribute('aria-expanded', String(on));
    if (on) (box.querySelector('.dr-chip') || box).focus();
  };
  btn.addEventListener('click', () => open(box.hidden));
  document.getElementById('lsResetAll').addEventListener('click', () => { clearFilters(); open(true); });
  /* Escape closes and hands focus back; a click outside closes without moving
     it, because the click has already put focus where the reader wanted it. */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !box.hidden) { open(false); btn.focus(); }
  });
  document.addEventListener('click', e => {
    if (box.hidden) return;
    if (!box.contains(e.target) && !btn.contains(e.target)) open(false);
  }, true);
})();

/* ── The order-window range picker ────────────────────────────────────────
   Built on the library's .iris-cal / .iris-cal--range, laid out the way the
   product's own is: named periods down the left, two months of calendar beside
   them, Cancel and Apply at the foot. Clicking a day sets the start, the next
   click sets the end, and the days between light up as you move over them.

   The presets are read off the product's own list, minus the ones this data
   cannot answer. Nothing is applied until Apply, so a half-made range never
   filters the table underneath. */
(function rangePicker() {
  const btn = document.getElementById('lsRange');
  const box = document.getElementById('lsCal');
  let a = null, b = null, hover = null, month = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1);

  const PRESETS = [
    ['Last 7 days',        () => [addDays(TODAY, -7), TODAY]],
    ['Last 30 days',       () => [addDays(TODAY, -30), TODAY]],
    ['Last 90 days',       () => [addDays(TODAY, -90), TODAY]],
    ['This year',          () => [new Date(TODAY.getFullYear(), 0, 1), TODAY]],
    ['Last year',          () => [new Date(TODAY.getFullYear() - 1, 0, 1), new Date(TODAY.getFullYear() - 1, 11, 31)]],
    ['Trailing 12 months', () => [addDays(TODAY, -365), TODAY]]
  ];

  const same = (x, y) => x && y && x.toDateString() === y.toDateString();
  const mid  = (d, s, e) => s && e && d > s && d < e;
  const key  = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();

  function grid(first) {
    const y = first.getFullYear(), m = first.getMonth();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;      /* weeks start Monday */
    const days = new Date(y, m + 1, 0).getDate();
    let out = '<div><div class="iris-cal__title">' +
      first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) + '</div>' +
      '<div class="iris-cal__grid">' +
      ['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => '<span class="iris-cal__day-header">' + d + '</span>').join('');
    for (let i = 0; i < lead; i++) out += '<span class="iris-cal__day iris-cal__day--muted"></span>';
    for (let d = 1; d <= days; d++) {
      const date = new Date(y, m, d);
      const end = b || hover;
      const cls = ['iris-cal__day'];
      if (same(date, a)) cls.push('iris-cal__day--range-start', 'iris-cal__day--range-selected');
      if (same(date, b)) cls.push('iris-cal__day--range-end', 'iris-cal__day--range-selected');
      if (mid(date, a, end)) cls.push('iris-cal__day--in-range');
      if (same(date, TODAY)) cls.push('iris-cal__day--today');
      out += '<button class="' + cls.join(' ') + '" data-day="' + key(date) + '">' + d + '</button>';
    }
    return out + '</div></div>';
  }

  function draw() {
    const next = new Date(month.getFullYear(), month.getMonth() + 1, 1);
    box.innerHTML =
      '<div class="dr-cal__body">' +
        '<div class="dr-cal__presets">' + PRESETS.map((p, i) =>
          '<button class="dr-cal__preset" data-preset="' + i + '">' + p[0] + '</button>').join('') + '</div>' +
        '<div class="dr-cal__cals">' +
          '<div class="iris-cal__header">' +
            '<button class="iris-cal__nav" data-nav="-1" aria-label="Previous month">' +
              svg('M15.75 19.5 8.25 12l7.5-7.5', 15) + '</button>' +
            '<button class="iris-cal__nav" data-nav="1" aria-label="Next month">' +
              svg('m8.25 4.5 7.5 7.5-7.5 7.5', 15) + '</button>' +
          '</div>' +
          '<div class="iris-cal__months">' + grid(month) + grid(next) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="iris-cal__footer">' +
        '<span class="dr-cal__read">' + (a ? fmtDate(a) + (b ? ' – ' + fmtDate(b) : ' – …') : 'Pick a start date') + '</span>' +
        '<button class="btn btn-sm btn-alternative" data-cal="cancel">Cancel</button>' +
        '<button class="btn btn-sm btn-primary" data-cal="apply"' + (a && b ? '' : ' aria-disabled="true"') + '>Apply</button>' +
      '</div>';
  }

  function open(on) {
    box.hidden = !on;
    btn.setAttribute('aria-expanded', String(on));
    if (!on) return;
    a = fFrom; b = fTo; hover = null;
    month = new Date((fFrom || TODAY).getFullYear(), (fFrom || TODAY).getMonth(), 1);
    draw();
  }

  btn.addEventListener('click', () => open(box.hidden));

  box.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { month = new Date(month.getFullYear(), month.getMonth() + (+nav.dataset.nav), 1); return draw(); }

    const pre = e.target.closest('[data-preset]');
    if (pre) { const r = PRESETS[+pre.dataset.preset][1](); a = r[0]; b = r[1]; hover = null; return draw(); }

    const day = e.target.closest('[data-day]');
    if (day) {
      const p = day.dataset.day.split('-').map(Number);
      const d = new Date(p[0], p[1], p[2]);
      if (!a || b) { a = d; b = null; }             /* start a new range */
      else if (d < a) { b = a; a = d; }             /* dragged backwards */
      else b = d;
      hover = null;
      return draw();
    }

    const act = e.target.closest('[data-cal]');
    if (!act) return;
    if (act.dataset.cal === 'apply') {
      if (act.getAttribute('aria-disabled')) return;
      fFrom = a; fTo = b; render();
    }
    open(false); btn.focus();
  });

  /* The days between light up while the second date is still being chosen. */
  box.addEventListener('mouseover', e => {
    const day = e.target.closest('[data-day]');
    if (!day || !a || b) return;
    const p = day.dataset.day.split('-').map(Number);
    hover = new Date(p[0], p[1], p[2]);
    draw();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !box.hidden) { open(false); btn.focus(); }
  });
  document.addEventListener('click', e => {
    if (box.hidden) return;
    if (!box.contains(e.target) && !btn.contains(e.target)) open(false);
  }, true);
})();

/* Escape closes the group search and hands focus back to the mark that opened
   it, so there is a way out that is not "press the magnifier again". */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  /* The toolbar search is not in a group, and had no way out at all: no Escape,
     no clear button, and the native cross is suppressed page-wide. */
  if (e.target.id === 'lsQ') {
    e.stopPropagation();
    q = ''; e.target.value = ''; render();
    return;
  }
  const box = e.target.closest && e.target.closest('[data-gq]');
  if (!box) return;
  /* Without this the panel's own Escape fires on the same event and closes the
     whole dialog, which is not what clearing a search box should do. */
  e.stopPropagation();
  const id = box.dataset.gq;
  GQ[id] = ''; searchGrp = null;
  render();
  /* After the panel's own focus handling, not before it — render() puts focus
     back on the Filters trigger, which would swallow this. */
  setTimeout(() => document.querySelector('[data-find="' + id + '"]')?.focus(), 0);
});

/* Delegated, because the panel is redrawn on every change. Only the group's
   own chips are redrawn, and focus is put back in the box the reader is in. */
document.addEventListener('input', e => {
  const box = e.target.closest('[data-gq]') || e.target.closest('[data-navq]');
  if (!box) return;
  const nav = !!box.dataset.navq;
  GQ[nav ? 'nav:' + box.dataset.navq : box.dataset.gq] = box.value;
  const id = box.id, pos = box.selectionStart;
  nav ? drawNav() : drawRail();
  const again = document.getElementById(id);
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
});

document.getElementById('lsQ').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
/* ── Arrangement: radiogroup, with the arrow-key behaviour the pattern owes ── */
const arrBtns = [...document.querySelectorAll('[data-arr]')];
function syncArrangement() {
  /* Queried here rather than closed over: render() runs before the module's
     own `const arrBtns` in any future reordering, and reading a const in its
     temporal dead zone throws — `typeof` does not save you from that. */
  /* The control reports the reader's own choice and never moves on its own. */
  [...document.querySelectorAll('[data-arr]')].forEach(b => {
    const sel = b.dataset.arr === (grouped ? 'grouped' : 'flat');
    b.classList.toggle('active', sel);
    b.setAttribute('aria-checked', String(sel));
    b.tabIndex = sel ? 0 : -1;
  });
}

function setArrangement(next, focus) {
  grouped = next === 'grouped';
  render();
  if (focus) {
    const t = arrBtns.find(b => b.dataset.arr === next);
    if (t) { t.tabIndex = 0; t.focus(); }
  }
}
arrBtns.forEach((b, i) => {
  b.addEventListener('click', () => setArrangement(b.dataset.arr, false));
  b.addEventListener('keydown', e => {
    const map = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: arrBtns.length - 1 };
    if (!(e.key in map)) return;
    e.preventDefault();
    setArrangement(arrBtns[(map[e.key] + arrBtns.length) % arrBtns.length].dataset.arr, true);
  });
});

/* ── Definition detail: a switch ── */
document.getElementById('lsSort').addEventListener('change', e => {
  const k = e.target.value;
  sort = { k, dir: k === 'n' ? 'asc' : 'desc' };
  render();
});
document.addEventListener('click', e => {
  const inert = e.target.closest('[aria-disabled="true"]');
  if (inert && (inert.closest('#lsRail') || inert.closest('#lsNav'))) return;

  const an = e.target.closest('[data-analyze]');
  if (an) {
    const seg = SEGMENTS.find(x => x.id === an.dataset.analyze);
    return toast('Opening the analysis', '“' + seg.n + '” in the cohort view.');
  }
  const ask = e.target.closest('[data-ask]');
  if (ask) {
    const seg = SEGMENTS.find(x => x.id === ask.dataset.ask);
    return toast('Fin is reading “' + seg.n + '”',
      'It will come back with what stands out about these ' +
      (seg.c == null ? 'customers' : fmtN(seg.c) + ' customers') + ' and what to do next.');
  }

  const pick = e.target.closest('[data-pick]');
  if (pick) {
    pick.checked ? PICKED.add(pick.dataset.pick) : PICKED.delete(pick.dataset.pick);
    const tr = pick.closest('tr');
    if (tr) tr.classList.toggle('is-picked', pick.checked);
    /* A row is toggled in place rather than re-rendered, so the drawn box has
       to be told too — the native input is only the mechanism, the span is what
       anyone sees. */
    pick.parentElement.querySelector('.iris-checkbox')
        ?.classList.toggle('iris-checkbox--checked', pick.checked);
    drawPickBar(); syncPickAll();
    return;
  }
  if (e.target.id === 'lsAll') {
    const shown = SEGMENTS.filter(x => matchDim(x) && matchState(x) && matchFolder(x) && matchWin(x) && matchBy(x) && matchQ(x));
    e.target.checked ? shown.forEach(x => PICKED.add(x.id)) : shown.forEach(x => PICKED.delete(x.id));
    render();
    const back = document.getElementById('lsAll');
    if (back) back.focus();
    return;
  }
  if (e.target.closest('#pkClear'))   { PICKED.clear(); return render(); }
  if (e.target.closest('#pkArchive')) {
    const n = PICKED.size;
    return modal({
      title: 'Archive ' + n + ' segment' + (n > 1 ? 's' : '') + '?', confirmLabel: 'Archive',
      body: 'Archived segments stop appearing in this list. Anything already built on them keeps working.',
      onConfirm: () => { PICKED.clear(); render(); toast('Archived', n + ' segment' + (n > 1 ? 's' : '') + ' moved to Archived.'); }
    });
  }
  const cmp = e.target.closest('#pkCompare');
  if (cmp) {
    if (cmp.getAttribute('aria-disabled')) return;
    location.href = './segments-compare.html?v2=1&ids=' + [...PICKED].join(',');
    return;
  }
  const mv = e.target.closest('#pkMove');
  if (mv) return menu(mv, FOLDERS.map(f => ({ act: 'mv:' + f.id, ic: IC.folder, t: f.name }))
      .concat([{ act: 'mv:', ic: IC.folderOpen, t: 'Remove from folder' },
               { sep: true },
               { act: 'newf', ic: IC.folder, t: 'New folder…' }]), act => {
    if (act === 'newf') return newFolder([...PICKED]);
    const ids = [...PICKED];
    let f = null;
    ids.forEach(id => { f = fileInto(SEGMENTS.find(x => x.id === id), act.slice(3)); });
    PICKED.clear(); render();
    toast(f ? 'Moved to ' + f.name : 'Removed from folder',
          ids.length + ' segment' + (ids.length > 1 ? 's' : '') + '.');
  });

  const by = e.target.closest('[data-by]');
  if (by) { fBy = fBy === by.dataset.by ? 'all' : by.dataset.by; return keepFocus(by, render); }

  const cre = e.target.closest('[data-created]');
  if (cre) {
    fCreatedBy = fCreatedBy === cre.dataset.created ? 'all' : cre.dataset.created;
    return keepFocus(cre, render);
  }

  const rs = e.target.closest('[data-reset]');
  if (rs) {
    const g = rs.dataset.reset;
    /* A group's Reset clears only that group. */
    if (g.startsWith('val:')) {
      const k = g.slice(4);
      [...VSEL].forEach(t => { if (String(t).split('|')[0] === k) VSEL.delete(t); });
    }
    if (g === 'state')  fState = 'all';
    if (g === 'by')      fBy = 'all';
    if (g === 'created') fCreatedBy = 'all';
    render();
    /* The Reset button removes itself, so focus goes to the group it emptied
       rather than to the top of the document. */
    const id = g === 'state' ? 'rl-res' : g === 'by' ? 'rl-by'
             : g === 'created' ? 'rl-cre'
             : g === 'val:channel' ? 'rl-chan' : 'rl-aud';
    const back = document.querySelector('[aria-labelledby="' + id + '"] .dr-chip');
    if (back) back.focus();
    return;
  }

  const gs = e.target.closest('[data-gq]') || e.target.closest('[data-navq]');
  if (gs) return;

  const vv = e.target.closest('[data-val]');
  if (vv) {
    const v = vv.dataset.val;
    if (VSEL.has(v)) {
      VSEL.delete(v);
      /* Closing a country closes the postal codes inside it; leaving them on
         would filter invisibly, with nothing on screen to say why. */
      [...VSEL].forEach(o => { if (o.indexOf(v + '|') === 0) VSEL.delete(o); });
    } else VSEL.add(v);
    return keepFocus(vv, render);
  }

  /* ── The navigation column ─────────────────────────────────────────────
     Single-select at every level. Choosing a place replaces the place you were
     in; it never adds to it, and it never touches the filter panel. Pressing
     the place you are already in is the second way out, beside "All segments". */
  const more = e.target.closest('[data-more]');
  if (more) { NAV_MORE.add(more.dataset.more); return keepFocus(more, render); }

  const nv = e.target.closest('[data-nav]');
  if (nv) {
    const v = nv.dataset.nav;
    const dropNavVals = () =>
      [...VSEL].forEach(t => { if (!isFilterTok(t)) VSEL.delete(t); });

    if (v === 'all') { DSEL.clear(); dropNavVals(); fFolder = 'all'; }
    else if (v.startsWith('folder:')) {
      const id = v.slice(7);
      fFolder = fFolder === id ? 'all' : id;
    }
    else if (v.startsWith('dim:')) {
      const k2 = v.slice(4);
      const was = DSEL.has(k2);
      DSEL.clear(); dropNavVals();
      if (!was) DSEL.add(k2);
    }
    else if (v.startsWith('state:')) {
      const k2 = v.slice(6);
      fState = fState === k2 ? 'all' : k2;
    }
    else if (v.startsWith('val:')) {
      const tok = v.slice(4), was = VSEL.has(tok);
      /* One token at a time: the place you are standing, not the trail of
         breadcrumbs behind you. Two values of one dimension in VSEL are an OR,
         which is the opposite of drilling in. */
      dropNavVals();
      /* Pressing the value you are already on clears it and leaves you on the
         dimension, which is the second way out. */
      if (!was) VSEL.add(tok);
    }
    return keepFocus(nv, render);
  }
  /* Chips toggle. There is no "Any result" chip standing in for no filter, so
     pressing the one that is on is how you turn it off. */
  /* One at a time: opening a group's search closes whichever was open, and
     closing one drops its query — a filter still applied behind a box nobody
     can see is a group quietly hiding its own values. */
  const gcl = e.target.closest('[data-gqclear]');
  if (gcl) {
    const id = gcl.dataset.gqclear;
    GQ[id] = ''; render();
    setTimeout(() => document.getElementById('gq-' + id)?.focus(), 0);
    return;
  }
  const ncl = e.target.closest('[data-navqclear]');
  if (ncl) {
    const k2 = ncl.dataset.navqclear;
    GQ['nav:' + k2] = ''; render();
    setTimeout(() => document.getElementById('navq-' + k2)?.focus(), 0);
    return;
  }
  const fnd = e.target.closest('[data-find]');
  if (fnd) {
    const id = fnd.dataset.find;
    if (searchGrp && searchGrp !== id) GQ[searchGrp] = '';
    if (searchGrp === id) { GQ[id] = ''; searchGrp = null; }
    else searchGrp = id;
    render();
    const box = document.getElementById('gq-' + id);
    (box || document.querySelector('[data-find="' + id + '"]'))?.focus();
    return;
  }

  const st = e.target.closest('[data-state]');
  if (st) { fState = fState === st.dataset.state ? 'all' : st.dataset.state; return keepFocus(st, render); }
  const fo = e.target.closest('[data-folder]');
  if (fo) { fFolder = fFolder === fo.dataset.folder ? 'all' : fo.dataset.folder; return keepFocus(fo, render); }
  const gp = e.target.closest('[data-grp]');
  if (gp) {
    const k = gp.dataset.grp;
    COLLAPSED.has(k) ? COLLAPSED.delete(k) : COLLAPSED.add(k);
    return keepFocus(gp, render);
  }
  const so = e.target.closest('[data-sort]');
  if (so) {
    const key = so.dataset.sort;
    sort = { k: key, dir: sort.k === key && sort.dir === 'desc' ? 'asc' : 'desc' };
    const sel = document.getElementById('lsSort');
    sel.value = [...sel.options].some(o => o.value === key) ? key : 'attention';
    return keepFocus(so, render);
  }
  if (e.target.closest('#lsClear') || e.target.closest('#lsClear2')) return clearAll();
  if (e.target.closest('#lsNewFolder')) return newFolder();

  const ex = e.target.closest('[data-export]');
  if (ex) return toast('Export started', 'The segment list is being prepared as CSV.');

  const mb = e.target.closest('[data-menu]');
  if (mb) { openMenu(mb); return; }
  /* A click on any menu trigger is handled by that trigger's own listener. Without
     this guard the delegated close ran in the same event and shut the menu the
     button had just opened. */
  if (!e.target.closest('.dr-menu') && !e.target.closest('[aria-haspopup="menu"]')) closeMenu();

  /* Whole-row click. The row carries no role or tabindex: the name link is the
     single keyboard stop, and this only mirrors it for the mouse. Clicks on the
     link itself, the overflow button or any text selection are left alone. */
  const tr = e.target.closest('tr[data-href]');
  /* The select cell is part of the row but is not a way into the segment: a
     click there ticks the box and must not navigate away from the list the
     reader is building a selection in. */
  if (tr && !e.target.closest('a') && !e.target.closest('button') && !e.target.closest('.dr-pick')) {
    if ((getSelection() || {}).toString()) return;
    location.href = tr.dataset.href;
  }
});

/* `assign` is a list: the row menu passes one id, the selection bar passes all
   of them, and a folder created from a selection arrives already filled. */
function newFolder(assign) {
  const ids = assign == null ? [] : (Array.isArray(assign) ? assign : [assign]);
  promptModal({
    title: 'New folder', confirmLabel: 'Create folder', label: 'Folder name',
    placeholder: 'High value, Retention, Paused…',
    onConfirm: name => {
      const f = { id: 'f' + Date.now().toString(36), name: name, ids: ids.slice() };
      FOLDERS.push(f); saveFolders();
      /* Selecting an empty folder shows "No segments match these filters" over
         a toast saying to move segments in from a row — with no rows on screen
         to move. Only jump to the folder when it already holds something. */
      if (ids.length) fFolder = f.id;
      /* The first folder is the moment grouping starts to say something, so the
         arrangement follows rather than waiting to be found. */
      if (FOLDERS.length === 1) setArrangement('grouped', false); else render();
      PICKED.clear();
      toast('Folder created', ids.length
        ? '“' + name + '” now holds ' + ids.length + ' segment' + (ids.length > 1 ? 's' : '') + '.'
        : '“' + name + '” is empty. Select segments and move them in.');
    }
  });
}
function moveTo(seg, fid) {
  const f = fileInto(seg, fid);
  render();
  toast(f ? 'Moved to ' + f.name : 'Removed from folder', '“' + seg.n + '”' + (f ? '' : ' is ungrouped again.'));
}

function openMenu(btn) {
  const s = SEGMENTS.find(x => x.id === btn.dataset.menu);
  const here = folderOf(s);
  menu(btn, [
    { lab: 'Work with this segment' },
    /* The live product's row menu is Calculate · Analyze · Edit · Export Emails
       · Delete. Calculate is gone on purpose — The product owner's first note was that
       nothing should need running. Analyze went with it by accident, and it is
       the one that hands the segment to Fin, which is the half of the product
       he spent four minutes of the review inside. */
    { act: 'analyze', ic: IC.chart, t: 'Analyze segment' },
    { act: 'ask',     ic: IC.spark, t: 'Ask Fin' },
    { href: './segment-builder.html?v2=1&id=' + s.id, ic: IC.pencil, t: 'Edit definition' },
    { act: 'dup',     ic: IC.copy,  t: 'Duplicate' },
    { act: 'export',  ic: IC.down,  t: 'Export emails' },
    { sep: true },
    { lab: here ? 'In folder ' + here.name : 'Not in a folder' }
  ].concat(FOLDERS.filter(f => !here || f.id !== here.id).map(f =>
    ({ act: 'mv:' + f.id, ic: IC.folder, t: 'Move to ' + f.name })
  )).concat(here ? [{ act: 'mv:', ic: IC.folderOpen, t: 'Remove from folder' }] : [])
   .concat([
    { act: 'newf', ic: IC.folder, t: 'Move to a new folder…' },
    { sep: true },
    { act: 'archive', ic: IC.box,   t: 'Archive' },
    { act: 'del',     ic: IC.trash, t: 'Delete', danger: true }
  ]), act => {
    if (act === 'analyze') return toast('Opening the analysis', '“' + s.n + '” in the cohort view.');
    if (act === 'ask') return toast('Fin is reading “' + s.n + '”',
      'It will come back with what stands out about these ' +
      (s.c == null ? 'customers' : fmtN(s.c) + ' customers') + ' and what to do next.');
    if (act.startsWith('mv:')) return moveTo(s, act.slice(3));
    if (act === 'newf')    return newFolder(s.id);
    if (act === 'dup')     toast('Segment duplicated', '“' + s.n + ' (copy)” is ready to edit.');
    if (act === 'export')  toast('Export started', 'Emails for “' + s.n + '” will arrive by email.');
    if (act === 'archive') toast('Segment archived', '“' + s.n + '” moved to Archived.');
    if (act === 'del') modal({
      title: 'Delete this segment?', danger: true, confirmLabel: 'Delete segment',
      body: '<p style="margin:0;font-size:13px;color:var(--color-text-body);">“<strong>' + esc(s.n) +
            '</strong>” will be removed for everyone. Reports built on it will stop working. This cannot be undone.</p>',
      onConfirm: () => toast('Segment deleted', '“' + s.n + '” was removed.')
    });
  });
}

/* The two split buttons. Menu items name what they act on, so "Export" from a
   filtered list cannot be confused with exporting all forty. */
document.getElementById('lsMore').addEventListener('click', e => {
  /* Everything that is neither finding nor creating a segment. Upload and
     Export were two icon-only buttons in the row, each opening a menu of its
     own — two anonymous squares for actions nobody touched once in the twenty
     minutes of the review. They are entries here instead.

     Compare and Archive are still not here: both act on a selection, and the
     selection bar offers them the moment a row is ticked. An entry whose only
     answer is "pick two first" is a control that exists to refuse. */
  const shown = document.querySelectorAll('.dr-t tbody tr[data-href]').length;
  menu(e.currentTarget, [
    { act: 'newf', ic: IC.folder, t: 'New folder…' },
    { sep: true },
    { lab: 'Create from a list' },
    { act: 'im:emails', ic: IC.users,   t: 'CSV of email addresses' },
    { act: 'im:ids',    ic: IC.layers,  t: 'CSV of customer IDs' },
    { act: 'im:orders', ic: IC.receipt, t: 'CSV of order numbers' },
    { sep: true },
    { lab: 'Export' },
    { act: 'ex:view',   ic: IC.down,  t: 'This view as CSV (' + shown + ')' },
    { act: 'ex:all',    ic: IC.down,  t: 'All ' + SEGMENTS.length + ' segments as CSV' },
    { act: 'ex:emails', ic: IC.users, t: 'Customer emails for this view' }
  ], act => {
    if (act === 'newf') return newFolder(null);
    if (act.startsWith('im:')) return startImport(act.slice(3));
    if (act === 'ex:view')   toast('Export started', shown + ' segments are being prepared as CSV.');
    if (act === 'ex:all')    toast('Export started', 'All ' + SEGMENTS.length + ' segments are being prepared as CSV.');
    if (act === 'ex:emails') toast('Export started', 'Customer emails for the ' + shown + ' segments in view will arrive by email.');
  });
});

document.getElementById('lsNew').addEventListener('click', e => {
  menu(e.currentTarget, [
    /* The product owner, 2026-09-03, on the two ways he wants to get one: "you can either do
       it with an LLM, or you can build it by hand", and, on the list itself,
       "maybe some of them are prebuilt for you". All three ways start here
       rather than only being discoverable once you are already inside the
       builder. The prebuilt definitions are not repeated in this menu: one
       catalogue, in the builder, so the two pages cannot come to disagree
       about what a template contains.

       The wording is the product's, read off /automations on 2026-09-07 rather
       than paraphrased: "Generate with Fin — Tell Fin what you want" and
       "Manual — Configure the automation yourself". Same two lines, same order,
       Fin first. */
    { act: 'desc', ic: IC.wand,   t: 'Generate with Fin', sub: 'Tell Fin what you want' },
    { act: 'tpl',  ic: IC.copy,   t: 'Start from a prebuilt segment', sub: 'Pick a definition and adjust it' },
    { href: './segment-builder.html?v2=1', ic: IC.pencil, t: 'Manual', sub: 'Configure the segment yourself' },
    { sep: true },
    { act: 'dup',  ic: IC.copy,  t: 'Duplicate an existing segment' }
  ], act => {
    if (act === 'desc') location.href = './segment-builder.html?v2=1#describe';
    if (act === 'tpl') location.href = './segment-builder.html?v2=1#templates';
    if (act === 'dup') toast('Pick a segment', 'Choose Duplicate from any row to start from it.');
  });
});
/* Data Rooms' Upload brings a file into the room. The segment equivalent is
   bringing a customer list in from outside and treating it as a segment — the
   path every comparable tool has (Klaviyo, Mailchimp, HubSpot) and the one this
   redesign had dropped entirely. A list-based segment does not drift, which is
   also the honest answer to "these 400 people from the trade show". */
/* ── Import ───────────────────────────────────────────────────────────────
   His Upload takes a file on the main half and offers variants on the caret.
   Mine opened the same menu from both, so the primary action did not do the
   primary thing. The main half now opens a file picker, and the file is read
   in the browser — the row count and the column names below are read out of
   the file the user actually chose. Nothing is sent anywhere. */
function readCsv(file) {
  const r = new FileReader();
  r.onload = () => {
    const text  = String(r.result || '');
    const lines = text.split(/\r?\n/).filter(l => l.trim().length);
    const cols  = (lines[0] || '').split(/[,;\t]/).map(c => c.replace(/^["']|["']$/g, '').trim()).filter(Boolean);
    const rows  = Math.max(0, lines.length - 1);
    const guess = cols.findIndex(c => /e-?mail/i.test(c));
    /* modal() clears the dialog before it runs onConfirm, so the select is gone
       by the time the handler fires. The choice is tracked as it is made. */
    let chosen = cols[guess < 0 ? 0 : guess] || 'column 1';
    setTimeout(() => {
      const sel = document.getElementById('impCol');
      if (sel) sel.addEventListener('change', e => { chosen = cols[e.target.value] || chosen; });
    }, 0);
    modal({
      title: 'Create a segment from this list',
      confirmLabel: 'Create segment',
      body:
        '<div class="dr-cond" style="padding-top:0;">' +
          '<span class="card-icon card-icon-teal" aria-hidden="true">' + svg(IC.dash, 15) + '</span>' +
          '<div class="dr-cond__t"><div class="dr-cond__l">' + esc(file.name) + '</div>' +
          '<div class="dr-cond__s">' + fmtN(rows) + ' row' + (rows === 1 ? '' : 's') + ' · ' +
          (file.size < 1024 ? file.size + ' bytes' : fmtN(Math.round(file.size / 1024)) + ' KB') + ' · ' + cols.length + ' column' + (cols.length === 1 ? '' : 's') + '</div></div></div>' +
        '<div class="form-group" style="margin:14px 0 0;">' +
          '<label class="form-label" for="impCol">Which column identifies the customer?</label>' +
          '<select class="form-select dr-select" id="impCol" style="width:100%;">' +
            cols.map((c, i) => '<option value="' + i + '"' + (i === (guess < 0 ? 0 : guess) ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
          '</select></div>' +
        '<p class="dr-note">Iris matches these against known customers and builds a fixed list. ' +
        'A list-based segment does not drift when a definition changes, which is the point of importing one. ' +
        'Nothing leaves this browser in the prototype.</p>',
      onConfirm: () => {
        /* The file becomes a segment of its own kind: a fixed membership rather
           than a rule. It is the only sort that has something you can upload
           into later, which is why its page carries "Update the list". */
        const rec = {
          id: 'L' + Date.now().toString(36),
          n: file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
          file: file.name, rows: rows, col: chosen,
          cr: fmtDate(new Date()), up: fmtDate(new Date())
        };
        const all = loadLists(); all.push(rec); saveLists(all);
        location.href = './segment-detail-v2.html?id=' + rec.id;
      }
    });
  };
  r.readAsText(file.slice(0, 65536));
}
document.getElementById('lsFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) readCsv(f);
});

/* Picking which column the uploaded file is matched on. The menu that used to
   wrap this moved into the page overflow; this is what its entries call. */
function startImport(kind) {
  document.getElementById("lsFile").click();
}


document.getElementById('skipLink').addEventListener('click', e => {
  e.preventDefault();
  const b = document.getElementById('lsBody'); b.setAttribute('tabindex', '-1'); b.focus();
});

/* The markup ships with Grouped pressed. On an account with no folders the
   state above says otherwise, and the two have to agree before first paint. */
setArrangement(grouped ? 'grouped' : 'flat', false);
render();
initSidebar();
</script>
</body>
