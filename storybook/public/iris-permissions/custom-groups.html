let groupSeq = 0;
function makeGroup(name, description, start) {
  const g = { id:'g' + (++groupSeq), name, description, start, pages:{}, metrics:{}, metricOff:{}, conns:{}, edit:{}, payroll:null, payrollSnapshot:null };
  const none = start === 'nothing';
  const t = TEMPLATES.find(x => x.id === start);
  ITEMS.forEach(i => {
    let on = !none && !i.defaultOff;
    if (t && t.deny && t.deny.includes(i.id)) on = false;
    if (t && t.allow && !PARENT[i.id]) on = t.allow.includes(i.id);
    if (t && t.allow && PARENT[i.id]) on = true;
    g.pages[i.id] = on;
    if (!PARENT[i.id]) g.edit[i.id] = !none && !(t && t.readOnly);
  });
  METRICS.forEach(m => { g.metrics[m[0]] = !none; });
  CONNS.forEach(c => { g.conns[c] = !none; });
  return g;
}

  const g = baseOf(id);
  const n = membersOf(id).length;
  const body = `<p style="margin:0;font-size:14px;line-height:20px;color:#111928;">${n ? n + (n === 1 ? ' member moves' : ' members move') + ' to Full Access and can open everything again.' : 'No members are assigned to this group.'}</p>`;
  openModal('deleteGroup', 'Delete ' + g.name + '?', body, '<button type="button" class="btn btn-alternative btn-md" id="delCancel" data-autofocus>Cancel</button><button type="button" class="btn btn-md pm-danger-solid" id="delConfirm">Delete group</button>');
  document.getElementById('delCancel').onclick = closeModal;
  document.getElementById('delConfirm').onclick = ev => {
    const at = state.groups.indexOf(g);
    const moved = MEMBERS.filter(m => m.groupId === id).map(m => ({ m, over:m.over, diff:m.diff }));
    moved.forEach(x => { x.m.groupId = FULL; x.m.over = null; x.m.diff = 0; });
    state.groups.splice(at, 1);
    if (state.group === g) state.group = null;
    if (state.savedGroup === g) state.savedGroup = null;
    state.noDemo = true;
    if (state.peopleGroup === id) state.peopleGroup = 'all';
    closeModal();
    render(true);
    toast(g.name + ' deleted.' + (n ? ' ' + n + (n === 1 ? ' member moved' : ' members moved') + ' to Full Access.' : ''), () => {
      state.groups.splice(at, 0, g);
      moved.forEach(x => { x.m.groupId = id; x.m.over = x.over; x.m.diff = x.diff; });
      render(true);
      toast('Change undone.');
    }, ev.detail === 0);
  };
}

/* ---------- Render ---------- */
function view() { return (location.hash || '#groups').slice(1).split('/')[0]; }
function hashPerson() { const id = +(location.hash || '').split('/')[1]; return MEMBERS.some(m => m.id === id) ? id : null; }
/* The side list ends at the window's edge, so its last rows can always be reached without scrolling the page. */
function fitSideList() {
  const sc = document.getElementById('peopleScroll');
  if (sc) sc.style.maxHeight = Math.max(200, window.innerHeight - Math.max(0, sc.getBoundingClientRect().top) - 8) + 'px';
}
window.addEventListener('scroll', fitSideList, { passive:true });
window.addEventListener('resize', fitSideList);
/* Moves the side list only when the open person is out of view. */
function revealActive() {
  const sc = document.getElementById('peopleScroll');
  const a = sc && sc.querySelector('.pm-person.is-active');
  if (!a) return;
  const box = sc.getBoundingClientRect();
  const row = a.getBoundingClientRect();
  const bottom = Math.min(box.bottom, window.innerHeight - 8);
  if (row.top < box.top) sc.scrollTop -= box.top - row.top + 8;
  else if (row.bottom > bottom) sc.scrollTop += row.bottom - bottom + 8;
}
function render(keepScroll) {
  if (view() === 'group' && !state.group && state.noDemo) history.replaceState(null, '', '#groups');
  const v = view();
  const oldList = document.getElementById('peopleScroll');
  const listTop = oldList ? oldList.scrollTop : 0;
  state.cardMenu = null;
  const pid = v === 'permissions' ? hashPerson() : null;
  if (v === 'permissions' && !pid && location.hash.includes('/')) history.replaceState(null, '', '#permissions');
  if (pid) {
    if (state.personId !== pid) { state.personId = pid; state.personGroup = null; state.pickerOpen = false; resetEditorView(); }
    enterPeople();
  } else {
    leavePeople();
    state.personId = null;
  }
  if (v === 'group' && !state.group) {
    const demo = makeGroup('Channel lead', '', 'everything');
    state.groups.push(demo);
    state.group = demo;
    state.saveMsg = '';
  }
  const app = document.getElementById('app');
  app.innerHTML = v === 'permissions' ? viewPermissions() : v === 'group' ? viewGroup() : v === 'mcp' ? viewMcp() : v === 'connections' ? viewConnections() : v === 'settings' ? viewSettings() : viewGroups();
  document.title = v === 'permissions' ? (state.personId ? currentPerson().name + ' | User Permissions' : 'User Permissions') : v === 'group' ? state.group.name + ' | Groups' : v === 'mcp' ? 'Connect AI tools' : v === 'connections' ? 'Connections' : v === 'settings' ? 'Settings' : 'Groups';
  if (!keepScroll) window.scrollTo(0, 0);
  const newList = document.getElementById('peopleScroll');
  if (newList) { fitSideList(); newList.scrollTop = listTop; revealActive(); }
  const current = v === 'connections' ? 'Connections' : 'Settings';
  document.querySelectorAll('.pm-rail__item').forEach(b => { const on = b.title === current; b.classList.toggle('is-active', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
function updateEditor() {
  const v = view();
  if ((v !== 'group' && !(v === 'permissions' && state.personId)) || !state.group) return;
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  if (v === 'permissions') {
    syncPerson();
    const m = currentPerson();
    set('personLine', personLine(m));
    const sum = document.getElementById('personSummary');
    if (sum) { sum.innerHTML = personSummaryHtml(); sum.title = personSummary(); }
    if (!state.pickerOpen) set('pickerSlot', pickerHtml(m));
    set('peopleSlot', peopleListHtml());
  }
  set('payrollSlot', payrollHtml());
  set('tabBar', tabBarHtml());
  set('filterSlot', filterHtml());
  set('bulkSlot', toolbarHtml());
  set('rowsSlot', listHtml());
  if (active) { const el = document.querySelector(`[data-key="${CSS.escape(active)}"]`); (el || document.getElementById('tabSearch') || document.body).focus(); }
}
function setRail() {
  const rail = document.querySelector('aside');
  const go = (title, hash) => { const b = rail.querySelector(`[title="${title}"]`); if (b) b.onclick = () => { location.hash = hash; }; };
  const settings = rail.querySelector('[title="Settings"]');
  if (settings && !rail.querySelector('[title="Connections"]')) {
    const c = rail.querySelector('[title="Metrics"]').cloneNode(true);
    c.title = 'Connections'; c.setAttribute('aria-label', 'Connections'); c.classList.remove('active');
    rail.querySelector('[title="Metrics"]').parentNode.appendChild(c);
  }
  go('Connections', '#connections');
  go('Settings', '#settings');
}

/* ---------- Events ---------- */
/* The second click of a double-click on something that navigates must not land on the new page. */
let navAt = 0;
document.addEventListener('click', e => {
  if (e.detail > 1 && Date.now() - navAt < 500) { e.preventDefault(); return; }
  if (e.target.closest('[data-row], [data-person], [data-card], a[href^="#"]') && !e.target.closest('.pm-kebab-wrap')) navAt = Date.now();
  if (state.pickerOpen && !e.target.closest('.pm-picker')) closePicker();
  if (state.cardMenu && !e.target.closest('.pm-kebab-wrap')) closeCardMenu();
  const row = e.target.closest('[data-row]');
  if (row && !e.target.closest('a, button')) { location.hash = '#permissions/' + row.dataset.row; return; }
  const sectionRow = e.target.closest('[data-section-row]');
  if (sectionRow && !e.target.closest('input, button') && state.search.trim() === '' && state.filter === 'all') { state.open[sectionRow.dataset.sectionRow] = !state.open[sectionRow.dataset.sectionRow]; updateEditor(); return; }
  const card = e.target.closest('[data-card]');
  if (card && !e.target.closest('a, button, .pm-kebab-wrap')) { openCard(card.dataset.card); return; }
  const t = e.target.closest('button, input, a');
  if (!t) return;
  if (t.dataset.cardOpen) { openCard(t.dataset.cardOpen); return; }
  if (t.dataset.cardMenu) { if (state.cardMenu === t.dataset.cardMenu) closeCardMenu(true); else openCardMenu(t, e.detail === 0); return; }
  if (t.dataset.cm) { cardAction(t.dataset.cm, t.dataset.id, e.detail === 0); return; }
  if (t.dataset.page) { state.peoplePage += t.dataset.page === 'next' ? 1 : -1; refreshPeople(); window.scrollTo(0, 0); const dir = t.dataset.page; const f = document.querySelector(`#peoplePager [data-page="${dir}"]`); const other = document.querySelector(`#peoplePager [data-page="${dir === 'next' ? 'prev' : 'next'}"]`); (f && !f.disabled ? f : other && !other.disabled ? other : document.getElementById('peopleSearch')).focus(); return; }
  if (t.id === 'clearPeople') { state.peopleSearch = ''; state.peopleGroup = 'all'; state.peopleSalary = 'all'; state.peoplePage = 0; render(true); const f = document.getElementById('peopleSearch'); if (f) f.focus(); return; }
  if (t.id === 'groupPicker') { if (state.pickerOpen) closePicker(true); else openPicker(e.detail === 0); return; }
  if (t.dataset.pick) { pickGroup(t.dataset.pick, e.detail === 0); return; }
  if (t.dataset.create) { closePicker(true); newGroupModal(t.dataset.create); return; }
  if (t.dataset.person) { selectPerson(+t.dataset.person); return; }
  if (t.dataset.assign) { assignModal(t.dataset.assign); return; }
  if (t.dataset.reset) { resetPerson(e.detail === 0); return; }
  if (t.dataset.editGroup) { state.group = baseOf(t.dataset.editGroup); state.saveMsg = ''; location.hash = '#group'; return; }
  if (t.id === 'newGroup' || t.dataset.new) return newGroupModal();
  if (t.dataset.use) return newGroupModal(t.dataset.use);
  if (t.dataset.tabkey) { state.tab = t.dataset.tabkey; state.search = ''; state.filter = 'all'; state.sticky.clear(); render(true); const f = document.querySelector(`[data-key="tab:${t.dataset.tabkey}"]`); if (f) f.focus(); return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; state.sticky.clear(); updateEditor(); return; }
  if (t.dataset.toggle) { state.open[t.dataset.toggle] = !state.open[t.dataset.toggle]; updateEditor(); return; }
  if (t.dataset.retry) { const c = document.getElementById('c-edit:' + t.dataset.retry); if (c) c.focus(); toggleEdit(t.dataset.retry); return; }
  if (t.id === 'clearFilters') { state.search = ''; state.filter = 'all'; const s = document.getElementById('tabSearch'); if (s) { s.value = ''; s.focus(); } updateEditor(); return; }
  if (t.id === 'bulkAll') { openBulkMenu(t, 'all', null, t.parentElement.querySelector('label').textContent); return; }
  if (t.dataset.pay === 'hide') { payrollModal(); return; }
  if (t.dataset.pay === 'show') { payrollOff(e.detail === 0); return; }
  if (t.dataset.pay === 'list') { state.tab = 'pages'; state.search = ''; state.filter = 'off'; state.sticky.clear(); render(true); const o = document.querySelector('[data-key="filter:off"]'); if (o) o.focus(); return; }
  if (t.dataset.section) { openBulkMenu(t, 'section', t.dataset.section, SECTIONS.find(x => x.id === t.dataset.section).label); return; }
  if (t.dataset.parentitem) { openBulkMenu(t, 'item', t.dataset.parentitem, BY_ID[t.dataset.parentitem].name); return; }
  if (t.dataset.tab === 'pages') { togglePage(t.dataset.id); return; }
  if (t.dataset.tab === 'edit') { toggleEdit(t.dataset.id); return; }
  if (t.dataset.flat === 'metrics') { toggleSimple('metrics', t.dataset.id); return; }
  if (t.dataset.flat === 'connections') { toggleSimple('conns', t.dataset.id); return; }
  if (t.dataset.client) { state.mcpClient = t.dataset.client; render(true); const f = document.querySelector(`[data-key="client:${t.dataset.client}"]`); if (f) f.focus(); return; }
  if (t.id === 'copyUrl') {
    const done = () => { t.textContent = 'Copied'; toast('Server URL copied.'); setTimeout(() => { const b = document.getElementById('copyUrl'); if (b) b.textContent = 'Copy URL'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(MCP_URL).then(done, () => { document.getElementById('mcpUrl').select(); toast('Press your copy shortcut to copy the URL.'); });
    else { document.getElementById('mcpUrl').select(); toast('Press your copy shortcut to copy the URL.'); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'peopleSearch') {
    state.peopleSearch = e.target.value;
    state.peoplePage = 0;
    refreshPeople();
    return;
  }
  if (e.target.id === 'tabSearch') {
    state.search = e.target.value;
    const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
    set('bulkSlot', toolbarHtml());
    set('rowsSlot', listHtml());
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'peopleGroup' || e.target.id === 'peopleSalary') {
    state[e.target.id] = e.target.value;
    state.peoplePage = 0;
    if (e.target.id === 'peopleGroup') document.getElementById('peopleSalary').innerHTML = salaryOptionsHtml();
    refreshPeople();
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (state.pickerOpen || state.cardMenu) {
    const items = [...document.querySelectorAll('.pm-menu [role^=menuitem]')];
    const i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { if (state.pickerOpen) closePicker(true); else closeCardMenu(true); e.preventDefault(); return; }
    if (e.key === 'Tab') { closePicker(); closeCardMenu(); return; }
    const to = e.key === 'ArrowDown' ? (i + 1) % items.length : e.key === 'ArrowUp' ? (i <= 0 ? items.length - 1 : i - 1) : e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : -1;
    if (to >= 0) { items[to].focus(); e.preventDefault(); return; }
  } else if (t.id === 'groupPicker' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { openPicker(true); e.preventDefault(); return; }
  if (t.dataset && t.dataset.person && ['ArrowDown','ArrowUp','Home','End'].includes(e.key)) {
    const rows = [...document.querySelectorAll('#peopleSlot .pm-person')];
    const at = rows.indexOf(t);
    const to = e.key === 'ArrowDown' ? Math.min(rows.length - 1, at + 1) : e.key === 'ArrowUp' ? Math.max(0, at - 1) : e.key === 'Home' ? 0 : rows.length - 1;
    rows[to].focus();
    e.preventDefault();
    return;
  }
  if (t.dataset && t.dataset.tabkey && ['ArrowRight','ArrowLeft','Home','End'].includes(e.key)) {
    const keys = Object.keys(TABS);
    const i = keys.indexOf(t.dataset.tabkey);
    const next = e.key === 'Home' ? keys[0] : e.key === 'End' ? keys[keys.length - 1] : keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
    state.tab = next; state.search = ''; state.filter = 'all'; state.sticky.clear(); render(true);    const f = document.querySelector(`[data-key="tab:${next}"]`); if (f) f.focus();
    e.preventDefault();
  }
});
window.addEventListener('hashchange', () => {
  document.getElementById('toastHost').innerHTML = '';
  if (document.querySelector('#modalHost [role=dialog]')) { modalOnClose = null; modalReturnFocus = null; closeModal(); }
  /* Moving between people keeps the page where it is, so the row stays under the cursor. */
  const wasPerson = !!state.personId && state.inPeople;
  const nowPerson = view() === 'permissions' && !!hashPerson();
  const y = window.scrollY;
  render(wasPerson && nowPerson);  if (wasPerson && nowPerson) {
    const body = document.querySelector('.pm-people__body');
    const top = body ? body.getBoundingClientRect().top + window.scrollY : 0;
    if (y > top) window.scrollTo(0, top);
  }
  const activeRow = document.querySelector('.pm-person.is-active');
  if (state.focusPerson && activeRow) { state.focusPerson = null; activeRow.focus({ preventScroll:true }); return; }
  state.focusPerson = null;
  const back = view() === 'permissions' && !state.personId && state.lastPerson && document.querySelector(`[data-row="${state.lastPerson}"] a`);
  state.lastPerson = null;
  if (back) { back.focus(); return; }
  const name = nowPerson && document.querySelector('.pm-person-name');
  if (name) { name.setAttribute('tabindex', '-1'); name.focus({ preventScroll:true }); return; }
  const h = document.querySelector('#app h1');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
});
/* A mix like a real organization's: most people on Full Access, a few in groups, some with their own changes. */
function seedPeople() {
  const by = n => MEMBERS.find(m => m.name === n);
  [['Bianca Stone','finance'],['Kofi Mensah','finance'],['Priya Nair','finance'],['Carlos Mendes','marketing'],['Nadia Petrova','marketing'],['Victor Hale','investor'],['Wendy Cho','viewer']].forEach(([n, id]) => { by(n).groupId = id; });
  const change = (n, fn) => {
    const m = by(n);
    const g = personGroup(m);
    fn(g);
    const d = personDiff(g, baseOf(m.groupId));
    m.over = d.over;
    m.diff = d.n;
    if (m.groupId === FULL && d.n) m.groupId = null;
  };
  change('Priya Nair', g => { g.pages.AUDIT = false; setCatOne(g, 'COGS', 'Payroll (% of Net Sales)', false); });
  change('Dana Whitfield', g => { g.pages.CONFIGURATION = false; g.pages.DATA_PIPELINE = false; g.edit.SETTINGS = false; setCatOne(g, 'Income', 'Discounts', false); setCatOne(g, 'Income', 'Cash Refunds', false); setCatAll(g, 'Cash', false); });
  change('Elif Aydin', g => { g.pages.SCENARIOS = false; g.payroll = 'lines'; });
}
seedPeople();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => updateEditor());
setRail();
render();
