<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settlements</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting-layout.css">
  <style>
    .st-c0 { width:17%; } .st-c1 { width:12%; } .st-c2 { width:14%; } .st-c3 { width:176px; }
    @media (max-width:1279px) { .st-c0 { width:152px; } .st-c1 { width:104px; } .st-c2 { width:112px; } .st-c3 { width:104px; } }
  </style>
</head>
<body class="pm-journal ac ds" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Accounting";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
(function () {
  const esc = AC.esc;
  const PAGE_SIZE = 25;
  const YEAR = AC.MONTH.split(' ')[1];
  const dateOf = d => new Date(d + ', ' + YEAR);
  const isoOf = d => { const x = dateOf(d); return [x.getFullYear(), String(x.getMonth() + 1).padStart(2, '0'), String(x.getDate()).padStart(2, '0')].join('-'); };
  const curOf = s => s.cur || 'USD';
  const railOrder = id => AC.RAILS.findIndex(r => r.id === id);
  const rangeOf = s => (s.from === s.to ? s.from : s.from + ' to ' + s.to);
  const hasData = () => AC.month() === AC.MONTH;
  const SORTED = AC.SETTLEMENTS.slice().sort((a, b) => dateOf(b.date) - dateOf(a.date) || railOrder(a.rail) - railOrder(b.rail) || a.id.localeCompare(b.id));

  /* ---------- Route: no hash or filters is the list, an id is that settlement ---------- */
  function parseHash(hash) {
    let raw = '';
    try { raw = decodeURIComponent(hash.slice(1)); } catch (err) { raw = hash.slice(1); }
    if (raw && !raw.includes('=')) return { view:'detail', id:raw };
    const p = new URLSearchParams(raw);
    const rail = p.get('rail') || '', status = p.get('status') || '';
    return {
      view:'list',
      rail:AC.rail(rail) ? rail : '',
      status:Object.keys(AC.SETTLEMENT_STATUS).includes(status) ? status : '',
      page:Math.max(1, parseInt(p.get('page'), 10) || 1),
    };
  }
  const route = () => parseHash(location.hash);
  function hashOf(f) {
    const p = new URLSearchParams();
    if (f.rail) p.set('rail', f.rail);
    if (f.status) p.set('status', f.status);
    if (f.page > 1) p.set('page', f.page);
    const h = p.toString();
    return h ? '#' + h : '';
  }
  const urlOf = hash => location.pathname + location.search + hash;

  /* ---------- Coming back: filters and page are in the hash, scroll is kept per view ---------- */
  const NAV_KEY = 'ac-settlements-nav';
  const nav = (() => {
    const blank = { scrolls:{}, from:null };
    try {
      if (AC.reloaded) { sessionStorage.removeItem(NAV_KEY); return blank; }
      return Object.assign(blank, JSON.parse(sessionStorage.getItem(NAV_KEY) || '{}'));
    } catch (err) { return blank; }
  })();
  const saveNav = () => { try { sessionStorage.setItem(NAV_KEY, JSON.stringify(nav)); } catch (err) { /* this page only */ } };
  /* Back to where the list was, or, for a settlement opened from another page, to the list page that holds it. */
  const listHash = id => {
    if (nav.from && nav.from.id === id) return nav.from.hash;
    const i = ordered().findIndex(s => s.id === id);
    return i < PAGE_SIZE ? '' : hashOf({ page:Math.floor(i / PAGE_SIZE) + 1 });
  };
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  let here = location.hash, topAfterRender = false;
  const live = document.createElement('div');
  live.className = 'ac-sr';
  live.setAttribute('role', 'status');
  document.body.appendChild(live);

  /* A settlement belongs to its month, so opening one brings the month select along. */
  const followMonth = r => { if (r.view === 'detail' && AC.settlement(r.id) && !hasData()) AC.setMonth(AC.MONTH); };
  followMonth(route());

  function show(mode) {
    const from = parseHash(here), to = route(), fromHash = here;
    nav.scrolls[fromHash] = window.scrollY;
    here = location.hash;
    if (from.view === 'list' && to.view === 'detail') nav.from = { hash:fromHash, id:to.id };
    followMonth(to);
    const seen = !!(history.state && history.state.seen);
    if (!seen) history.replaceState({ seen:true }, '');
    saveNav();
    AC.closePanel();
    AC.rerender();
    if (mode === 'top') window.scrollTo(0, 0);
    if (mode === 'restore') window.scrollTo(0, to.view === 'list' || seen ? nav.scrolls[here] || 0 : 0);
    if (from.view === to.view) return;
    const target = to.view === 'detail' ? document.getElementById('stCrumbId') : from.id && document.querySelector(`[data-settlement="${CSS.escape(from.id)}"]`);
    if (!target) return;
    target.focus({ preventScroll:true });
    /* A deep linked settlement has no scroll to come back to, so its row can sit off screen or under the pinned heads. */
    if (to.view === 'list') { const b = target.getBoundingClientRect(); if (b.top < 140 || b.bottom > window.innerHeight) target.scrollIntoView({ block:'center' }); }
  }
  function go(hash, mode) {
    nav.scrolls[here] = window.scrollY;
    history.pushState(null, '', urlOf(hash));
    show(mode);
  }

  /* ---------- List ---------- */
  /* What still blocks the close comes first, so the first click from Overview lands on it. */
  const ordered = () => { const open = AC.openBreaks(); return open.concat(SORTED.filter(s => !open.includes(s))); };
  const inFilter = f => (hasData() ? ordered().filter(s => (!f.rail || s.rail === f.rail) && (!f.status || s.status === f.status)) : []);
  const hasFigures = () => AC.MONTHS.includes(AC.month());
  const exceptionOf = s => AC.exceptionOf(s.id);
  /* Accepted or Resolved, once the settlement's exception has left the open list. */
  function clearedWord(s) {
    const ex = exceptionOf(s);
    const status = ex ? AC.exceptionStatus(ex) : '';
    return status === 'accepted' || status === 'resolved' ? AC.EXCEPTION_STATUS[status] : '';
  }
  function statusHtml(s) {
    const word = AC.SETTLEMENT_STATUS[s.status];
    if (s.status === 'paid') return `<span class="ac-muted">${word}</span>`;
    const cleared = clearedWord(s);
    return `<span class="badge ${{ pending:'badge-gray', break:'badge-yellow', failed:'badge-red' }[s.status]} badge-sm">${word}</span>${cleared ? `<span class="ac-muted ac-wide-only">${cleared}</span>` : ''}`;
  }
  const diffHtml = (n, cur) => { if (!n) return AC.amt(0, cur); return AC.breakCleared('po_Tk05') ? esc(AC.signed(n, cur)) : `<span class="badge badge-yellow badge-sm">${esc(AC.signed(n, cur))}</span>`; };
  const rowHtml = s => {
    const reported = s.reportedNet !== null;
    return `<tr class="ac-row" data-row="${esc(s.id)}">
      ${AC.td(esc(s.channel), { head:true })}
      ${AC.td(`<a class="btn-link btn-link-semibold btn-sm" href="#${esc(s.id)}" data-settlement="${esc(s.id)}">${esc(s.id)}</a>`, {})}
      ${AC.td(esc(rangeOf(s)), {})}
      ${AC.td(reported ? esc(AC.money(s.reportedNet, s.cur)) : AC.none, { num:true })}
      ${AC.td(esc(AC.money(s.expectedNet, s.cur)), { num:true })}
      ${AC.td(reported ? diffHtml(s.diff, s.cur) : AC.none, { num:true })}
      ${AC.td(`<span class="ac-name">${statusHtml(s)}</span>`, {})}
    </tr>`;
  };
  /* One row per currency in the filter, over all filtered rows. Currencies never add up. */
  function totalsOf(rows) {
    return AC.CURRENCIES.filter(c => rows.some(s => curOf(s) === c)).map(c => {
      const list = rows.filter(s => curOf(s) === c);
      const done = list.filter(s => s.reportedNet !== null), open = list.filter(s => s.reportedNet === null);
      const paid = { cur:c, label:(open.length ? 'Total paid out ' : 'Total ') + c, reported:AC.sum(done, s => s.reportedNet), expected:AC.sum(done, s => s.expectedNet), diff:AC.sum(done, s => s.diff) };
      const waiting = { cur:c, label:(done.length ? 'Not paid out ' : 'Total ') + c, reported:null, expected:AC.sum(open, s => s.expectedNet), diff:null };
      return (done.length ? [paid] : []).concat(open.length ? [waiting] : []);
    }).flat();
  }
  const totalHtml = t => `<tr>
      ${AC.td(esc(t.label + ', ' + AC.month()), { head:true, row:'total', span:3 })}
      ${AC.td(t.reported === null ? AC.none : esc(AC.money(t.reported, t.cur)), { num:true, row:'total' })}
      ${AC.td(esc(AC.money(t.expected, t.cur)), { num:true, row:'total' })}
      ${AC.td(t.diff === null ? AC.none : AC.amt(t.diff, t.cur), { num:true, row:'total' })}
      ${AC.td('', { row:'total' })}
    </tr>`;
  const filters = f => AC.filterMenu({ name:'rail', label:'Rail', value:f.rail, options:[['', 'All rails']].concat(AC.RAILS.map(r => [r.id, AC.railLabel(r)])) }) + AC.filterMenu({ name:'status', label:'Status', value:f.status, options:[['', 'All statuses']].concat(Object.keys(AC.SETTLEMENT_STATUS).map(k => [k, AC.SETTLEMENT_STATUS[k]])) });
  const exportBtn = off => `<button type="button" class="btn btn-neutral btn-sm" id="stExport" data-key="stExport"${off ? ' disabled' : ''}>Export CSV</button>`;
  const emptyCard = (bar, inner) => `<section class="card" aria-label="Settlements">${bar}<div class="ac-empty">${inner}</div></section>`;
  function listHtml(f) {
    if (!hasData()) return `<div class="ac-stack">${emptyCard('', `<span class="ac-muted">${hasFigures() ? 'No settlements for ' : 'No sample figures for '}${esc(AC.month())}</span>`)}</div>`;
    const rows = inFilter(f);
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE)), page = Math.min(f.page, pages), start = (page - 1) * PAGE_SIZE;
    const pager = rows.length ? AC.pager({ start:start + 1, end:Math.min(start + PAGE_SIZE, rows.length), total:rows.length, page, pages }) : '';
    const bar = AC.cardBar(filters(f), pager + exportBtn(!rows.length));
    if (!rows.length) return `<div class="ac-stack">${emptyCard(bar, '<span class="ac-muted">No settlements match these filters</span><button type="button" class="btn btn-neutral btn-sm" id="stClear">Clear filters</button>')}</div>`;
    const shown = rows.slice(start, start + PAGE_SIZE);
    return `<div class="ac-stack"><section class="card" aria-label="Settlements">${bar}
      <div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin">
        <caption class="ac-sr">Settlements</caption>
        <colgroup><col class="st-c0"><col class="st-c1"><col><col class="st-c2"><col class="st-c2"><col class="st-c2"><col class="st-c3"></colgroup>
        <thead><tr>${AC.th('Rail')}${AC.th('Settlement')}${AC.th('Dates')}${AC.th('Reported net', { right:true })}${AC.th('Expected net', { right:true })}${AC.th('Difference', { right:true })}${AC.th('Status')}</tr></thead>
        <tbody>${shown.map(rowHtml).join('')}${totalsOf(rows).map(totalHtml).join('')}</tbody>
      </table></div>
      ${AC.foot('', pager)}
    </section></div>`;
  }

  /* ---------- Rows behind one settlement. A pending settlement holds the rail's events that no payout has taken yet. ---------- */
  function eventsOf(s) {
    if (s.status !== 'pending') return AC.eventsOf(s.id);
    return AC.allEvents().filter(e => e.rail === s.rail && !e.payout && e.cat !== 'fee' && e.cat !== 'tax' && dateOf(e.date) >= dateOf(s.from) && dateOf(e.date) <= dateOf(s.to));
  }
  const ordersOf = s => eventsOf(s).filter(e => e.cat === 'charge');
  const offBy = (s, e) => s.status === 'break' && ordersOf(s)[0].txn === e.txn;
  /* What the waterfall foots to: what was paid on a paid settlement, what should have been on all the others. */
  const netOf = s => (s.status === 'paid' ? s.reportedNet : s.expectedNet);

  /* ---------- Waterfall ---------- */
  function stepsOf(s) {
    return [
      { label:'Charges', value:s.gross, count:s.orders, kind:'gross' },
      { label:'Refunds', value:-s.refunds },
      { label:'Disputes', value:-s.chargebacks },
      { label:'Fees', value:-s.fees, count:s.orders },
      { label:'Tax', value:-s.tax, count:s.orders },
      { label:'Reserves', value:-s.reserves },
      { label:'Adjustments', value:s.adjustments },
      { label:s.status === 'paid' ? 'Net' : 'Expected net', value:netOf(s), kind:'net' },
    ];
  }
  /* Charges down to net, one line per component, as the settlement reports it. */
  function waterfallHtml(s) {
    return `<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--kv"><caption class="ac-sr">Charges to net</caption><colgroup><col><col style="width:160px"></colgroup><tbody>${stepsOf(s).map(step => {
      const zero = step.value === 0, row = step.kind === 'net' ? 'total' : 'default';
      const count = step.count ? ` <span class="ac-muted">(${AC.count(step.count)})</span>` : '';
      return `<tr>${AC.td(`<span>${zero ? `<span class="ac-zero">${step.label}</span>` : step.label}${count}</span>`, { head:true, row })}${AC.td(zero ? AC.amt(0, s.cur) : esc(AC.signed(step.value, s.cur)), { num:true, row })}</tr>`;
    }).join('')}</tbody></table></div>`;
  }
  function factsOf(s) {
    const word = { paid:'Paid', break:'Paid', pending:'Expected', failed:'Failed' }[s.status];
    return [word + ' ' + s.date, AC.count(s.orders) + (s.orders === 1 ? ' order' : ' orders')];
  }

  /* ---------- Net card ---------- */
  function netCardHtml(s) {
    const reported = s.reportedNet !== null;
    const ex = exceptionOf(s), cleared = clearedWord(s);
    const exLink = ex ? `<a class="btn-link btn-link-semibold btn-sm" href="${esc(AC.hrefOf('exceptions') + '#' + ex.id)}">${cleared ? cleared + ' · ' : ''}View exception</a>` : '';
    const row = (label, value, o = {}) => `<tr>${AC.td(label, { head:true, row:o.row })}${AC.td(value, { num:true, row:o.row })}</tr>`;
    return `<section class="card" aria-labelledby="stNetTitle">
      ${AC.cardTitle('stNetTitle', 'Net')}
      <div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--kv"><caption class="ac-sr">Net</caption><colgroup><col><col style="width:128px"></colgroup><tbody>
        ${row('Reported net', reported ? esc(AC.money(s.reportedNet, s.cur)) : AC.none)}
        ${row('Expected net', esc(AC.money(s.expectedNet, s.cur)))}
        ${row('Difference', reported ? diffHtml(s.diff, s.cur) : AC.none, { row:'total' })}
        ${s.status === 'failed' ? `<tr>${AC.td(`<span class="ac-fault">Payout failed: ${esc(s.failureText)}</span>`, { span:2, cls:'ac-wrap-cell' })}</tr>` : ''}
        ${(s.status === 'break' || s.status === 'failed') && exLink ? `<tr>${AC.td(exLink, { span:2 })}</tr>` : ''}
        ${row('Bank match', '<span class="ac-muted">Not available yet</span>')}
      </tbody></table></div>
    </section>`;
  }

  /* ---------- Events and orders, on one set of columns ---------- */
  const COLS = '<colgroup><col style="width:96px"><col style="width:144px"><col><col class="ac-col-money"><col class="ac-col-small"><col class="ac-col-small"><col class="ac-col-money"></colgroup>';
  const noRows = '<div class="ac-empty"><span class="ac-muted">No sample rows for this settlement</span></div>';
  const eventRow = (e, i) => `<tr class="ac-row" data-drill data-ev="${i}">
      ${AC.td(`<button type="button" class="ac-rowlink" data-open data-key="ev:${esc(e.txn)}" aria-haspopup="dialog" aria-label="${esc(e.date)}, open ${esc(e.txn)}">${esc(e.date)}</button>`, { head:true })}
      ${AC.td(esc(e.txn), {})}
      ${AC.td(esc(e.desc), {})}
      ${AC.td(AC.amt(e.amount, e.cur), { num:true })}
      ${AC.td(AC.amt(e.fee, e.cur), { num:true })}
      ${AC.td(AC.amt(e.tax, e.cur), { num:true })}
      ${AC.td(AC.amt(e.net, e.cur), { num:true })}
    </tr>`;
  const showingHtml = (n, total, noun) => AC.foot(`Showing ${AC.count(n)} of ${AC.count(total)} ${noun}`);
  function eventsCardHtml(s) {
    const events = eventsOf(s);
    const body = !events.length ? noRows : `<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin">
        <caption class="ac-sr">Events</caption>${COLS}
        <thead><tr>${AC.th('Date')}${AC.th('Transaction')}${AC.th('Description')}${AC.th('Amount', { right:true })}${AC.th('Fee', { right:true })}${AC.th('Tax', { right:true })}${AC.th('Net', { right:true })}</tr></thead>
        <tbody>${events.map(eventRow).join('')}</tbody>
      </table></div>${showingHtml(events.length, AC.settlementEventTotal(s), 'events')}`;
    return `<section class="card" aria-labelledby="stEventsTitle">${AC.cardTitle('stEventsTitle', 'Events')}${body}</section>`;
  }
  function amountMatchHtml(s, e) {
    return offBy(s, e) ? `<span class="badge badge-yellow badge-sm">Off by ${AC.money(s.diff, s.cur)}</span>` : '<span class="ac-muted">Matched</span>';
  }
  const cashMatchHtml = s => (s.status === 'failed' ? '<span class="badge badge-red badge-sm">Failed</span>' : s.status === 'pending' ? '<span class="badge badge-gray badge-sm">Pending</span>' : '<span class="ac-muted">Paid</span>');
  function ordersCardHtml(s) {
    const orders = ordersOf(s);
    const body = !orders.length ? noRows : `<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin">
        <caption class="ac-sr">Orders</caption><colgroup><col style="width:96px"><col><col class="ac-col-money"><col style="width:176px"><col style="width:128px"></colgroup>
        <thead><tr>${AC.th('Order')}${AC.th('Date')}${AC.th('Amount', { right:true })}${AC.th('Amount match')}${AC.th('Cash match')}</tr></thead>
        <tbody>${orders.map(e => `<tr>${AC.td(esc(e.order), { head:true })}${AC.td(esc(e.date), {})}${AC.td(AC.amt(e.amount, e.cur), { num:true })}${AC.td(amountMatchHtml(s, e), {})}${AC.td(cashMatchHtml(s), {})}</tr>`).join('')}</tbody>
      </table></div>${showingHtml(orders.length, s.orders, 'orders')}`;
    return `<section class="card" aria-labelledby="stOrdersTitle">${AC.cardTitle('stOrdersTitle', 'Orders')}${body}</section>`;
  }

  /* ---------- Detail ---------- */
  function detailHtml(id) {
    const s = AC.settlement(id);
    const crumb = AC.crumb(AC.hrefOf('settlements') + listHash(id), listHash(id), 'Settlements', id, 'stCrumbId');
    if (!s) return `<div class="ac-crumbs">${crumb}</div><div class="ac-stack"><section class="card"><div class="ac-empty"><span class="ac-muted">No settlement ${esc(id)}</span></div></section></div>`;
    return `<div class="ac-crumbs">${crumb}<span class="ac-name">${statusHtml(s)}</span><div class="ac-actions"><a class="btn-link btn-link-semibold btn-sm" href="${esc(AC.hrefOf('journal') + '#entry-' + s.rail)}">View journal entry</a>${exportBtn(false)}</div></div>
      <div class="ac-stack">
        <div class="ac-rail">
          <section class="card" aria-labelledby="stWfTitle">
            ${AC.cardTitle('stWfTitle', `${esc(s.channel)} · ${esc(rangeOf(s))}`, factsOf(s).map(esc).join(' · '))}
            ${waterfallHtml(s)}
          </section>
          ${netCardHtml(s)}
        </div>
        ${eventsCardHtml(s)}
        ${ordersCardHtml(s)}
      </div>`;
  }

  /* ---------- CSV: what the screen shows, all pages of it, plus currency and ids ---------- */
  const plain = n => (n === null || n === undefined ? '' : Number(n).toFixed(2));
  function exportList(f) {
    const rows = inFilter(f);
    const head = ['Rail', 'Settlement', 'From', 'To', 'Currency', 'Reported net', 'Expected net', 'Difference', 'Status'];
    const body = rows.map(s => [s.channel, s.id, isoOf(s.from), isoOf(s.to), curOf(s), plain(s.reportedNet), plain(s.expectedNet), s.reportedNet === null ? '' : plain(s.diff), AC.SETTLEMENT_STATUS[s.status]]);
    const totals = totalsOf(rows).map(t => [t.label, '', '', '', t.cur, plain(t.reported), plain(t.expected), plain(t.diff), '']);
    const name = ['settlements', f.rail, f.status].filter(Boolean).join('-') + '-' + isoOf('Sep 1').slice(0, 7) + '.csv';
    AC.downloadCsv(name, [head].concat(body, totals));
    AC.toast('CSV exported.');
  }
  function exportDetail(s) {
    const head = ['Section', 'Settlement', 'Rail', 'Currency', 'Item', 'Value', 'Count', 'Date', 'Transaction', 'Order', 'Description', 'Amount', 'Fee', 'Tax', 'Net', 'Amount match', 'Cash match'];
    const line = o => [o.section, s.id, s.channel, curOf(s), o.item || '', o.value || '', o.count || '', o.date || '', o.txn || '', o.order || '', o.desc || '', plain(o.amount), plain(o.fee), plain(o.tax), plain(o.net), o.am || '', o.cm || ''];
    const rows = [
      line({ section:'Settlement', item:'Status', value:AC.SETTLEMENT_STATUS[s.status] }),
      line({ section:'Settlement', item:'From', date:isoOf(s.from) }),
      line({ section:'Settlement', item:'To', date:isoOf(s.to) }),
      line({ section:'Settlement', item:factsOf(s)[0].split(' ')[0], date:isoOf(s.date) }),
      line({ section:'Settlement', item:'Orders', count:s.orders }),
    ];
    stepsOf(s).forEach(step => rows.push(line({ section:'Waterfall', item:step.label, count:step.count, amount:step.value === 0 ? 0 : step.value })));
    rows.push(line({ section:'Net', item:'Reported net', amount:s.reportedNet }));
    rows.push(line({ section:'Net', item:'Expected net', amount:s.expectedNet }));
    rows.push(line({ section:'Net', item:'Difference', amount:s.reportedNet === null ? null : s.diff }));
    if (s.status === 'failed') rows.push(line({ section:'Net', item:'Payout failed', value:s.failureText }));
    eventsOf(s).forEach(e => rows.push(line({ section:'Events', date:isoOf(e.date), txn:e.txn, order:e.order, desc:e.desc, amount:e.amount, fee:e.fee, tax:e.tax, net:e.net })));
    ordersOf(s).forEach(e => rows.push(line({ section:'Orders', date:isoOf(e.date), order:e.order, amount:e.amount, am:offBy(s, e) ? 'Off by ' + AC.money(s.diff, s.cur) : 'Matched', cm:s.status === 'failed' ? 'Failed' : s.status === 'pending' ? 'Pending' : 'Paid' })));
    AC.downloadCsv('settlement-' + s.id + '.csv', [head].concat(rows));
    AC.toast('CSV exported.');
  }

  /* ---------- Panel: the event and its source row, the same as on Events ---------- */
  function openEvent(row) {
    const s = AC.settlement(route().id);
    if (!s) return;
    const e = eventsOf(s)[Number(row.dataset.ev)];
    const rail = AC.rail(e.rail);
    AC.openPanel({
      title:e.desc,
      amount:AC.signed(e.amount, e.cur),
      meta:[rail.name, curOf(e), e.date].join(' · '),
      body:`${AC.kv([
        ['Fee', AC.amt(e.fee, e.cur)],
        ['Tax', AC.amt(e.tax, e.cur)],
        ['Net', esc(AC.signed(e.net, e.cur))],
        ['Settlement', esc(s.id)],
        ['Status', esc(e.status)],
        ['Transaction', esc(e.txn)],
        e.order ? ['Order', esc(e.order)] : null,
        ['Rail account', esc(rail.acct)],
      ], { only:true, caption:'Event' })}${AC.sourceRow(AC.sourcePairs(e))}`,
    });
    AC.keepReturnFocus(row.querySelector('[data-open]'));
  }

  /* ---------- Controls ---------- */
  const plainClick = e => !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey && e.button === 0;
  document.addEventListener('click', e => {
    const r = route();
    const routeLink = e.target.closest('a[data-route]');
    if (routeLink && plainClick(e)) { e.preventDefault(); go(routeLink.dataset.route, 'restore'); return; }
    /* The current nav item leads back to the list from a settlement. */
    if (r.view === 'detail' && e.target.closest('.ac-nav [aria-current="page"]')) { e.preventDefault(); go(listHash(r.id), 'restore'); return; }
    const exp = e.target.closest('#stExport');
    if (exp) {
      if (e.detail > 1 || exp.disabled) return;
      if (r.view === 'detail') exportDetail(AC.settlement(r.id)); else exportList(r);
      return;
    }
    if (e.target.closest('#stClear')) {
      go('', 'keep');
      const rail = document.querySelector('[data-key="menu:rail"]');
      if (rail) rail.focus({ preventScroll:true });
      live.textContent = AC.count(inFilter(route()).length) + ' settlements';
      return;
    }
    const open = e.target.closest('[data-open]');
    if (open) { openEvent(open.closest('tr')); return; }
    const pageBtn = e.target.closest('[data-page]');
    if (!pageBtn || r.view !== 'list') return;
    const mouse = document.documentElement.classList.contains('pm-pointer');
    go(hashOf({ rail:r.rail, status:r.status, page:Number(pageBtn.dataset.page) }), mouse ? 'top' : 'keep');
    const foot = document.querySelector('[data-showing]');
    if (foot) live.textContent = foot.textContent;
    const stay = document.querySelector(`[data-key="${CSS.escape(pageBtn.dataset.key)}"]`);
    if (stay && !stay.disabled) { if (mouse) stay.focus({ preventScroll:true }); else AC.focusAfterAction(stay); }
  });
  AC.onMenuPick = (name, value) => {
    const r = route();
    const next = { rail:r.rail, status:r.status, page:1 };
    next[name] = value;
    go(hashOf(next), 'keep');
    const n = inFilter(next).length;
    live.textContent = n === 1 ? '1 settlement' : AC.count(n) + ' settlements';
    const b = document.querySelector(`[data-key="menu:${name}"]`);
    if (b) b.focus();
  };
  /* Changing the month on a settlement leaves it for that month's list. This runs before the shell draws. */
  AC.beforeMonth = () => {
    const r = route();
    if (r.view !== 'detail') return;
    nav.scrolls[here] = window.scrollY;
    history.pushState({ seen:true }, '', urlOf(listHash(r.id)));
    here = location.hash;
    saveNav();
    topAfterRender = true;
  };
  window.addEventListener('hashchange', () => show('restore'));
  window.addEventListener('pagehide', () => { nav.scrolls[here] = window.scrollY; saveNav(); });

  AC.rowClick('tr[data-row]', row => go('#' + row.dataset.row, 'restore'));
  AC.rowClick('tr[data-ev]', openEvent);

  AC.start({
    current:'settlements',
    render:() => { const r = route(); return r.view === 'detail' ? detailHtml(r.id) : listHtml(r); },
    after:() => {
      const r = route();
      if (r.view === 'detail') document.title = r.id + ' · Settlements · Accounting';
      if (topAfterRender) { topAfterRender = false; window.scrollTo(0, 0); }
    },
    ready:() => {
      if (!(history.state && history.state.seen)) history.replaceState({ seen:true }, '');
      let back = false;
      try { const entry = performance.getEntriesByType('navigation')[0]; back = !!entry && entry.type === 'back_forward'; } catch (err) { back = false; }
      if (back && nav.scrolls[here]) window.scrollTo(0, nav.scrolls[here]);
    },
  });
})();
</script>
</body>
</html>
