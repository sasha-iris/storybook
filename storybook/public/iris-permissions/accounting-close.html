<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Close</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting.css">
  <style>
    /* The month card's head holds a 36 px control in every state, so its rows never move. */
    .ac-close-head { min-height:56px; box-sizing:border-box; }
    .ac-close-title { min-width:76px; }
    .ac-close-action { min-width:124px; }
    /* A blocked Close still takes the click: it moves focus to what blocks it. */
    body.ac .ac-close-action[aria-disabled="true"] { pointer-events:auto; }
    /* From 1280 the two cards sit side by side: period rows share the checklist's lines and one bottom edge. */
    @media (min-width:1280px) { .ac-close-head--periods { min-height:64px; padding-bottom:16px; box-sizing:border-box; } }
    /* Checklist row: label, amount, then the state on one left edge, so a chip is never a page width from its label. */
    .ac-close-check { display:grid; grid-template-columns:280px 112px minmax(0,1fr); }
    .ac-close-check .ac-kv__label { overflow:visible; }
    /* Beside Months the card is narrow: the longest label still fits and a done row keeps its whole fact. */
    @media (min-width:1280px) and (max-width:1439px) { .ac-close-check { grid-template-columns:240px 112px minmax(0,1fr); } }
    @media (max-width:767px) { .ac-close-check { grid-template-columns:minmax(0,1fr) 72px var(--ac-state); } .ac-close-check .ac-kv__label { overflow:hidden; } }
    /* The whole row is the link, as on Overview: no underline until the pointer is on it. */
    .ac-kv__row--link .ac-link:not(:hover):not(:active) { text-decoration-color:transparent; }
    .ac-close-check a.ac-link:hover, .ac-close-check a.ac-link:active { text-decoration-thickness:1px; }
    .ac-close-state { display:flex; grid-column:3; align-items:center; gap:8px; min-width:0; }
    .ac-close-state > * { flex:none; }
    .ac-close-state > .ac-note { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .ac-close-line { margin:0; }
    /* Two short columns: this table never needs the scroll width the long tables take under 1024. */
    .ac-table.ac-close-periods { min-width:0; }
    body.ac .ac-close-period .ac-toggle:focus-visible { border-radius:2px; }
  </style>
</head>
<body class="pm-journal ac" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Accounting";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
const esc = AC.esc;

/* ---------- The selected period lives in the hash: #2026-09 ---------- */
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const idOf = month => { const [name, year] = month.split(' '); return year + '-' + String(MONTH_NAMES.indexOf(name) + 1).padStart(2, '0'); };
const periodInHash = () => (AC.PERIODS.find(p => '#' + idOf(p.month) === location.hash) || {}).month;
const defaultPeriod = () => (AC.PERIODS.some(p => p.month === AC.month()) ? AC.month() : AC.MONTH);
const selected = () => periodInHash() || defaultPeriod();
function syncMonth() { const month = periodInHash(); if (month && AC.MONTHS.includes(month)) AC.setMonth(month); }
function writeDefaultHash() { if (!periodInHash()) history.replaceState(null, '', location.pathname + location.search + '#' + idOf(selected())); }

/* ---------- Months ---------- */
const periodStatus = month => {
  const status = AC.periodStatus(month), word = esc(AC.PERIOD_STATUS[status]);
  return status === 'closed' ? `<span class="ac-status ac-status--quiet">${word}</span>` : `<span class="ac-chip ac-chip--wait">${word}</span>`;
};
const periodRow = (month, current) => `<tr class="ac-row--link ac-close-period${current ? ' ac-row--sel' : ''}" data-month="${esc(month)}"><th scope="row"><button type="button" class="ac-toggle" data-period="${esc(month)}" data-key="period-${idOf(month)}"${current ? ' aria-current="true"' : ''}>${esc(month)}</button></th><td class="ac-right">${periodStatus(month)}</td></tr>`;
const periodsCard = current => `<section class="ac-card ac-s4" aria-labelledby="periodsTitle">
  <div class="ac-card__head ac-close-head--periods"><h2 class="ac-card__title" id="periodsTitle">Months</h2></div>
  <div class="ac-wrap"><table class="ac-table ac-close-periods"><caption class="ac-sr">Months, newest first</caption><colgroup><col><col class="ac-col-state"></colgroup>
    <thead><tr><th scope="col">Month</th><th scope="col" class="ac-right">Status</th></tr></thead>
    <tbody>${[...AC.PERIODS].sort((a, b) => idOf(b.month).localeCompare(idOf(a.month))).map(p => periodRow(p.month, p.month === current)).join('')}</tbody>
  </table></div></section>`;

/* ---------- Checklist ---------- */
const isAmount = fact => /^(CA)?\$/.test(fact);
const stateHtml = c => {
  const state = c.done ? `<span class="ac-status ac-status--ok">${esc(c.status)}</span>`
    : c.page ? `<span class="ac-chip ac-chip--warn">${esc(c.status)}</span>`
    : `<span class="ac-status ac-status--quiet">${esc(c.status)}</span>`;
  const fact = c.fact && !isAmount(c.fact) ? `<span class="ac-note">${esc(c.fact)}</span>` : '';
  return `<span class="ac-close-state">${state}${fact}</span>`;
};
const checkRow = c => {
  const href = c.page ? AC.hrefOf(c.page) + c.hash : '';
  if (c.id === 'mapping') return `<div class="ac-kv__row ac-close-check" role="listitem"><span class="ac-kv__label">${esc(c.label)}</span><span class="ac-note ac-close-state"><a class="ac-link" href="${esc(href)}" data-key="check-mapping">${esc(c.status)}</a></span></div>`;
  const amount = isAmount(c.fact) ? `<span class="ac-note ac-num">${esc(c.fact)}</span>` : '';
  const label = href ? `<a class="ac-link" href="${esc(href)}" data-key="check-${esc(c.id)}">${esc(c.label)}</a>` : esc(c.label);
  return `<div class="ac-kv__row ac-close-check${href ? ' ac-kv__row--link' : ''}" role="listitem" data-done="${c.done}"><span class="ac-kv__label${href || c.done ? '' : ' ac-zero'}">${label}</span>${amount}${stateHtml(c)}</div>`;
};
const mappingCheck = () => {
  const open = AC.unmapped();
  if (!open.length) return null;
  const rail = AC.RAILS.find(r => r.name === open[0].source && !r.cur);
  return { id:'mapping', label:'Account mapping', done:false, status:AC.count(open.length) + ' not mapped', fact:'', page:'settings', hash:rail ? '#' + rail.id : '' };
};
const rowsOf = month => {
  const mapping = mappingCheck();
  return AC.closeChecks(month).concat(mapping ? [mapping] : []);
};

/* ---------- Month card ---------- */
const blockerNote = month => {
  if (month !== AC.MONTH) return AC.periodClosed(AC.MONTH) ? month + ' has no data' : 'Close ' + AC.MONTH + ' first';
  const blockers = AC.closeChecks(month).filter(c => !c.done).length;
  return blockers ? AC.count(blockers) + (blockers === 1 ? ' blocker' : ' blockers') : '';
};
const monthActions = month => {
  if (AC.periodClosed(month)) {
    const lock = AC.lockOf(month);
    const reopen = AC.state.closed[month] && !AC.VIEW_ONLY ? `<button type="button" class="btn btn-sm pm-danger ac-close-action" data-act="reopen" data-key="periodAction">Reopen ${esc(month)}</button>` : '';
    return `<span class="ac-note">${esc(lock.at)} by ${esc(lock.by === 'You' ? 'you' : lock.by)}</span>${reopen}`;
  }
  const ready = AC.closeReady(month), note = blockerNote(month);
  const close = AC.VIEW_ONLY ? '' : `<button type="button" class="btn btn-primary btn-sm ac-close-action" data-act="close" data-key="periodAction"${ready ? '' : ' aria-disabled="true"'}${note ? ' aria-describedby="closeNote"' : ''}>Close ${esc(month)}</button>`;
  return `${note ? `<span class="ac-note" id="closeNote">${esc(note)}</span>` : ''}${close}`;
};
const monthCard = month => `<section class="ac-card ac-s8" aria-labelledby="monthTitle">
  <div class="ac-card__head ac-close-head"><h2 class="ac-card__title ac-close-title" id="monthTitle">${esc(month)}</h2>${periodStatus(month)}<div class="ac-actions">${monthActions(month)}</div></div>
  <div class="ac-kv" role="list" aria-labelledby="monthTitle">${rowsOf(month).map(checkRow).join('')}</div></section>`;

/* ---------- Closing and reopening ---------- */
function focusAction() { AC.focusAfterAction(document.querySelector('[data-key="periodAction"]')); }
function setLock(month, lock) {
  if (lock) AC.state.closed[month] = lock; else delete AC.state.closed[month];
  AC.save();
  AC.rerender();
}
function closePeriod(month) {
  AC.closeDialog();
  setLock(month, { at:'Oct 8, 2026', by:'You' });
  AC.toast(month + ' closed.', { undo:() => { setLock(month, null); focusAction(); } });
  focusAction();
}
function reopenPeriod(month) {
  const lock = AC.state.closed[month];
  AC.closeDialog();
  setLock(month, null);
  AC.toast(month + ' reopened.', { undo:() => { setLock(month, lock); focusAction(); } });
  focusAction();
}
function askClose(month) {
  const posted = AC.state.journal.posted;
  AC.openDialog({
    title:'Close ' + month,
    body:`<p class="ac-close-line">${AC.count(posted)} ${posted === 1 ? 'entry' : 'entries'} posted to ${esc(AC.LEDGER)}.</p><p class="ac-close-line">Entries can no longer change.</p>`,
    actions:[{ label:'Cancel', kind:'alternative', autofocus:true, onClick:() => AC.closeDialog() }, { label:'Close ' + month, kind:'primary', onClick:() => closePeriod(month) }],
  });
}
function askReopen(month) {
  AC.openDialog({
    title:'Reopen ' + month,
    body:'<p class="ac-close-line">Entries can change again.</p>',
    actions:[{ label:'Cancel', kind:'alternative', autofocus:true, onClick:() => AC.closeDialog() }, { label:'Reopen ' + month, kind:'danger', onClick:() => reopenPeriod(month) }],
  });
}
/* A blocked Close points at what blocks it. The band shows a mouse user where focus went, since a mouse shows no ring. */
function pointAtBlocker(month) {
  if (month !== AC.MONTH) {
    if (AC.periodClosed(AC.MONTH)) return;
    const period = document.querySelector(`[data-period="${CSS.escape(AC.MONTH)}"]`);
    AC.focusAfterAction(period);
    return;
  }
  const row = document.querySelector('.ac-close-check[data-done="false"]');
  const link = row && row.querySelector('a');
  if (!link) return;
  row.classList.add('ac-kv__row--sel');
  link.addEventListener('blur', () => row.classList.remove('ac-kv__row--sel'), { once:true });
  AC.focusAfterAction(link);
}
function exportChecklist() {
  const month = selected(), lock = AC.lockOf(month);
  const period = [month, idOf(month), AC.PERIOD_STATUS[AC.periodStatus(month)]];
  const rows = [['Month', 'Month id', 'Month status', 'Check', 'Check id', 'Status', 'Detail', 'Currency', 'Closed', 'Closed by']]
    .concat(rowsOf(month).map(c => period.concat([c.label, c.id, c.status, c.fact, isAmount(c.fact) ? 'USD' : '', lock ? lock.at : '', lock ? lock.by : ''])));
  AC.downloadCsv('close-' + idOf(month) + '.csv', rows);
  AC.toast('CSV exported.');
}

/* ---------- Events ---------- */
document.getElementById('app').addEventListener('click', e => {
  const period = e.target.closest('[data-period]');
  if (period) { location.hash = idOf(period.dataset.period); return; }
  const control = e.target.closest('[data-act]');
  if (!control || e.detail > 1) return;
  const month = selected();
  if (control.dataset.act === 'export') exportChecklist();
  else if (control.dataset.act === 'reopen') askReopen(month);
  else if (control.getAttribute('aria-disabled') === 'true') pointAtBlocker(month);
  else askClose(month);
});
document.getElementById('app').addEventListener('keydown', e => {
  if (e.key === ' ' && e.target.matches('a.ac-link')) { e.preventDefault(); e.target.click(); }
});
AC.rowClick('.ac-close-period', row => { location.hash = idOf(row.dataset.month); });
AC.rowClick('.ac-kv__row--link', row => row.querySelector('a').click());
window.addEventListener('hashchange', () => { AC.closeDialog(); writeDefaultHash(); syncMonth(); AC.rerender(); });
window.addEventListener('pageshow', ev => { if (ev.persisted) syncMonth(); });

syncMonth();
AC.start({
  current:'close',
  noMonth:true,
  head:() => ({ actions:'<button type="button" class="btn btn-neutral btn-sm" data-act="export" data-key="exportCsv">Export CSV</button>' }),
  render:() => { const month = selected(); return `<div class="ac-grid">${periodsCard(month)}${monthCard(month)}</div>`; },
  after:() => { const nav = document.querySelector('.ac-nav'), item = nav.querySelector('[aria-current="page"]'); nav.scrollLeft += Math.max(0, item.getBoundingClientRect().right - nav.getBoundingClientRect().right); },
  ready:writeDefaultHash,
});
</script>
</body>
</html>
