<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconciliation</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting-layout.css">
</head>
<body class="pm-journal ac ds" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Accounting";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
const esc = AC.esc;
const curOf = r => r.cur || 'USD';
const isZero = n => AC.round2(n) === 0;
const hasActivity = () => AC.month() === AC.MONTH;
const hasFigures = () => AC.MONTHS.includes(AC.month());

/* ---------- Clearing roll-forward ---------- */
const ROLL = [['opening', 'Starting'], ['netNew', 'Activity'], ['settledOut', 'Payouts'], ['adjustments', 'Adjustments'], ['ending', 'Ending'], ['unexplained', 'Unexplained']];
/* A month with no activity carries September's ending: no flows, no trend. */
const rollRows = () => AC.rollForward().map(r => hasActivity() ? r : Object.assign({}, r, { opening:r.ending, netNew:0, settledOut:0, adjustments:0, unexplained:null, series:null }));
const rollTotal = list => Object.fromEntries(ROLL.map(c => [c[0], AC.sum(list, r => r[c[0]])]));
const railHref = r => AC.hrefOf('balance') + '#' + r.rail.replace('_', '-');
/* Clearing Iris posts for payments with no payout data: USD, and not in an org with one rail. One row, or one per clearing account once the item is decided as split. A month with no activity carries the ending. */
const otherClearing = () => {
  if (AC.RAILS.length < 2) return [];
  const o = AC.OTHER_PAYMENTS;
  const parts = AC.state.journal.split ? o.parts.map(p => [p[0], p[2], p[0].toLowerCase().replace(/[^a-z0-9]+/g, '-')]) : [[o.channel, o.amount, 'other']];
  return parts.map(p => ({ rail:p[2], channel:p[0], opening:hasActivity() ? 0 : p[1], netNew:hasActivity() ? p[1] : 0, settledOut:0, adjustments:0, ending:p[1], unexplained:0 }));
};
const clearingEnding = (list, other) => AC.round2(AC.sum(list, r => r.ending) + AC.sum(other, r => r.ending));

const warnAmount = text => `<span class="badge badge-yellow badge-sm">${esc(text)}</span>`;
function moneyCell(n, cur, o = {}) {
  const row = o.total ? 'total' : 'default';
  const cls = o.cls;
  if (n === null || (o.fit && o.warn !== undefined && !hasActivity() && isZero(n))) return AC.td(AC.none, { num:true, row, cls });
  if (isZero(n)) return AC.td(AC.amt(0, cur), { num:true, row, cls });
  const text = AC.signed(n, cur);
  return AC.td(o.warn ? warnAmount(text) : esc(text), { num:true, row, cls });
}
const rollCells = (r, cur, total) => ROLL.map(c => moneyCell(r[c[0]], cur, { total, cls:c[0] === 'adjustments' ? 'ac-wide' : '', warn:c[0] === 'unexplained' && !AC.breakCleared('po_Tk05'), fit:c[0] === 'adjustments' || c[0] === 'unexplained' })).join('');
const clearingCells = (ending, cur) => ROLL.map(c => (c[0] === 'ending' ? moneyCell(ending, cur, { total:true }) : AC.td('', { row:'total', cls:c[0] === 'adjustments' ? 'ac-wide' : '' }))).join('');

const rollRow = (r, cur, href) => `<tr class="ac-row" data-href="${esc(href)}">${AC.td(`<a class="ac-rowlink" href="${esc(href)}" data-key="rail-${r.rail}">${esc(r.channel)}</a>`, { head:true })}${rollCells(r, cur)}${AC.td(AC.sparkLine(r.series, r.channel + ' balance over the month'), { num:true, cls:'ac-wide' })}</tr>`;

function rollForwardCard() {
  const rows = rollRows();
  const body = AC.CURRENCIES.map(cur => {
    const list = rows.filter(r => curOf(r) === cur);
    const other = cur === 'USD' ? otherClearing() : [];
    return `<tr>${AC.td(cur, { row:'group', span:8 })}</tr>` + list.map(r => rollRow(r, r.cur, railHref(r))).join('')
      + `<tr>${AC.td(`Total ${cur}`, { head:true, row:'total' })}${rollCells(rollTotal(list), cur, true)}${AC.td('', { row:'total', cls:'ac-wide' })}</tr>`
      + other.map(r => rollRow(r, cur, AC.hrefOf('journal') + '#entry-other')).join('')
      + (other.length ? `<tr>${AC.td(`Total clearing ${cur}`, { head:true, row:'total' })}${clearingCells(clearingEnding(list, other), cur)}${AC.td('', { row:'total', cls:'ac-wide' })}</tr>` : '');
  }).join('');
  return `<section class="card" id="rollforward" aria-labelledby="rollforwardTitle">${AC.cardTitle('rollforwardTitle', 'Clearing roll-forward', '', '<button type="button" class="btn btn-neutral btn-sm" id="exportCsv" data-key="exportCsv">Export CSV</button>')}
    <div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--ledger ac-keep"><caption class="ac-sr">Clearing roll-forward, ${esc(AC.month())}</caption>
      <colgroup><col class="ac-col-label">${ROLL.map(c => `<col class="ac-col-money${c[0] === 'adjustments' ? ' ac-wide' : ''}">`).join('')}<col class="ac-wide ac-col-trend"></colgroup>
      <thead><tr>${AC.th('Rail')}${ROLL.map(c => AC.th(c[1], { right:true, cls:c[0] === 'adjustments' ? 'ac-wide' : '' })).join('')}${AC.th('Trend', { right:true, cls:'ac-wide' })}</tr></thead>
      <tbody>${body}</tbody></table></div></section>`;
}

/* ---------- Checkpoints ---------- */
const PAIRS = [['matched', 'Matched'], ['partial', 'Partially matched'], ['unmatched', 'Unmatched'], ['pending', 'Pending']];
const SETTLEMENT_STATUS_OF = { matched:'paid', partial:'break', unmatched:'failed', pending:'pending' };
const pairHref = (key, rail) => AC.hrefOf('settlements') + `#rail=${rail}&status=${SETTLEMENT_STATUS_OF[key]}`;
const CHECKPOINTS = [
  { id:'checkpoint-1', n:1, title:'Order to payment', unit:'order', rows:() => AC.checkpointOrders() },
  { id:'checkpoint-2', n:2, title:'Payment to settlement', unit:'settlement', rows:() => AC.checkpointSettlements() },
];
const NONE = [0, 0];
/* Payments from rails with no payout data: USD orders, all unmatched, decided on Journal entries. Not in an org with one rail, as that org has no such entry. */
const otherPayments = () => (AC.RAILS.length > 1 ? [{ rail:'other', channel:AC.OTHER_PAYMENTS.channel, unit:'payment', href:AC.hrefOf('journal') + '#entry-other', matched:NONE, partial:NONE, unmatched:[AC.OTHER_PAYMENTS.count, AC.OTHER_PAYMENTS.amount], pending:NONE }] : []);
const otherDecided = () => !!AC.state.journal.unmatchedDecision || !AC.state.journal.open;
/* Other payments sit under the total, so the total ties to Charges. */
const checkpointGroups = cp => AC.CURRENCIES.map(cur => {
  const list = cp.rows().filter(r => curOf(r) === cur);
  const total = Object.fromEntries(PAIRS.map(p => [p[0], [list.reduce((n, r) => n + r[p[0]][0], 0), AC.sum(list, r => r[p[0]][1])]]));
  return { cur, list, total, after:cp.n === 1 && cur === 'USD' ? otherPayments() : [] };
});

function pairCell(row, pair, unit, cur, total) {
  const n = row[pair[0]][0], value = row[pair[0]][1], rowKind = total ? 'total' : 'default';
  if (isZero(value)) return AC.td(AC.amt(0, cur), { num:true, row:rowKind });
  const warn = pair[0] === 'unmatched' && !(row.rail === 'other' && otherDecided()) && !(row.rail === 'stripe' && AC.breakCleared('po_St90'));
  const word = row.unit || unit;
  const count = `<span class="ac-muted">${AC.count(n)}<span class="ac-sr"> ${word}${n === 1 ? '' : 's'}</span></span>`;
  const text = AC.money(value, cur);
  if (total) return AC.td(`${count}${warn ? warnAmount(text) : `<span>${esc(text)}</span>`}`, { num:true, row:'total' });
  const key = esc(unit + '-' + row.rail + '-' + pair[0]), name = esc(`${text}, ${row.channel}, ${pair[1]}`);
  const amount = unit === 'order' && !row.href
    ? `<button type="button" class="ac-amt" data-orders="${esc(row.rail + ':' + pair[0])}" data-key="${key}" aria-haspopup="dialog" aria-expanded="false" aria-label="${name}">${text}</button>`
    : `<a class="ac-amt" href="${esc(row.href || pairHref(pair[0], row.rail))}" data-key="${key}" aria-label="${name}">${text}</a>`;
  return AC.td(`${count}${warn ? `<span class="badge badge-yellow badge-sm">${amount}</span>` : amount}`, { num:true });
}

function checkpointCard(cp) {
  const open = `<section class="card" id="${cp.id}" aria-labelledby="${cp.id}-title">${AC.cardTitle(cp.id + '-title', cp.title)}`;
  if (!hasActivity()) return `${open}<div class="ac-empty"><span class="ac-muted">No activity for ${esc(AC.month())}</span></div></section>`;
  const line = (r, cur) => `<tr${cp.n === 1 ? ' data-drill' : ''}>${AC.td(esc(r.channel), { head:true })}${PAIRS.map(p => pairCell(r, p, cp.unit, cur)).join('')}</tr>`;
  const body = checkpointGroups(cp).map(g => `<tr>${AC.td(g.cur, { row:'group', span:5 })}</tr>` + g.list.map(r => line(r, r.cur || g.cur)).join('')
    + `<tr>${AC.td(`Total ${g.cur}`, { head:true, row:'total' })}${PAIRS.map(p => pairCell(g.total, p, cp.unit, g.cur, true)).join('')}</tr>`
    + g.after.map(r => line(r, g.cur)).join('')).join('');
  return `${open}<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--ledger"><caption class="ac-sr">${cp.title}, ${esc(AC.month())}</caption>
      <colgroup><col class="ac-col-label"><col class="ac-col-pair"><col class="ac-col-pair"><col class="ac-col-pair"><col class="ac-col-pair"></colgroup>
      <thead><tr>${AC.th('Rail')}${PAIRS.map(p => AC.th(p[1], { right:true })).join('')}</tr></thead>
      <tbody>${body}</tbody></table></div></section>`;
}

/* ---------- Order to payment: the orders behind a figure, in a panel, as on Balance ---------- */
const SAMPLE = { matched:e => !!e.payout && e.order !== '#48720', partial:e => e.order === '#48720', pending:e => !e.payout };
const ORDER_COLS = ['Order', 'Date', 'Transaction', 'Amount', 'Fee', 'Tax', 'Net', 'Settlement', 'Status'];
let panelRows = [], openBtn = null;
function pickRow(i) {
  document.querySelectorAll('#panelBody tbody tr').forEach((tr, n) => {
    tr.classList.toggle('ac-row--sel', n === i);
    tr.querySelector('[data-src-btn]').setAttribute('aria-pressed', n === i);
  });
  const slot = document.getElementById('sourceSlot');
  if (slot) slot.innerHTML = AC.sourceRow(AC.sourcePairs(panelRows[i]));
}
function orderRow(e, i, cur) {
  const settlement = e.payout ? `<a class="btn-link btn-link-semibold btn-sm" href="${esc(AC.hrefOf('settlements') + '#' + e.payout)}">${esc(e.payout)}</a>` : AC.none;
  return `<tr class="ac-row" data-src="${i}">${AC.td(`<button type="button" class="ac-rowlink" data-src-btn="${i}" aria-pressed="false">${esc(e.order)}</button>`, { head:true })}${AC.td(esc(e.date), {})}${AC.td(esc(e.txn), {})}${AC.td(AC.amt(e.amount, cur), { num:true })}${AC.td(AC.amt(e.fee, cur), { num:true })}${AC.td(AC.amt(e.tax, cur), { num:true })}${AC.td(AC.amt(e.net, cur), { num:true })}${AC.td(settlement, {})}${AC.td(`<span class="ac-muted">${esc(e.status)}</span>`, {})}</tr>`;
}
function openOrders(btn) {
  const [railId, key] = btn.dataset.orders.split(':');
  const r = AC.rail(railId), cur = curOf(r);
  const [n, value] = AC.checkpointOrders().find(x => x.rail === railId)[key];
  const label = PAIRS.find(p => p[0] === key)[1];
  panelRows = SAMPLE[key] ? AC.eventRows(r, 'charge').filter(SAMPLE[key]) : [];
  const noun = n === 1 ? 'order' : 'orders';
  const showing = panelRows.length === n ? `Showing ${AC.count(n)} ${noun}` : `Showing ${panelRows.length} of ${AC.count(n)} ${noun}`;
  const headCell = c => AC.th(c, { right:['Amount', 'Fee', 'Tax', 'Net'].includes(c) });
  AC.openPanel({
    title:label,
    count:n,
    amount:AC.money(value, cur),
    meta:`${r.name} · ${cur} · ${AC.MONTH}`,
    body:panelRows.length ? `<div class="ac-wrap-scroll ac-panel-table"><table class="ac-dst ac-dst--fin"><caption class="ac-sr">${esc(label)} orders, ${esc(AC.railLabel(r))}</caption><thead><tr>${ORDER_COLS.map(headCell).join('')}</tr></thead><tbody>${panelRows.map((e, i) => orderRow(e, i, cur)).join('')}</tbody></table></div>
      <div class="ac-name"><span class="ac-muted">${esc(showing)}</span></div>
      <div id="sourceSlot" role="status"></div>` : '<div class="ac-empty"><span class="ac-muted">No sample rows</span></div>',
    onOpen:() => { if (panelRows.length) pickRow(0); },
  });
  openBtn = btn;
  btn.setAttribute('aria-expanded', 'true');
  AC.keepReturnFocus(btn);
}
/* The amount stays marked for as long as its panel is open. */
new MutationObserver(() => {
  if (!openBtn || document.getElementById('modalBackdrop')) return;
  openBtn.setAttribute('aria-expanded', 'false');
  openBtn = null;
}).observe(document.getElementById('modalHost'), { childList:true });

const offCard = () => `<section class="card" aria-label="Not available yet"><div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--kv"><caption class="ac-sr">Not available yet</caption><tbody>${['Settlement to bank', 'Clearing to GL'].map(t => `<tr>${AC.td(`<span class="ac-muted">${t}</span>`, { head:true })}${AC.td('<span class="ac-muted">Not available yet</span>', { right:true })}</tr>`).join('')}</tbody></table></div></section>`;

/* ---------- Export: what the screen shows, all three tables in one file ---------- */
function exportCsv() {
  const month = AC.month();
  const head = ['Section', 'Month', 'Rail', 'Rail id', 'Currency'].concat(ROLL.map(c => c[1]), PAIRS.flatMap(p => [p[1] + ' count', p[1]]));
  const rollBlank = Array(ROLL.length).fill(''), pairBlank = Array(PAIRS.length * 2).fill('');
  const rollValues = r => ROLL.map(c => (!hasActivity() && (c[0] === 'adjustments' || c[0] === 'unexplained') ? '' : r[c[0]].toFixed(2)));
  const pairValues = r => PAIRS.flatMap(p => [r[p[0]][0], r[p[0]][1].toFixed(2)]);
  const rows = [head];
  const all = rollRows();
  AC.CURRENCIES.forEach(cur => {
    const list = all.filter(r => curOf(r) === cur);
    list.forEach(r => rows.push(['Clearing roll-forward', month, r.channel, r.rail, cur].concat(rollValues(r), pairBlank)));
    rows.push(['Clearing roll-forward', month, 'Total ' + cur, '', cur].concat(rollValues(rollTotal(list)), pairBlank));
    const other = cur === 'USD' ? otherClearing() : [];
    other.forEach(r => rows.push(['Clearing roll-forward', month, r.channel, r.rail, cur].concat(rollValues(r), pairBlank)));
    if (other.length) rows.push(['Clearing roll-forward', month, 'Total clearing ' + cur, '', cur].concat(ROLL.map(c => (c[0] === 'ending' ? clearingEnding(list, other).toFixed(2) : '')), pairBlank));
  });
  if (hasActivity()) CHECKPOINTS.forEach(cp => checkpointGroups(cp).forEach(g => {
    g.list.forEach(r => rows.push([cp.title, month, r.channel, r.rail, g.cur].concat(rollBlank, pairValues(r))));
    rows.push([cp.title, month, 'Total ' + g.cur, '', g.cur].concat(rollBlank, pairValues(g.total)));
    g.after.forEach(r => rows.push([cp.title, month, r.channel, r.rail, g.cur].concat(rollBlank, pairValues(r))));
  }));
  AC.downloadCsv('reconciliation-' + (hasActivity() ? '2026-09' : '2026-10') + '.csv', rows);
  AC.toast('CSV exported.');
}

/* ---------- Hash: a link can open any of the three tables ---------- */
const scrollToHash = () => {
  const id = location.hash.slice(1);
  const el = ['rollforward', 'checkpoint-1', 'checkpoint-2'].includes(id) ? document.getElementById(id) : null;
  if (el) el.scrollIntoView({ block:'start' });
};

AC.rowClick('tr.ac-row[data-href]', row => { location.href = row.dataset.href; });
AC.rowClick('#panelBody tbody tr', row => pickRow(+row.dataset.src));
document.addEventListener('click', e => {
  const t = e.target.closest('#exportCsv, [data-orders], [data-src-btn]');
  if (!t) return;
  if (t.dataset.srcBtn !== undefined) { pickRow(+t.dataset.srcBtn); return; }
  if (e.detail > 1) return;
  if (t.id === 'exportCsv') exportCsv(); else openOrders(t);
});

AC.start({
  current:'reconciliation',
  render:() => (hasFigures() ? `<div class="ac-stack">${rollForwardCard()}${CHECKPOINTS.map(checkpointCard).join('')}${offCard()}</div>` : `<div class="ac-stack"><section class="card"><div class="ac-empty"><span class="ac-muted">No sample figures for ${esc(AC.month())}</span></div></section></div>`),
  ready:() => {
    /* Back and Forward keep the reader's own scroll. */
    const nav = performance.getEntriesByType('navigation')[0];
    if (!nav || nav.type !== 'back_forward') scrollToHash();
    window.addEventListener('hashchange', scrollToHash);
  },
});
</script>
</body>
</html>
