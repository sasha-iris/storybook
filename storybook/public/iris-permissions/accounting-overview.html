<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting.css">
  <style>
    /* Overview only. */
    .ac-nav { position:relative; }
    a.btn:hover, a.btn:active { text-decoration:none; }
    a.ac-link:hover, a.ac-link:active { text-decoration-thickness:1px; }
    .ac-link--quiet { text-decoration-color:transparent; }
    .ac-tile__note { letter-spacing:-.02em; font-variant-numeric:tabular-nums lining-nums; }
    /* A row of cards inside the stack never widens the page. */
    .ac-stack { grid-template-columns:minmax(0,1fr); }
    /* Month close sits beside the checkpoints from 1440. */
    @media (max-width:1439px) { section[aria-labelledby="monthCloseTitle"] { grid-column:span 12; } .ac-cp:not(.ac-card--off) { grid-column:span 6; } }
    @media (min-width:1440px) and (max-width:1599px) { .ac-cp-cur { display:none; } }
  </style>
</head>
<body class="pm-journal ac" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Accounting";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
(function () {
  const esc = AC.esc;
  const hasActivity = () => AC.month() === AC.MONTH;

  /* ---------- Band. Charges, Fees and tax and Refunds foot to Activity. ---------- */
  const TILES = [
    { id:'charges', label:'Charges', of:t => t.gross, page:'events', hash:'#cat=charge' },
    { id:'fees', label:'Fees and tax', of:t => -(t.fees + t.tax), page:'events', hash:'#cat=feetax' },
    { id:'refunds', label:'Refunds', of:t => -t.refunds, page:'events', hash:'#cat=refund' },
    { id:'activity', label:'Activity', of:t => t.net, page:'balance', hash:'#all', key:true },
    { id:'paid', label:'Total paid out', of:t => t.payouts, page:'settlements', hash:'' },
    { id:'ending', label:'Ending balance', of:t => t.end, page:'balance', hash:'#all', carries:true },
  ];
  const noteSlot = '<div class="ac-note ac-tile__note" aria-hidden="true">&nbsp;</div>';

  function moneyTile(tile) {
    const [main, ...others] = AC.CURRENCIES;
    const amount = cur => (hasActivity() || tile.carries ? AC.round2(tile.of(AC.totals(cur))) : 0);
    const text = AC.signed(amount(main), main);
    const value = amount(main)
      ? `<a class="ac-link" href="${AC.hrefOf(tile.page)}${tile.hash}" aria-label="${esc(tile.label)}, ${esc(text)}" data-key="tile-${tile.id}">${esc(text)}</a>`
      : `<span class="ac-zero">${esc(text)}</span>`;
    const notes = others.map(cur => `<div class="ac-note ac-tile__note${amount(cur) ? '' : ' ac-zero'}">${esc(AC.signed(amount(cur), cur))}</div>`).join('');
    return `<div class="ac-tile${tile.key ? ' ac-tile--key' : ''}"><div class="ac-tile__label">${esc(tile.label)}</div><div class="ac-tile__value">${value}</div>${notes || noteSlot}</div>`;
  }

  const band = () => `<section class="ac-card" aria-label="${esc(AC.month())} figures"><div class="ac-band ac-band--6">${TILES.map(moneyTile).join('')}</div></section>`;

  /* ---------- Month close ---------- */
  function checkRow(check) {
    const fact = check.fact ? `<span class="ac-note">${esc(check.fact)}</span>` : '';
    const state = check.done ? `<span class="ac-status ac-status--ok">${esc(check.status)}</span>`
      : check.page ? `<span class="ac-chip ac-chip--warn">${esc(check.status)}</span>`
      : `<span class="ac-status ac-status--quiet">${esc(check.status)}</span>`;
    const end = `<span class="ac-close-status">${state}</span>${fact}`;
    return check.page
      ? `<div class="ac-kv__row ac-kv__row--link"><a class="ac-kv__label ac-link ac-link--quiet" href="${AC.hrefOf(check.page)}${check.hash}" data-key="check-${check.id}">${esc(check.label)}</a>${end}</div>`
      : `<div class="ac-kv__row"><span class="ac-kv__label">${esc(check.label)}</span>${end}</div>`;
  }

  function mappingRow() {
    const open = AC.unmapped();
    if (!open.length) return '';
    const rail = AC.RAILS.find(r => r.name === open[0].source && !r.cur);
    const text = AC.count(open.length) + ' not mapped';
    return `<div class="ac-kv__row"><span class="ac-kv__label">Account mapping</span><span class="ac-note ac-close-status"><a class="ac-link" href="${AC.hrefOf('settings')}${rail ? '#' + rail.id : ''}" data-key="mappingLink">${esc(text)}</a></span></div>`;
  }

  function monthClose() {
    const month = AC.month();
    const status = AC.periodStatus(month);
    const word = esc(AC.PERIOD_STATUS[status]);
    const lock = AC.lockOf(month);
    const end = status === 'closed' && lock
      ? `<span class="ac-note">${esc(lock.at)} by ${esc(lock.by === 'You' ? 'you' : lock.by)}</span>`
      : `<a class="btn ${AC.closeReady(month) ? 'btn-primary' : 'btn-neutral'} btn-sm ac-btn-row" href="${AC.hrefOf('close')}" data-key="closeLink">Go to Close</a>`;
    return `<section class="ac-card ac-s6" aria-labelledby="monthCloseTitle"><div class="ac-card__head ac-close__head"><h2 class="ac-card__title" id="monthCloseTitle">Month close</h2>${status === 'closed' ? `<span class="ac-status ac-status--quiet">${word}</span>` : `<span class="ac-chip ac-chip--wait">${word}</span>`}<div class="ac-actions">${end}</div></div><div class="ac-kv">${AC.closeChecks(month).map(checkRow).join('')}${mappingRow()}</div></section>`;
  }

  /* ---------- Checkpoints ---------- */
  const MATCH_ROWS = [['matched', 'Matched'], ['partial', 'Partially matched'], ['unmatched', 'Unmatched'], ['pending', 'Pending']];

  /* USD only. The rail rows foot to Charges. */
  function usdMatch(rows, key) {
    if (!hasActivity()) return [0, 0];
    const usd = rows.filter(r => !r.cur);
    return [usd.reduce((n, r) => n + r[key][0], 0), AC.sum(usd, r => r[key][1])];
  }

  const valueRow = (label, count, amount, warn) => `<div class="ac-kv__row"><span class="ac-kv__label">${esc(label)}${count ? ` <span class="ac-muted">(${esc(AC.count(count))})</span>` : ''}</span><span class="ac-num${!amount ? ' ac-zero' : warn ? ' ac-warn' : ''}">${esc(AC.money(amount))}</span></div>`;

  const matchRows = (rows, warnKey) => MATCH_ROWS.map(m => { const [count, amount] = usdMatch(rows, m[0]); return valueRow(m[1], count, amount, m[0] === warnKey); }).join('');

  /* Amber only while something is left to do: the Unmatched payments item, the failed payout's exception. */
  const otherOpen = () => { const j = AC.state.journal; return !!j.open && !j.unmatchedDecision && !AC.periodClosed(AC.MONTH); };
  const failedOpen = () => AC.openBreaks().some(s => s.status === 'failed');

  function otherRow() {
    if (AC.RAILS.length < 2) return '';
    const other = AC.OTHER_PAYMENTS, on = hasActivity();
    return valueRow(other.channel, on ? other.count : 0, on ? other.amount : 0, otherOpen());
  }

  const stepNote = (step, usd) => `<span class="ac-note">Checkpoint ${step}${usd ? '<span class="ac-cp-cur"> · USD</span>' : ''}</span>`;

  const checkpointCard = (step, title, rows) => `<section class="ac-card ac-s3 ac-cp"><div class="ac-card__head"><h2 class="ac-card__title"><a class="ac-link ac-link--quiet" href="${AC.hrefOf('reconciliation')}#checkpoint-${step}" data-key="checkpoint-${step}">${esc(title)}</a></h2>${stepNote(step, true)}</div><div class="ac-kv">${rows}</div></section>`;

  /* One line, as on Reconciliation. */
  const offCard = (step, title) => `<section class="ac-card ac-card--off ac-s6"><div class="ac-card__head"><h2 class="ac-card__title">${esc(title)}</h2>${stepNote(step)}<div class="ac-actions"><span class="ac-note">Not available yet</span></div></div></section>`;

  const working = () => `<div class="ac-grid">${monthClose()}${checkpointCard(1, 'Order to payment', matchRows(AC.checkpointOrders()) + otherRow())}${checkpointCard(2, 'Payment to settlement', matchRows(AC.checkpointSettlements(), failedOpen() ? 'unmatched' : ''))}</div>`;

  const offStrips = () => `<div class="ac-grid">${offCard(3, 'Settlement to bank')}${offCard(4, 'Clearing to GL')}</div>`;

  /* ---------- Page ---------- */
  const lockMonthWhenOff = () => { const select = document.getElementById('monthSelect'); if (select && !AC.RAILS.length) select.disabled = true; };

  AC.rowClick('.ac-kv__row--link', row => row.querySelector('a').click());

  AC.start({
    current:'overview',
    render:() => `<div class="ac-stack">${band()}${working()}${offStrips()}</div>`,
    ready:() => { lockMonthWhenOff(); window.addEventListener('pageshow', lockMonthWhenOff); },
  });
})();
</script>
</body>
</html>
