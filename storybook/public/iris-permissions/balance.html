<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting.css">
  <style>
    /* Balance only. */
    a.ac-link:hover, a.ac-link:active { text-decoration-thickness:1px; }
    .ac-row--sel .ac-link { text-decoration-color:currentColor; }
    .ac-row--link:active .ac-zero { color:var(--ac-2); }
    /* A chip that leads somewhere has the states of an amount link. */
    a.ac-chip { text-decoration:underline solid var(--ac-ul) 1px; text-underline-offset:3px; }
    a.ac-chip:hover { color:var(--ac-pri); text-decoration-color:currentColor; }
    a.ac-chip:active { color:var(--ac-pri-d); text-decoration-color:currentColor; }
    /* A chip that wraps in the tie-out strip leaves the other cells on the first line. */
    .ac-tie { align-items:start; }
    /* Under 1024 a table scrolls inside its wrap: this keeps the hidden text in there with it. */
    .ac-wrap { position:relative; }
    /* The events table scrolls inside the panel, so its Source row stays in view. CA$ amounts need the narrow gutter. */
    .ac-panel__body .ac-wrap { max-height:max(200px, calc(100vh - 372px)); overflow-y:auto; }
    .ac-table--panel { --ac-gut:12px; }
    .ac-table--panel td, .ac-table--panel tbody th { overflow:visible; }
    .ac-table--panel thead th { position:sticky; top:0; z-index:2; }
    /* A row header carries the same hairline as the cells beside it. */
    .ac-table--lines tbody tr + tr th { position:relative; }
    .ac-table--lines tbody tr + tr th::after { content:''; position:absolute; left:8px; right:0; top:0; height:1px; background:var(--ac-hair); }
    /* Charges and Activity carry Tax as a ninth column. */
    .ac-table--tax col:nth-child(1) { width:56px; } .ac-table--tax col:nth-child(2) { width:88px; } .ac-table--tax col:nth-child(5), .ac-table--tax col:nth-child(6), .ac-table--tax col:nth-child(9) { width:80px; } .ac-table--tax col:nth-child(7) { width:96px; } .ac-table--tax col:nth-child(8) { width:76px; }
    /* Payouts lead with the payout id and hold five figure amounts. */
    .ac-table--payouts col:nth-child(1) { width:72px; } .ac-table--payouts col:nth-child(2) { width:64px; } .ac-table--payouts col:nth-child(3) { width:112px; } .ac-table--payouts col:nth-child(4) { width:auto; } .ac-table--payouts col:nth-child(5), .ac-table--payouts col:nth-child(7) { width:112px; } .ac-table--payouts col:nth-child(6) { width:72px; }
  </style>
</head>
<body class="pm-journal ac" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Accounting";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
/* Balance: the All tab, one tab per rail, and the events panel with its Source row. Routes: #all #shopify #stripe #paypal #paypal-cad #amazon #tiktok. */
(function () {
  const { esc, money, signed, round2 } = AC;
  const TABS = [['all','All'],['shopify','Shopify Payments'],['stripe','Stripe'],['paypal','PayPal'],['amazon','Amazon'],['tiktok','TikTok Shop']].filter(t => t[0] === 'all' || AC.RAILS.some(r => r.tab === t[0]));
  const KINDS = { activity:'Activity', charge:'Charges', refund:'Refunds', fee:'Fees', tax:'Tax', payout:'Payouts' };
  const NOUNS = { activity:'events', charge:'charges', refund:'refunds', fee:'fees', tax:'tax rows', payout:'payouts' };
  const DASH = '<span class="ac-zero"><span aria-hidden="true">–</span><span class="ac-sr">not available</span></span>';
  const NOT_YET = '<span class="ac-zero"><span aria-hidden="true">–</span><span class="ac-sr">not available yet</span></span>';
  const S = { tab:'all', cur:'all', rowCur:'USD' };

  /* Coming back inside the section keeps the tab and the currency. */
  const SECTION_REFERRER = /(journal-entries|accounting-[a-z]+)\.html/;
  try {
    const nav = performance.getEntriesByType('navigation')[0];
    const view = JSON.parse(sessionStorage.getItem('pm-balance-view') || 'null');
    if (view && nav && nav.type !== 'reload' && (nav.type === 'back_forward' || SECTION_REFERRER.test(document.referrer))) {
      if (AC.CURRENCIES.includes(view.cur)) S.cur = view.cur;
      if (!location.hash && view.hash) history.replaceState(null, '', view.hash);
    }
  } catch (err) { /* private window: start over */ }
  window.addEventListener('pagehide', () => { try { sessionStorage.setItem('pm-balance-view', JSON.stringify({ hash:location.hash, cur:S.cur })); } catch (err) { /* nothing to keep */ } });

  function readHash() {
    const h = location.hash.slice(1);
    const cad = h === 'paypal-cad' && !!AC.rail('paypal_cad');
    S.tab = cad ? 'paypal' : TABS.some(t => t[0] === h) ? h : 'all';
    S.rowCur = cad ? 'CAD' : 'USD';
  }
  readHash();
  const hashFor = (tab, rowCur) => '#' + (tab === 'paypal' && rowCur === 'CAD' ? 'paypal-cad' : tab);
  const isSep = () => AC.month() === AC.MONTH;
  const curRail = () => { const list = AC.RAILS.filter(r => r.tab === S.tab); return list.find(r => (r.cur || 'USD') === S.rowCur) || list[0]; };
  const curOf = r => r.cur || 'USD';
  const ordersOff = r => (r.ordersEnding === null ? 0 : round2(Math.abs(r.ordersEnding - r.end)));

  /* ---------- Filter bar ---------- */
  function barHtml() {
    const isAll = S.tab === 'all', r = isAll ? null : curRail();
    const curs = isAll ? AC.CURRENCIES : AC.RAILS.filter(x => x.tab === S.tab).map(curOf);
    const picked = isAll ? S.cur : curOf(r);
    return `<div class="ac-bar">
      <div class="ac-seg" role="group" aria-label="Rail">${TABS.map(t => `<button type="button" class="ac-seg__item" aria-pressed="${S.tab === t[0]}" data-tab="${t[0]}" data-key="tab:${t[0]}">${esc(t[1])}</button>`).join('')}</div>
      <div class="ac-actions">
        <select class="form-input form-select ac-select ac-w148" aria-label="Rail account" data-key="acctSelect"${isAll ? ' disabled' : ''}><option>${isAll ? 'All accounts' : esc(r.acct)}</option></select>
        <select class="form-input form-select ac-select ac-w140" aria-label="Currency" id="curSelect" data-key="curSelect">${isAll ? '<option value="all">All currencies</option>' : ''}${curs.map(c => `<option value="${c}"${picked === c ? ' selected' : ''}>${c}</option>`).join('')}</select>
      </div>
    </div>`;
  }

  /* ---------- Amounts ---------- */
  function amount(r, kind, text, slot) {
    return `<button type="button" class="ac-link" data-open="${r.id}:${kind}" data-key="${r.id}:${kind}${slot ? ':' + slot : ''}" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(AC.railLabel(r))}, ${esc(KINDS[kind])}, ${esc(text.replace(AC.MINUS, 'minus '))}">${esc(text)}</button>`;
  }
  const processorHtml = tied => (tied ? '<span class="ac-status ac-status--ok">Tied</span>' : '<span class="ac-chip ac-chip--warn">Not tied</span>');
  const reserveHtml = r => (r.reserve ? '<span class="ac-muted">reserve</span>' : '');
  /* The orders difference is the break in this settlement. */
  const breakChip = text => { const cleared = AC.breakCleared('po_Tk05'); return `<a class="ac-chip ${cleared ? 'ac-chip--wait' : 'ac-chip--warn'}" href="${esc(AC.hrefOf('settlements') + '#po_Tk05')}">${text}${cleared ? `<span class="ac-chip__more">&nbsp;· ${AC.EXCEPTION_STATUS[AC.exceptionStatus(AC.exceptionOf('po_Tk05'))]}</span>` : ''}</a>`; };

  /* ---------- All tab, and a month with no data ---------- */
  const COLUMNS = '<colgroup><col><col class="ac-col-money"><col class="ac-col-money"><col class="ac-col-money-l"><col class="ac-col-money"><col class="ac-col-status"></colgroup><thead><tr><th scope="col">Rail</th><th scope="col" class="ac-num">Starting</th><th scope="col" class="ac-num">Activity</th><th scope="col" class="ac-num">Payouts</th><th scope="col" class="ac-num">Ending</th><th scope="col" class="ac-right">Processor</th></tr></thead>';
  function railRow(r) {
    const off = ordersOff(r);
    return `<tr class="ac-row--link" data-rail-row="${r.tab}" data-rail-cur="${curOf(r)}" data-drill>
      <th scope="row"><div class="ac-name"><button type="button" class="ac-toggle" data-tab="${r.tab}" data-cur="${curOf(r)}">${esc(r.name)}</button>${reserveHtml(r)}${off ? breakChip(`Orders off by ${money(off, r.cur)}`) : ''}</div></th>
      <td class="ac-num">${signed(r.start, r.cur)}</td>
      <td class="ac-num">${amount(r, 'activity', signed(r.net, r.cur))}</td>
      <td class="ac-num">${amount(r, 'payout', signed(-r.payouts, r.cur))}</td>
      <td class="ac-num ac-end">${signed(r.end, r.cur)}</td>
      <td class="ac-right">${processorHtml(r.native === undefined)}</td></tr>`;
  }
  function totalRow(c) {
    const t = AC.totals(c), sep = isSep();
    const values = sep ? [t.start, t.net, -t.payouts, t.end] : [t.end, 0, 0, t.end];
    return `<tr class="ac-total"><th scope="row">Total ${c}</th>${values.map(v => `<td class="ac-num${round2(v) ? '' : ' ac-zero'}"><span>${signed(v, c)}</span></td>`).join('')}<td class="ac-right">${sep && AC.railsIn(c).some(r => r.native !== undefined) ? processorHtml(false) : DASH}</td></tr>`;
  }
  function noDataRow(r) {
    const zero = `<td class="ac-num ac-zero">${money(0, r.cur)}</td>`;
    return `<tr><th scope="row"><div class="ac-name"><span>${esc(r.name)}</span>${reserveHtml(r)}</div></th><td class="ac-num">${signed(r.end, r.cur)}</td>${zero}${zero}<td class="ac-num ac-end">${signed(r.end, r.cur)}</td><td class="ac-right"><span class="ac-status ac-status--quiet">No data</span></td></tr>`;
  }
  function cardsHtml(rails, rowHtml, withTotal) {
    const picked = AC.CURRENCIES.filter(c => (S.tab !== 'all' || S.cur === 'all' || S.cur === c) && rails.some(r => curOf(r) === c));
    return `<div class="ac-stack">${picked.map(c => {
      const list = rails.filter(r => curOf(r) === c);
      return `<section class="ac-card" aria-label="${c}"><div class="ac-card__head"><h2 class="ac-card__title">${c}</h2><span class="ac-note">${list.length} ${list.length === 1 ? 'rail' : 'rails'}</span></div><div class="ac-wrap"><table class="ac-table"><caption class="ac-sr">Balance by rail, ${c}</caption>${COLUMNS}<tbody>${list.map(rowHtml).join('')}${withTotal ? totalRow(c) : ''}</tbody></table></div></section>`;
    }).join('')}</div>`;
  }

  /* ---------- Rail tab ---------- */
  const tile = (label, value, key) => `<div class="ac-tile${key ? ' ac-tile--key' : ''}"><div class="ac-tile__label">${label}</div><div class="ac-tile__value">${value}</div></div>`;
  const tieCell = (label, inner) => `<div class="ac-tie__cell"><span class="ac-tie__label">${label}</span>${inner}</div>`;
  function tieValue(v, r, chip) {
    const off = round2(Math.abs(v - r.end));
    const text = `Off by ${money(off, r.cur)}`;
    return `<span class="ac-num">${money(v, r.cur)}</span>${off > 0.01 ? (chip ? chip(text) : `<span class="ac-chip ac-chip--warn">${text}</span>`) : '<span class="ac-status ac-status--ok">Tied</span>'}`;
  }
  const kvCount = n => ` <span class="ac-muted">(${AC.count(n)})</span>`;
  const kvZero = (label, n, cur) => `<div class="ac-kv__row"><div class="ac-kv__label">${label}${kvCount(n)}</div><div class="ac-num ac-zero">${money(0, cur)}</div></div>`;
  const kvLink = (r, kind, label, text) => `<div class="ac-kv__row ac-kv__row--link${kind === 'tax' ? ' ac-kv__row--indent' : ''}" data-drill><div class="ac-kv__label">${label}</div><div class="ac-num">${amount(r, kind, text)}</div></div>`;
  const kvTotal = (label, text) => `<div class="ac-kv__row ac-kv__row--total"><div class="ac-kv__label">${label}</div><div class="ac-num">${text}</div></div>`;
  function railHtml() {
    const r = curRail(), cur = r.cur;
    return `<div class="ac-stack">
      <section class="ac-card" aria-label="Summary">
        <div class="ac-band">
          ${tile('Starting balance Sep 1', signed(r.start, cur))}
          ${tile('Net balance change from activity', amount(r, 'activity', signed(r.net, cur), 'tile'))}
          ${tile(`Total payouts (${AC.count(r.n.payout)})`, amount(r, 'payout', signed(-r.payouts, cur), 'tile'))}
          ${tile('Ending balance Sep 30', signed(r.end, cur), true)}
        </div>
        <div class="ac-tie">
          ${tieCell('Processor', tieValue(r.native !== undefined ? r.native : r.end, r))}
          ${tieCell('Orders', r.ordersEnding !== null ? tieValue(r.ordersEnding, r, breakChip) : NOT_YET)}
          ${tieCell('Bank', NOT_YET)}
          ${tieCell('GL', NOT_YET)}
        </div>
      </section>
      <div class="ac-grid">
        <section class="ac-card ac-s6" aria-labelledby="activityTitle">
          <div class="ac-card__head"><h2 class="ac-card__title" id="activityTitle">Balance change from activity</h2></div>
          <div class="ac-kv">
            ${kvLink(r, 'charge', 'Charges' + kvCount(r.n.charge), signed(r.gross, cur))}
            ${kvLink(r, 'refund', 'Refunds' + kvCount(r.n.refund), signed(-r.refunds, cur))}
            ${kvZero('Disputes', r.n.dispute, cur)}
            ${r.reserve ? kvZero('Reserves', 0, cur) : ''}
            ${kvLink(r, 'fee', 'Fees' + kvCount(r.n.fee), signed(-r.fees, cur))}
            ${kvLink(r, 'tax', 'Tax', signed(-r.tax, cur))}
            ${kvTotal('Net balance change from activity', signed(r.net, cur))}
          </div>
        </section>
        <section class="ac-card ac-s6" aria-labelledby="payoutsTitle">
          <div class="ac-card__head"><h2 class="ac-card__title" id="payoutsTitle">Payouts</h2></div>
          <div class="ac-kv">
            ${kvLink(r, 'payout', 'Payouts' + kvCount(r.n.payout), money(r.payouts, cur))}
            ${kvTotal('Total paid out', money(r.payouts, cur))}
          </div>
        </section>
      </div>
    </div>`;
  }

  /* ---------- Events panel ---------- */
  let panelRows = [], panelRail = null, openKey = null;
  function pickRow(i) {
    document.querySelectorAll('#panelBody tbody tr').forEach((tr, n) => {
      tr.classList.toggle('ac-row--sel', n === i);
      tr.querySelector('[data-src-btn]').setAttribute('aria-pressed', n === i);
    });
    document.getElementById('sourceSlot').innerHTML = AC.sourceRow(AC.sourcePairs(panelRows[i]));
  }
  function openEvents(id, kind, payoutId) {
    const dayOf = ev => Number(ev.date.replace('Sep ', ''));
    const r = AC.rail(id), cur = r.cur, rows = AC.eventRows(r, kind).sort((a, b) => dayOf(a) - dayOf(b)), n = AC.kindCount(r, kind);
    const isPayouts = kind === 'payout', withTax = kind === 'charge' || kind === 'activity';
    const cols = ['Date','Transaction','Description','Amount','Fee'].concat(withTax ? ['Tax'] : []).concat(['Net','Payout','Status']);
    const shown = isPayouts ? ['Payout'].concat(cols.filter(c => c !== 'Payout')) : cols;
    const headCell = c => `<th scope="col"${['Amount','Fee','Tax','Net'].includes(c) ? ' class="ac-num"' : c === 'Status' ? ' class="ac-right"' : ''}>${c}</th>`;
    const cell = (c, ev, i) => {
      if (c === 'Date') return ['', `<button type="button" class="ac-toggle" data-src-btn="${i}" aria-pressed="false">${esc(ev.date)}</button>`];
      if (c === 'Transaction') return ['ac-mono', esc(ev.txn)];
      if (c === 'Description') return ['', esc(ev.desc)];
      if (c === 'Status') return ['ac-right', `<span class="ac-status ac-status--quiet">${esc(ev.status)}</span>`];
      if (c === 'Payout') {
        if (!ev.payout) return ['ac-mono', DASH];
        return ['ac-mono', isPayouts ? `<a class="ac-link" href="${esc(AC.hrefOf('settlements'))}#${esc(ev.payout)}">${esc(ev.payout)}</a>` : `<button type="button" class="ac-link" data-payout="${esc(ev.payout)}">${esc(ev.payout)}</button>`];
      }
      const v = ev[c.toLowerCase()];
      return [`ac-num${round2(v) ? '' : ' ac-zero'}`, signed(v, cur)];
    };
    const rowCells = (ev, i) => shown.map((c, col) => {
      const [cls, inner] = cell(c, ev, i);
      const attr = cls ? ` class="${cls}"` : '';
      return col ? `<td${attr}>${inner}</td>` : `<th scope="row"${attr}>${inner}</th>`;
    }).join('');
    const noun = n === 1 ? NOUNS[kind].replace(/s$/, '') : NOUNS[kind];
    const showing = rows.length === n ? `Showing ${AC.count(n)} ${noun}` : `Showing ${rows.length} of ${AC.count(n)} ${NOUNS[kind]}`;
    const inEvents = `${AC.hrefOf('events')}#rail=${r.id}${kind === 'activity' ? '' : '&cat=' + kind}`;
    panelRows = rows;
    panelRail = r;
    AC.openPanel({
      title:KINDS[kind],
      count:kind === 'activity' || kind === 'tax' ? null : n,
      amount:signed(AC.kindTotal(r, kind), cur),
      meta:`${r.name} · ${curOf(r)} · ${AC.MONTH}`,
      body:`<div class="ac-wrap"><table class="ac-table ac-table--panel${isPayouts ? ' ac-table--payouts ac-table--lines' : withTax ? ' ac-table--tax' : ''}"><caption class="ac-sr">${esc(KINDS[kind])} in ${esc(AC.railLabel(r))}</caption><colgroup>${shown.map(() => '<col>').join('')}</colgroup><thead><tr>${shown.map(headCell).join('')}</tr></thead><tbody>${rows.map((ev, i) => `<tr class="ac-row--link" data-src="${i}">${rowCells(ev, i)}</tr>`).join('')}</tbody></table></div>
        <div class="ac-name"><span class="ac-note">${esc(showing)}</span>${isPayouts ? '' : `<a class="ac-link" href="${esc(inEvents)}">View in Events</a>`}</div>
        <div id="sourceSlot" role="status"></div>`,
      onExport:() => {
        AC.downloadCsv(`balance-${r.id}-${kind}-2026-09.csv`, [cols.concat('Currency')].concat(rows.map(x => [AC.isoDate(x.date), x.txn, x.desc, x.amount.toFixed(2), x.fee.toFixed(2)].concat(withTax ? [x.tax.toFixed(2)] : []).concat([x.net.toFixed(2), x.payout || '', x.status, curOf(r)]))));
        AC.toast('CSV exported.');
      },
      onOpen:body => {
        const start = payoutId ? Math.max(0, rows.findIndex(x => x.payout === payoutId)) : 0;
        pickRow(start);
        body.querySelector(`[data-src="${start}"]`).scrollIntoView({ block:'nearest' });
      },
    });
  }
  function openFrom(btn) {
    const [id, kind] = btn.dataset.open.split(':');
    openEvents(id, kind);
    openKey = btn.dataset.key;
    btn.setAttribute('aria-expanded', 'true');
    AC.keepReturnFocus(btn);
  }
  /* The amount stays marked for as long as its panel is open. */
  new MutationObserver(() => {
    if (!openKey || document.getElementById('modalBackdrop')) return;
    const el = document.querySelector(`[data-key="${openKey}"]`);
    if (el) el.setAttribute('aria-expanded', 'false');
    openKey = null;
  }).observe(document.getElementById('modalHost'), { childList:true });

  /* ---------- Export ---------- */
  function exportPage() {
    const sep = isSep(), file = sep ? '2026-09' : '2026-10';
    const ordersWord = r => (r.ordersEnding === null ? '' : ordersOff(r) ? 'Off by ' + ordersOff(r).toFixed(2) : 'Tied');
    if (S.tab === 'all') {
      const rows = [['Rail','Currency','Starting','Activity','Payouts','Ending','Processor','Orders']];
      AC.CURRENCIES.filter(c => S.cur === 'all' || S.cur === c).forEach(c => {
        const t = AC.totals(c);
        AC.railsIn(c).forEach(r => rows.push(sep ? [r.name, c, r.start.toFixed(2), r.net.toFixed(2), (-r.payouts).toFixed(2), r.end.toFixed(2), r.native === undefined ? 'Tied' : 'Not tied', ordersWord(r)] : [r.name, c, r.end.toFixed(2), '0.00', '0.00', r.end.toFixed(2), 'No data', '']));
        rows.push(sep ? ['Total ' + c, c, t.start.toFixed(2), t.net.toFixed(2), (-t.payouts).toFixed(2), t.end.toFixed(2), '', ''] : ['Total ' + c, c, t.end.toFixed(2), '0.00', '0.00', t.end.toFixed(2), '', '']);
      });
      AC.downloadCsv('balance-all-' + file + '.csv', rows);
    } else {
      const r = curRail(), c = curOf(r);
      const native = r.native !== undefined ? r.native : r.end;
      const head = ['Section','Line','Count','Amount','Currency','Check'];
      AC.downloadCsv('balance-' + r.id + '-' + file + '.csv', !sep ? [head, ['Summary','Starting balance','',r.end.toFixed(2),c,''],['Summary','Net balance change from activity','','0.00',c,''],['Summary','Total payouts',0,'0.00',c,''],['Summary','Ending balance','',r.end.toFixed(2),c,'No data']] : [head,
        ['Summary','Starting balance','',r.start.toFixed(2),c,''],['Summary','Net balance change from activity','',r.net.toFixed(2),c,''],['Summary','Total payouts',r.n.payout,(-r.payouts).toFixed(2),c,''],['Summary','Ending balance','',r.end.toFixed(2),c,''],
        ['Tie-outs','Processor','',native.toFixed(2),c,r.native === undefined ? 'Tied' : 'Off by ' + round2(Math.abs(native - r.end)).toFixed(2)],['Tie-outs','Orders','',r.ordersEnding !== null ? r.ordersEnding.toFixed(2) : '',c,r.ordersEnding !== null ? ordersWord(r) : 'Not available yet'],['Tie-outs','Bank','','',c,'Not available yet'],['Tie-outs','GL','','',c,'Not available yet'],
        ['Activity','Charges',r.n.charge,r.gross.toFixed(2),c,''],['Activity','Refunds',r.n.refund,(-r.refunds).toFixed(2),c,''],['Activity','Disputes',r.n.dispute,'0.00',c,''],...(r.reserve ? [['Activity','Reserves',0,'0.00',c,'']] : []),['Activity','Fees',r.n.fee,(-r.fees).toFixed(2),c,''],['Activity','Tax','',(-r.tax).toFixed(2),c,''],['Activity','Net balance change from activity','',r.net.toFixed(2),c,''],
        ['Payouts','Payouts',r.n.payout,r.payouts.toFixed(2),c,''],['Payouts','Total paid out','',r.payouts.toFixed(2),c,'']]);
    }
    AC.toast('CSV exported.');
  }

  /* ---------- Events ---------- */
  function setTab(tab, cur) {
    const rowCur = cur || (tab === S.tab ? S.rowCur : S.tab === 'all' && S.cur !== 'all' ? S.cur : 'USD');
    const hash = hashFor(tab, rowCur);
    if (hash !== (location.hash || '#all')) location.hash = hash;
  }
  window.addEventListener('hashchange', () => {
    const hadPanel = !!document.getElementById('modalBackdrop');
    const hadFocus = document.activeElement !== document.body;
    if (hadPanel) { openKey = null; AC.keepReturnFocus(null); AC.closePanel(); }
    readHash();
    AC.rerender();
    if (hadPanel || (hadFocus && document.activeElement === document.body)) { const b = document.querySelector(`[data-key="tab:${S.tab}"]`); if (b) b.focus(); }
  });
  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { if (e.detail < 2) setTab(t.dataset.tab, t.dataset.cur); return; }
    if (t.dataset.open) { openFrom(t); return; }
    if (t.dataset.payout) { openEvents(panelRail.id, 'payout', t.dataset.payout); return; }
    if (t.dataset.srcBtn !== undefined) { pickRow(+t.dataset.srcBtn); return; }
    if (t.id === 'exportPage' && e.detail < 2) exportPage();
  });
  document.addEventListener('change', e => {
    if (e.target.id !== 'curSelect') return;
    if (S.tab === 'all') S.cur = e.target.value;
    else { S.rowCur = e.target.value; history.replaceState(null, '', hashFor(S.tab, S.rowCur)); }
    AC.rerender();
  });
  AC.rowClick('[data-rail-row]', row => setTab(row.dataset.railRow, row.dataset.railCur));
  AC.rowClick('.ac-kv__row--link', row => openFrom(row.querySelector('[data-open]')));
  AC.rowClick('#panelBody tbody tr', row => pickRow(+row.dataset.src));

  AC.start({
    current:'balance',
    head:() => ({ actions:'<button type="button" class="btn btn-neutral btn-sm" id="exportPage" data-key="exportPage">Export CSV</button>' }),
    render:() => barHtml() + (S.tab === 'all' ? cardsHtml(AC.RAILS, isSep() ? railRow : noDataRow, true) : isSep() ? railHtml() : cardsHtml([curRail()], noDataRow, false)),
    after:() => {
      const el = openKey && document.getElementById('modalBackdrop') && document.querySelector(`[data-key="${openKey}"]`);
      if (!el) return;
      el.setAttribute('aria-expanded', 'true');
      AC.keepReturnFocus(el);
      const row = el.closest('[data-drill]');
      if (row) row.classList.add(row.matches('.ac-kv__row') ? 'ac-kv__row--sel' : 'ac-row--sel');
    },
  });
})();
</script>
