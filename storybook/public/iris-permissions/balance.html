   Rail totals come from the Balance mock (Sep 2026, per currency, never mixed). Splits, counts, ids and rows are sample values, the same as on Journal entries. */
const MINUS = '−';
const CHEVRON = '<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L11.17 10 7.23 6.29a.75.75 0 1 1 1.04-1.08l4.5 4.25a.75.75 0 0 1 0 1.08l-4.5 4.25a.75.75 0 0 1-1.06-.02Z" clip-rule="evenodd"/></svg>';

const S = { tab:'all', month:'Sep 2026', cur:'all', rowCur:'USD' };
const readHash = () => { const h = location.hash.replace('#', ''); const cad = h === 'paypal-cad'; S.tab = cad ? 'paypal' : TABS.some(t => t[0] === h) ? h : 'all'; S.rowCur = cad ? 'CAD' : 'USD'; };
readHash();

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n, cur) { return (cur === 'CAD' ? 'CA$' : '$') + Number(Math.abs(n)).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function neg(n, cur) { return MINUS + money(n, cur); }
function round2(n) { return Math.round(n * 100) / 100; }
function rail(id) { return RAILS.find(r => r.id === id); }
function curRail() { const list = RAILS.filter(r => r.tab === S.tab); return list.find(r => (r.cur || 'USD') === S.rowCur) || list[0]; }
const SR = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);';
const TD = 'padding:6px 8px;height:44px;box-sizing:border-box;font-size:13px;line-height:18px;color:var(--color-text-primary);border-top:1px solid var(--color-border-default);';

/* ---------- Page ---------- */
function filtersHtml() {
  const isAll = S.tab === 'all';
  const r = isAll ? null : curRail();
  const curs = isAll ? ['USD','CAD'] : RAILS.filter(x => x.tab === S.tab).map(x => x.cur || 'USD');
  const acct = isAll ? '<option>All accounts</option>' : `<option>${esc(r.acct)}</option>`;
  const curOptions = (isAll ? '<option value="all">All currencies</option>' : '') + curs.map(c => `<option value="${c}"${(isAll ? S.cur : S.rowCur) === c ? ' selected' : ''}>${c}</option>`).join('');
  const singleCur = !isAll && curs.length === 1;
  return `<div class="pm-bfilters">
    <div class="btn-group" role="group" aria-label="Processor">${TABS.map(t => `<button type="button" class="btn${S.tab === t[0] ? ' active' : ''}" aria-pressed="${S.tab === t[0]}" data-tab="${t[0]}" data-key="tab:${t[0]}">${esc(t[1])}</button>`).join('')}</div>
    <div class="pm-bfilters__right">
      <select class="form-input form-select" aria-label="Account" disabled>${acct}</select>
      <select class="form-input form-select" aria-label="Currency" id="curSelect" data-key="curSelect"${singleCur ? ' disabled' : ''}>${curOptions}</select>
      <select class="form-input form-select" aria-label="Month" id="monthSelect" data-key="monthSelect">${['Sep 2026','Oct 2026'].map(m => `<option${S.month === m ? ' selected' : ''}>${m}</option>`).join('')}</select>
      <span class="pm-btz">America/Chicago</span>
    </div>
  </div>`;
}
function statusHtml(tied) { return tied ? '<span class="pm-ok">Tied</span>' : '<span class="badge badge-yellow badge-sm">Not tied</span>'; }
function allHtml() {
  const cards = ['USD','CAD'].filter(c => S.cur === 'all' || S.cur === c).map((c, i) => {
    const cur = c === 'CAD' ? 'CAD' : undefined;
    const list = RAILS.filter(r => r.cur === cur);
    const sum = f => round2(list.reduce((n, r) => n + f(r), 0));
    const rows = list.map((r, n) => `<div class="pm-entry" style="${n ? 'border-top:1px solid var(--color-border-default);' : ''}"><div class="pm-entry__row pm-bgrid pm-brow" data-rail-row="${r.tab}" data-rail-cur="${c}">
        <div class="pm-bname"><button type="button" class="pm-blink" data-tab="${r.tab}" data-cur="${c}">${esc(r.name)}</button>${r.reserve ? '<span class="form-helper" style="margin:0;">reserve</span>' : ''}${r.orders && round2(Math.abs(r.orders.value - r.end)) ? `<span class="badge badge-yellow badge-sm">Orders off by ${money(r.orders.value - r.end, cur)}</span>` : ''}</div>
        <div class="pm-num"><span style="${SR}">Starting </span>${money(r.start, cur)}</div>
        <div class="pm-num"><span style="${SR}">Activity </span><button type="button" class="pm-amount" data-open="${r.id}:activity" aria-label="${esc(r.name)}${r.cur ? ' ' + r.cur : ''}, activity, ${money(r.net, cur)}">${money(r.net, cur)}</button></div>
        <div class="pm-num"><span style="${SR}">Payouts </span><button type="button" class="pm-amount" data-open="${r.id}:payout" aria-label="${esc(r.name)}${r.cur ? ' ' + r.cur : ''}, payouts, minus ${money(r.payouts, cur)}">${neg(r.payouts, cur)}</button></div>
        <div class="pm-num"><span style="${SR}">Ending </span>${money(r.end, cur)}</div>
        <div style="text-align:right;">${statusHtml(true)}</div>
      </div></div>`).join('');
    return `<section class="card" aria-label="${c}"${i ? ' style="margin-top:16px;"' : ''}>
      <div class="pm-att__head pm-att__head--plain"><div class="card-header-title" role="heading" aria-level="2">${c} <span class="pm-count">${list.length} ${list.length === 1 ? 'rail' : 'rails'}</span></div></div>
      <div class="pm-bgrid pm-bhead" aria-hidden="true"><span>Rail</span><span>Starting</span><span>Activity</span><span>Payouts</span><span>Ending</span><span>Processor</span></div>
      ${rows}
      <div class="pm-bgrid pm-btotal"><div>Total ${c}</div><div class="pm-num"><span style="${SR}">Starting </span>${money(sum(r => r.start), cur)}</div><div class="pm-num"><span style="${SR}">Activity </span>${money(sum(r => r.net), cur)}</div><div class="pm-num"><span style="${SR}">Payouts </span>${neg(sum(r => r.payouts), cur)}</div><div class="pm-num"><span style="${SR}">Ending </span>${money(sum(r => r.end), cur)}</div><div class="pm-num"><span aria-hidden="true">–</span></div></div>
    </section>`;
  });
  return cards.join('');
}
function kv(label, value, opts = {}) {
  return `<div class="pm-kv${opts.total ? ' pm-kv--total' : ''}${opts.sub ? ' pm-kv--sub' : ''}"${opts.kind ? ` data-kv="${opts.kind}"` : ''}><div class="pm-kv__label">${label}</div><div class="pm-kv__value">${value}</div></div>`;
}
function amountLink(r, kind, text) { return `<button type="button" class="pm-amount" data-open="${r.id}:${kind}" aria-label="${esc(r.name)}${r.cur ? ' ' + r.cur : ''}, ${esc(KINDS[kind])}, ${text.replace(MINUS, 'minus ')}">${text}</button>`; }
function count(n) { return ` <span class="pm-kv__count">(${n.toLocaleString('en-US')})</span>`; }
function tieoutHtml(r) {
  const cur = r.cur;
  const dash = label => `<span class="pm-tie__item"><span class="pm-tie__label">${label}</span><span aria-hidden="true" class="pm-tie__dash">–</span><span style="${SR}">not available</span></span>`;
  const value = (label, v) => {
    const off = round2(Math.abs(v - r.end));
    return `<span class="pm-tie__item"><span class="pm-tie__label">${label}</span><span>${money(v, cur)}</span>${off ? `<span class="badge badge-yellow badge-sm">Off by ${money(off, cur)}</span>` : '<span class="pm-ok">Tied</span>'}</span>`;
  };
  return `<div class="pm-tieouts">${value('Processor', r.end)}${r.orders ? value('Orders', r.orders.value) : dash('Orders')}${dash('Bank')}${dash('GL')}</div>`;
}
function railHtml() {
  const r = curRail(), cur = r.cur;
  return `<div class="pm-bal-grid">
    <section class="card" aria-labelledby="sumTitle"><div class="pm-att__head pm-att__head--plain"><div class="card-header-title" role="heading" aria-level="2" id="sumTitle">Summary</div></div>
      ${kv('Starting balance <span class="pm-kv__count">Sep 1</span>', money(r.start, cur))}
      ${kv('Net balance change from activity', amountLink(r, 'activity', money(r.net, cur)), { kind:'activity' })}
      ${kv('Total payouts' + count(r.n.payout), amountLink(r, 'payout', neg(r.payouts, cur)), { kind:'payout' })}
      ${kv('Ending balance <span class="pm-kv__count">Sep 30</span>', money(r.end, cur), { total:true })}
      ${tieoutHtml(r)}
    </section>
    <section class="card" aria-labelledby="actTitle"><div class="pm-att__head pm-att__head--plain"><div class="card-header-title" role="heading" aria-level="2" id="actTitle">Balance change from activity</div></div>
      ${kv('Charges' + count(r.n.charge), amountLink(r, 'charge', money(r.gross, cur)), { kind:'charge' })}
      ${kv('Refunds' + count(r.n.refund), amountLink(r, 'refund', neg(r.refunds, cur)), { kind:'refund' })}
      ${kv('Disputes' + count(r.n.dispute), money(0, cur))}
      ${kv('Fees' + count(r.n.fee), amountLink(r, 'fee', neg(r.fees, cur)), { kind:'fee' })}
      ${kv('Tax', amountLink(r, 'tax', neg(r.tax, cur)), { sub:true, kind:'tax' })}
      ${kv('Net balance change from activity', money(r.net, cur), { total:true })}
    </section>
    <section class="card" aria-labelledby="payTitle"><div class="pm-att__head pm-att__head--plain"><div class="card-header-title" role="heading" aria-level="2" id="payTitle">Payouts</div></div>
      ${kv('Payouts' + count(r.n.payout), amountLink(r, 'payout', money(r.payouts, cur)), { kind:'payout' })}
      ${kv('Total paid out', money(r.payouts, cur), { total:true })}
    </section>
  </div>`;
}
function emptyHtml() { return `<section class="card pm-bempty"><div class="card-header-title" role="heading" aria-level="2">No activity for ${esc(S.month)}</div></section>`; }
function render() {
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  document.getElementById('app').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;">
      <div><h1 style="margin:0 0 4px;font-size:20px;line-height:30px;font-weight:600;color:#111928;">Accounting</h1><p style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:0 0 16px;font-size:14px;line-height:21px;color:#374151;"><span class="badge badge-gray badge-sm">Sample data</span></p></div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;"><button type="button" class="btn btn-neutral btn-sm" id="exportPage" data-key="exportPage"${S.month === 'Sep 2026' ? '' : ' disabled'}>${ICON_DOWNLOAD}Export CSV</button></div>
    </div>
    <nav class="iris-tab-bar pm-section-nav" aria-label="Accounting"><a class="iris-tab iris-tab--active" aria-current="page" href="balance.html">Balance</a><a class="iris-tab" href="journal-entries.html" id="toJournal">Journal entries</a></nav>
    ${filtersHtml()}
    ${S.month !== 'Sep 2026' ? emptyHtml() : S.tab === 'all' ? allHtml() : railHtml()}`;
  if (active) { const el = document.querySelector(`[data-key="${CSS.escape(active)}"]`); if (el) el.focus(); }
}

/* ---------- Toast ---------- */
let toastTimer, overlayClosedAt = 0, overlayOpenedAt = 0, returnFocus = null, lastClickTarget = null, rowTimer = null;
function placeToast() {
  const host = document.getElementById('toastHost');
  const box = document.getElementById('toastBox');
  const drawer = document.querySelector('.pm-drawer');
  const action = document.getElementById('exportPage');
  let top = 16, right = 16, max = 440;
  if (drawer) {
    const left = drawer.getBoundingClientRect().left;
    right = window.innerWidth - left + 16;
    max = Math.max(200, left - 32);
  } else if (box && action) {
    const r = action.getBoundingClientRect();
    if (r.right > box.getBoundingClientRect().left) top = Math.max(16, r.bottom + 8);
  }
  host.style.top = top + 'px';
  host.style.right = right + 'px';
  host.style.maxWidth = max + 'px';
  host.classList.toggle('is-narrow', max < 360);
}
window.addEventListener('scroll', placeToast, true);
window.addEventListener('resize', placeToast);
function toast(msg) {
  const host = document.getElementById('toastHost');
  host.innerHTML = `<div class="toast" id="toastBox"><p class="toast-body" style="margin:0;flex:1;">${esc(msg)}</p><button type="button" class="toast-close" id="toastClose" aria-label="Dismiss">×</button></div>`;
  const clear = () => { const inside = host.contains(document.activeElement); clearTimeout(toastTimer); host.innerHTML = ''; if (inside) { const f = document.getElementById('ordExport') || document.getElementById('exportPage'); if (f) f.focus({ preventScroll:true }); } };
  document.getElementById('toastClose').onclick = () => { overlayClosedAt = Date.now(); clear(); };
  clearTimeout(toastTimer);
  const arm = () => { clearTimeout(toastTimer); toastTimer = setTimeout(clear, 5000); };
  const box = document.getElementById('toastBox');
  box.addEventListener('mouseenter', () => clearTimeout(toastTimer));
  box.addEventListener('mouseleave', arm);
  box.addEventListener('focusin', () => clearTimeout(toastTimer));
  box.addEventListener('focusout', arm);
  arm();
  placeToast();
}

/* ---------- Drawer ---------- */
function lockPage() {
  if (document.body.style.overflow === 'hidden') return;
  const gutter = window.innerWidth - document.documentElement.clientWidth;
  document.documentElement.style.scrollbarGutter = 'auto';
  document.body.style.overflow = 'hidden';
  document.body.style.paddingRight = gutter + 'px';
  document.querySelector('body > div').inert = true;
}
function unlockPage() {
  document.documentElement.style.scrollbarGutter = '';
  document.body.style.overflow = '';
  document.body.style.paddingRight = '';
  document.querySelector('body > div').inert = false;
}
function closeDrawer() {
  overlayClosedAt = Date.now();
  unlockPage();
  document.querySelectorAll('.is-drilled').forEach(x => x.classList.remove('is-drilled'));
  document.getElementById('modalHost').innerHTML = '';
  placeToast();
  document.removeEventListener('keydown', drawerKeys);
  if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
}
function drawerKeys(e) {
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (e.key !== 'Tab') return;
  const f = [...document.querySelectorAll('#modalHost button:not([disabled]), #toastHost button')];
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
}
function laterDate(d) { return 'Sep ' + Math.min(30, Number(d.replace('Sep ', '')) + 3); }
function firstPayoutAfter(id, day) { const list = PAYOUTS[id]; return (list.find(p => Number(p[1].replace('Sep ', '')) >= day) || list[list.length - 1])[0]; }
/* A row: date, transaction, description, amount, fee, net, payout, status, plus the raw fields the source row reads. */
function eventRows(r, kind) {
  const cur = r.cur;
  const o = ORDERS[r.id];
  const row = (date, txn, desc, amount, fee, net, payout, status, cat, source, tax) => ({ date, txn, desc, amount, fee, tax:tax || 0, net, payout, status, cat, source });
  const taxOf = fee => round2(fee * 0.0286);
  const charge = x => { const tax = taxOf(x[3]); const d = x[0].slice(1); return row(x[1], 'txn_' + d, 'Charge', x[2], -x[3], round2(x[2] - x[3] - tax), x[4], x[4] ? 'available' : 'pending', 'charge', 'ch_' + d, -tax); };
  if (kind === 'charge') return o.map(charge);
  if (kind === 'activity') return [charge(o[0]), eventRows(r, 'refund')[0], eventRows(r, 'fee')[0], eventRows(r, 'tax')[0]];
  if (kind === 'refund') {
    if (r.id === 'paypal_cad') return [row('Sep 6', 'txn_48166r', 'Refund for charge', -120, 0, -120, 'po_Ca02', 'available', 'refund', 're_48166')];
    return o.filter(x => x[4] && !['#48733','#48921'].includes(x[0])).slice(0, 2).map(x => { const d = x[0].slice(1); const date = laterDate(x[1]); return row(date, 'txn_' + d + 'r', 'Refund for charge', -x[2], 0, -x[2], firstPayoutAfter(r.id, Number(date.replace('Sep ', ''))), 'available', 'refund', 're_' + d); });
  }
  if (kind === 'fee') return o.map(x => { const d = x[0].slice(1); return row(x[1], 'txn_' + d + 'f', 'Processing fee', -x[3], 0, -x[3], x[4], x[4] ? 'available' : 'pending', 'fee', 'ch_' + d); });
  if (kind === 'tax') return o.map(x => { const d = x[0].slice(1); const t = taxOf(x[3]); return row(x[1], 'txn_' + d + 't', 'Tax on fee', -t, 0, -t, x[4], x[4] ? 'available' : 'pending', 'tax', 'ch_' + d); });
  return PAYOUTS[r.id].map(p => row(p[1], 'txn_' + p[0].replace('po_', '') + 'p', 'Payout', -p[2], 0, -p[2], p[0], 'paid', 'payout', p[0]));
}
function kindTotal(r, kind) { return { activity:r.net, charge:r.gross, refund:-r.refunds, fee:-r.fees, tax:-r.tax, payout:-r.payouts }[kind]; }
function kindCount(r, kind) { return { activity:r.n.charge + r.n.refund + r.n.fee + r.n.fee, charge:r.n.charge, refund:r.n.refund, fee:r.n.fee, tax:r.n.fee, payout:r.n.payout }[kind]; }
function signedMoney(v, cur) { return (v < 0 ? MINUS : '') + money(v, cur); }
function sourceHtml(r, ev) {
  const cents = v => String(Math.round(v * 100));
  const pairs = [
    ['raw_schema', SCHEMA[r.id]], ['raw_table', 'balance_transactions'], ['raw_pk', ev.txn], ['reporting_category', ev.cat],
    ['amount / net', cents(ev.amount) + ' / ' + cents(ev.net)], ['source', ev.source],
    ['created', '2026-09-' + ev.date.replace('Sep ', '').padStart(2, '0') + 'T' + String(8 + Number(ev.txn.replace(/\D/g, '') || 3) % 12).padStart(2, '0') + ':' + String(Number(ev.txn.replace(/\D/g, '') || 3) % 60).padStart(2, '0') + ':11Z'],
  ];
  return `<div class="pm-source"><div class="pm-source__head"><span>Source row</span><span style="display:inline-flex;align-items:center;gap:8px;"><span class="form-helper" style="margin:0;">Sample data</span><button type="button" class="btn btn-neutral btn-xs" id="srcCopy">Copy</button></span></div><dl>${pairs.map(p => `<dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd>`).join('')}</dl></div>`;
}
function openDrawer(id, kind, pickTxn) {
  const r = rail(id), cur = r.cur;
  const rows = eventRows(r, kind);
  const total = kindTotal(r, kind);
  const n = kindCount(r, kind);
  overlayOpenedAt = Date.now();
  if (!document.getElementById('modalBackdrop')) {
    returnFocus = document.activeElement;
    lockPage();
    const origin = lastClickTarget && lastClickTarget.closest ? lastClickTarget.closest('.pm-kv, .pm-brow') : null;
    if (origin) origin.classList.add('is-drilled');
    document.addEventListener('keydown', drawerKeys);
  }
  const num = ['Amount','Fee','Tax','Net'];
  const withTax = kind === 'charge' || kind === 'activity';
  const cols = ['Date','Transaction','Description','Amount','Fee'].concat(withTax ? ['Tax'] : []).concat(['Net','Payout','Status']);
  const head = cols.map(c => `<th scope="col" class="iris-th" style="${num.includes(c) ? 'text-align:right;' : ''}${c === 'Payout' ? 'padding-left:24px;' : ''}">${c}</th>`).join('');
  const body = rows.map((ev, i) => `<tr class="pm-drawer__row" data-src="${i}">
      <td style="${TD}"><button type="button" class="pm-amount" data-src-btn="${i}">${esc(ev.date)}</button></td>
      <td style="${TD}">${esc(ev.txn)}</td><td style="${TD}">${esc(ev.desc)}</td>
      <td style="${TD}text-align:right;font-variant-numeric:tabular-nums;">${signedMoney(ev.amount, cur)}</td>
      <td style="${TD}text-align:right;font-variant-numeric:tabular-nums;">${signedMoney(ev.fee, cur)}</td>${withTax ? `<td style="${TD}text-align:right;font-variant-numeric:tabular-nums;">${signedMoney(ev.tax, cur)}</td>` : ''}
      <td style="${TD}text-align:right;font-variant-numeric:tabular-nums;">${signedMoney(ev.net, cur)}</td>
      <td style="${TD}padding-left:24px;">${ev.payout ? (kind === 'payout' ? esc(ev.payout) : `<button type="button" class="pm-plink" data-payout="${esc(ev.payout)}">${esc(ev.payout)}</button>`) : '–'}</td>
      <td style="${TD}">${esc(ev.status)}</td></tr>`).join('');
  const noun = n === 1 ? NOUNS[kind].replace(/s$/, '') : NOUNS[kind];
  const showing = rows.length === n ? `Showing ${n} ${noun}` : `Showing ${rows.length} of ${n.toLocaleString('en-US')} ${NOUNS[kind]}`;
  const countText = kind === 'activity' || kind === 'tax' ? '' : ` <span class="pm-drawer__count">(${n.toLocaleString('en-US')})</span>`;
  document.getElementById('modalHost').innerHTML = `<div class="pm-drawer-backdrop" id="modalBackdrop"><aside role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="pm-drawer">
    <div class="pm-drawer__head"><div class="pm-drawer__title"><h2 class="modal-title" id="modalTitle" style="margin:0;">${esc(KINDS[kind])}${countText} ${signedMoney(total, cur)}</h2><span class="pm-drawer__meta">${esc(r.name)} · ${cur || 'USD'} · Sep 2026</span></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0;"><button type="button" class="btn btn-neutral btn-sm" id="ordExport">${ICON_DOWNLOAD}Export CSV</button><button type="button" class="modal-close" id="modalClose" aria-label="Close panel"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/></svg></button></div></div>
    <div class="pm-drawer__body"><div class="pm-frame"><table style="width:100%;border-collapse:collapse;"><caption style="${SR}">${esc(KINDS[kind])} in ${esc(r.name)}</caption><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="form-helper" style="margin:8px 0 16px;">${esc(showing)}</p><div id="sourceSlot" role="status"></div></div>
  </aside></div>`;
  const pick = i => { document.querySelectorAll('.pm-drawer__row').forEach(tr => { const on = tr.dataset.src === String(i); tr.classList.toggle('is-selected', on); tr.querySelector('[data-src-btn]').setAttribute('aria-pressed', on); }); document.getElementById('sourceSlot').innerHTML = sourceHtml(r, rows[i]); };
  document.querySelector('.pm-drawer__body').addEventListener('click', ev => {
    if (ev.target.closest('#srcCopy')) { const text = [...document.querySelectorAll('.pm-source dt')].map(d => d.textContent + ': ' + d.nextElementSibling.textContent).join('\n'); if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Source row copied.'), () => toast('Could not copy.')); else toast('Could not copy.'); return; }
    const p = ev.target.closest('[data-payout]');
    if (p) { openDrawer(id, 'payout', p.dataset.payout); return; }
    const tr = ev.target.closest('.pm-drawer__row'); if (tr) pick(+tr.dataset.src);
  });
  const start = pickTxn ? Math.max(0, rows.findIndex(x => x.payout === pickTxn)) : 0;
  pick(start);
  document.getElementById('modalClose').onclick = closeDrawer;
  document.getElementById('ordExport').onclick = ev => { if (ev.detail > 1) return; downloadCsv('balance-' + r.id + '-' + kind + '-2026-09.csv', [cols.concat('Currency')].concat(rows.map(x => [isoDate(x.date), x.txn, x.desc, x.amount.toFixed(2), x.fee.toFixed(2)].concat(withTax ? [x.tax.toFixed(2)] : []).concat([x.net.toFixed(2), x.payout || '', x.status, cur || 'USD'])))); toast('CSV exported.'); };
  document.getElementById('modalBackdrop').addEventListener('mousedown', ev => { if (ev.target.id === 'modalBackdrop') { ev.preventDefault(); if (ev.detail < 2) closeDrawer(); } });
  document.getElementById('modalClose').focus();
  placeToast();
}
function isoDate(d) { return '2026-09-' + d.replace('Sep ', '').padStart(2, '0'); }
function downloadCsv(name, rows) {
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function exportPage() {
  if (S.tab === 'all') {
    const rows = [['Rail','Currency','Starting','Activity','Payouts','Ending','Processor']];
    RAILS.filter(r => S.cur === 'all' || (r.cur || 'USD') === S.cur).forEach(r => rows.push([r.name, r.cur || 'USD', r.start.toFixed(2), r.net.toFixed(2), (-r.payouts).toFixed(2), r.end.toFixed(2), 'Tied']));
    ['USD','CAD'].filter(c => S.cur === 'all' || S.cur === c).forEach(c => { const list = RAILS.filter(r => (r.cur || 'USD') === c); const sum = f => round2(list.reduce((n, r) => n + f(r), 0)).toFixed(2); rows.push(['Total ' + c, c, sum(r => r.start), sum(r => r.net), sum(r => -r.payouts), sum(r => r.end), '']); });
    downloadCsv('balance-all-2026-09.csv', rows);
  } else {
    const r = curRail(), c = r.cur || 'USD';
    downloadCsv('balance-' + r.id + '-2026-09.csv', [['Section','Line','Count','Amount','Currency'],
      ['Summary','Starting balance','',r.start.toFixed(2),c],['Summary','Net balance change from activity','',r.net.toFixed(2),c],['Summary','Total payouts',r.n.payout,(-r.payouts).toFixed(2),c],['Summary','Ending balance','',r.end.toFixed(2),c],
      ['Activity','Charges',r.n.charge,r.gross.toFixed(2),c],['Activity','Refunds',r.n.refund,(-r.refunds).toFixed(2),c],['Activity','Disputes',r.n.dispute,'0.00',c],['Activity','Fees',r.n.fee,(-r.fees).toFixed(2),c],['Activity','Tax','',(-r.tax).toFixed(2),c],['Activity','Net balance change from activity','',r.net.toFixed(2),c],
      ['Payouts','Payouts',r.n.payout,r.payouts.toFixed(2),c],['Payouts','Total paid out','',r.payouts.toFixed(2),c]]);
  }
  toast('CSV exported.');
}

/* ---------- Events ---------- */
function hashFor() { return '#' + (S.tab === 'paypal' && S.rowCur === 'CAD' ? 'paypal-cad' : S.tab); }
function setTab(tab, cur) {
  const keep = tab === S.tab ? S.rowCur : S.tab === 'all' && S.cur !== 'all' ? S.cur : 'USD';
  S.tab = tab;
  S.rowCur = cur || keep;
  if (location.hash !== hashFor()) history.pushState(null, '', hashFor());
  render();
}
window.addEventListener('popstate', () => { const had = !!document.getElementById('modalBackdrop'); if (had) { returnFocus = null; closeDrawer(); } readHash(); render(); if (had) { const b = document.querySelector('[data-key="tab:' + S.tab + '"]'); if (b) b.focus(); } });
document.addEventListener('mousedown', () => document.documentElement.classList.add('pm-pointer'), true);
document.addEventListener('keydown', () => document.documentElement.classList.remove('pm-pointer'), true);
const secondClick = e => e.detail > 1 && Date.now() - Math.max(overlayClosedAt, overlayOpenedAt) < 500;
document.addEventListener('mousedown', e => { if (secondClick(e)) e.preventDefault(); }, true);
document.addEventListener('click', e => { lastClickTarget = e.target; if (secondClick(e)) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('click', e => {
  if (e.target.closest('.pm-section-nav [aria-current="page"]')) { e.preventDefault(); return; }
  if (e.target.closest('#toJournal')) { try { sessionStorage.setItem('pm-balance-hash', location.hash); } catch (err) { /* nothing to keep */ } return; }
  const t = e.target.closest('button');
  if (!t) {
    if (String(window.getSelection())) return;
    if (e.detail > 1) { clearTimeout(rowTimer); return; }
    const kv = e.target.closest('.pm-kv[data-kv]');
    if (kv) { const k = kv.querySelector('[data-open]').dataset.open; clearTimeout(rowTimer); rowTimer = setTimeout(() => { if (!String(window.getSelection())) { const [id, kind] = k.split(':'); returnFocus = null; openDrawer(id, kind); } }, 220); return; }
    const r = e.target.closest('[data-rail-row]');
    if (!r) return;
    const tab = r.dataset.railRow, cur = r.dataset.railCur;
    clearTimeout(rowTimer);
    rowTimer = setTimeout(() => { if (!String(window.getSelection())) setTab(tab, cur); }, 220);
    return;
  }
  clearTimeout(rowTimer);
  if (t.dataset.tab) { if (e.detail > 1) return; setTab(t.dataset.tab, t.dataset.cur); if (t.classList.contains('pm-blink')) { const b = document.querySelector('[data-key="tab:' + t.dataset.tab + '"]'); if (b) b.focus(); } return; }
  if (t.dataset.open) { const [id, kind] = t.dataset.open.split(':'); openDrawer(id, kind); return; }
  if (t.id === 'exportPage') { if (e.detail > 1) return; exportPage(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'curSelect') { if (S.tab === 'all') S.cur = e.target.value; else { S.rowCur = e.target.value; history.replaceState(null, '', hashFor()); } render(); }
  if (e.target.id === 'monthSelect') { S.month = e.target.value; render(); }
});
/* This prototype is the Accounting section only: other rail items stay inert. */
document.querySelectorAll('.pm-rail__item[title="Settings"], .pm-rail__item[title="Connections"]').forEach(b => { b.onclick = null; b.setAttribute('tabindex', '-1'); b.setAttribute('aria-disabled', 'true'); });
render();
</script>
