  if (open) return off('Decide ' + plural(open, 'item', 'items') + ' to post');
  const unbalanced = S.entries.filter(e => { const t = totals(e); return t.dr !== t.cr; }).length;
  if (unbalanced) return off(plural(unbalanced, 'entry', 'entries') + ' out of balance');
  if (!left) { const back = S.entries.filter(e => postState(e) === 'reversed').length; return `<span class="pm-phase">${back ? plural(back, 'entry', 'entries') + ' reversed' : 'Posted to ' + LEDGER}</span>`; }
  return `<span class="pm-phase" id="postNote">${S.posted ? plural(left, 'entry', 'entries') + ' not posted' : 'To ' + LEDGER}</span><button type="button" class="btn btn-primary btn-sm" id="postBtn" aria-describedby="postNote" data-key="postBtn">Post</button>`;
}
function balanceHash() { try { return sessionStorage.getItem('pm-balance-hash') || ''; } catch (err) { return ''; } }
function exportChip() {
  if (!S.exported) return '';
  return S.exported === JSON.stringify([S.entries, S.resolved, S.posted]) ? '<span class="badge badge-gray badge-sm">Exported</span>' : '<span class="badge badge-yellow badge-sm">Changed since export</span>';
}
function render() {
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  document.getElementById('app').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;">
      <div><h1 style="margin:0 0 4px;font-size:20px;line-height:30px;font-weight:600;color:#111928;">Accounting</h1><p style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:0 0 16px;font-size:14px;line-height:21px;color:#374151;">Sep 2026 <span class="badge badge-gray badge-sm">${pageChip()}</span><span class="badge badge-gray badge-sm">Sample data</span></p></div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">${postControl()}<button type="button" class="btn btn-neutral btn-sm" id="exportCsv" data-key="exportCsv">${ICON_DOWNLOAD}Export CSV</button></div>
    </div>
    <nav class="iris-tab-bar pm-section-nav" aria-label="Accounting"><a class="iris-tab" href="balance.html${location.search}${balanceHash()}" id="toBalance">Balance</a><a class="iris-tab iris-tab--active" aria-current="page" href="journal-entries.html">Journal entries</a></nav>
    ${attentionHtml()}
    <div class="pm-sec-head"><h2 id="entTitle">${S.posted ? 'Entries' : 'Proposed entries'}</h2>${exportChip()}</div>
    ${currencyCard(undefined, true)}${currencyCard('CAD', false)}`;
  if (active) { const el = document.querySelector(`[data-key="${CSS.escape(active)}"]`); if (el) el.focus(); }
}
function downloadCsv(name, rows) {
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function postModal() {
  const list = unposted();
  const row = e => `<tr><td style="${TD}">${esc(e.name)}${e.cur ? ' ' + e.cur : ''}</td><td style="${TD}">${statusHtml(e)}${postState(e) === 'failed' && e.start !== undefined && !isTied(e) ? ' <span class="badge badge-yellow badge-sm">Not tied</span>' : ''}${ORDERS_OFF[e.id] ? ` <span class="badge badge-yellow badge-sm">Orders off by ${money(ORDERS_OFF[e.id])}</span>` : ''}</td><td style="${TD}text-align:right;font-variant-numeric:tabular-nums;">${money(totals(e).dr, e.cur)}</td></tr>`;
  const total = cur => { const part = list.filter(e => e.cur === cur); return part.length ? `<tr class="pm-lines__total"><td style="${TD}font-weight:600;">Total ${cur || 'USD'}</td><td style="${TD}"></td><td style="${TD}text-align:right;font-weight:600;font-variant-numeric:tabular-nums;">${money(Math.round(part.reduce((n, e) => n + totals(e).dr, 0) * 100) / 100, cur)}</td></tr>` : ''; };
  const body = `<p style="margin:0 0 16px;font-size:14px;line-height:20px;color:#374151;">To ${LEDGER}, dated Sep 30, 2026.</p>
    <table style="width:100%;border-collapse:collapse;"><caption style="${SR}">Entries to post</caption><thead><tr><th scope="col" class="iris-th">Entry</th><th scope="col" class="iris-th">Status</th><th scope="col" class="iris-th" style="text-align:right;">Total debits</th></tr></thead><tbody>${list.filter(e => !e.cur).map(row).join('')}${total(undefined)}${list.filter(e => e.cur).map(row).join('')}${total('CAD')}</tbody></table>`;
  openModal('Post ' + plural(list.length, 'entry', 'entries'), body, `<button type="button" class="btn btn-alternative btn-md" id="postCancel">Cancel</button><button type="button" class="btn btn-primary btn-md" id="postConfirm">Post ${plural(list.length, 'entry', 'entries')}</button>`);
  document.getElementById('postCancel').onclick = closeModal;
  document.getElementById('postConfirm').onclick = ev => {
    if (posting || ev.detail > 1) return;
    posting = true;
    const btn = ev.currentTarget, total = list.length;
    btn.disabled = true;
    btn.style.minWidth = btn.offsetWidth + 'px';
    document.getElementById('postCancel').disabled = true;
    document.getElementById('modalClose').style.visibility = 'hidden';
    const guard = e => { e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', guard);
    let done = 0;
    btn.textContent = 'Posting 1 of ' + total;
    const tick = setInterval(() => {
      done += 1;
      if (done < total) { btn.textContent = 'Posting ' + (done + 1) + ' of ' + total; return; }
      clearInterval(tick);
      window.removeEventListener('beforeunload', guard);
      posting = false;
      S.posted = S.posted || {};
      list.forEach(e => { S.posted[e.id] = 'posted'; });
      const failed = FAIL_ONCE && !S.failedOnce ? list.find(e => e.id === 'amazon') : null;
      if (failed) { S.posted[failed.id] = 'failed'; S.failedOnce = true; S.open[failed.id] = true; }
      S.hideDecisions = true;
      returnFocus = null;
      closeModal();
      render();
      const count = total - (failed ? 1 : 0);
      toast(plural(count, 'entry', 'entries') + ' posted to ' + LEDGER + '.' + (failed ? ' 1 failed.' : ''));
      const h = document.querySelector('#app h1');
      h.setAttribute('tabindex', '-1');
      h.focus({ preventScroll:true });
    }, 160);
  };
}
function reverseModal(id) {
  const e = entry(id);
  openModal('Reverse ' + e.name + (e.cur ? ' ' + e.cur : '') + ' entry', `<p style="margin:0;font-size:14px;line-height:20px;color:#374151;">Posts a mirror entry of ${money(totals(e).dr, e.cur)} to ${LEDGER}, dated Sep 30, 2026.</p>`, `<button type="button" class="btn btn-alternative btn-md" id="revCancel" data-autofocus>Cancel</button><button type="button" class="btn btn-md pm-danger-solid" id="revConfirm">Reverse entry</button>`);
  document.getElementById('revCancel').onclick = closeModal;
  document.getElementById('revConfirm').onclick = () => {
    const mirror = { id:id + '_rev', name:e.name + ', reversal', cur:e.cur, orders:0, reversalOf:id, memo:'Reversal of ' + extId(e), lines:e.lines.map(l => ({ id:'r_' + l.id, dr:l.cr, cr:l.dr, account:l.account, rec:l.account, bucket:l.bucket })) };
    S.entries.splice(S.entries.indexOf(e) + 1, 0, mirror);
    S.posted[id] = 'reversed';
    S.posted[mirror.id] = 'posted';
    S.open[mirror.id] = true;
    returnFocus = null;
    closeModal();
    render();
    const scrollToMirror = () => { const b = document.querySelector('[data-entry-toggle="' + mirror.id + '"]'); if (b) { b.scrollIntoView({ block:'center' }); b.focus({ preventScroll:true }); } };
    toast(e.name + (e.cur ? ' ' + e.cur : '') + ' reversed.', null, () => { overlayClosedAt = Date.now(); S.open[mirror.id] = true; render(); scrollToMirror(); });
    const f = document.querySelector('[data-entry-toggle="' + mirror.id + '"]');
    if (f) f.focus({ preventScroll:true });
  };
}
function exportCsv() {
  const rows = [['date','account','line','debit','credit','currency','memo','entry_id','status','check','external_id']];
  S.entries.forEach(e => { const status = postState(e) || 'draft', check = e.reversalOf ? '' : checkOf(e).word.toLowerCase(); e.lines.forEach(l => rows.push(['2026-09-30', l.account, l.bucket, l.dr !== undefined ? l.dr.toFixed(2) : '', l.cr !== undefined ? l.cr.toFixed(2) : '', e.cur || 'USD', e.memo, '2026-09-' + e.id, status, check, postState(e) === 'posted' || postState(e) === 'reversed' ? extId(e) : ''])); });
  downloadCsv('journal-entries-2026-09.csv', rows);
  S.exported = JSON.stringify([S.entries, S.resolved, S.posted]);
  render();
  const open = openIssues().length;
  const off = S.entries.filter(e => e.start !== undefined && !isTied(e)).length;
  const notes = [];
  if (open) notes.push(open + (open === 1 ? ' item' : ' items') + ' not decided');
  if (off) notes.push(off + (off === 1 ? ' entry' : ' entries') + ' not tied');
  toast('CSV exported.' + (notes.length ? ' ' + notes.join(', ') + '.' : ''));
}

/* A mouse user sees no keyboard ring, also on controls focused by script after a row click. */
document.addEventListener('mousedown', () => document.documentElement.classList.add('pm-pointer'), true);
document.addEventListener('keydown', () => document.documentElement.classList.remove('pm-pointer'), true);
/* The second click of a double click must not land on what an overlay just opened over or uncovered. */
const secondClick = e => e.detail > 1 && Date.now() - Math.max(overlayClosedAt, overlayOpenedAt) < 500;
document.addEventListener('mousedown', e => { if (secondClick(e)) e.preventDefault(); }, true);
document.addEventListener('click', e => { lastClickTarget = e.target; if (secondClick(e)) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('click', e => {
  if (e.target.closest('.pm-section-nav [aria-current="page"]')) { e.preventDefault(); return; }
  if (e.target.closest('#toBalance')) return;
  const t = e.target.closest('button');
  if (!t) {
    /* A row waits for a possible second click, so a double click selects a word instead of opening anything. */
    if (String(window.getSelection())) return;
    if (e.detail > 1) { clearTimeout(rowTimer); return; }
    const a = S.posted || CLOSED ? null : e.target.closest('.pm-att__row');
    const r = e.target.closest('.pm-entry__row');
    if (!a && !r) return;
    const issueId = a ? a.dataset.row : null;
    const entryId = r ? r.querySelector('[data-entry-toggle]').dataset.entryToggle : null;
    clearTimeout(rowTimer);
    rowTimer = setTimeout(() => {
      if (String(window.getSelection())) return;
      if (issueId) { issueModal(issueId); returnFocus = document.querySelector('[data-issue-row="' + issueId + '"]'); }
      else { S.open[entryId] = !S.open[entryId]; render(); }
    }, 220);
    return;
  }
  clearTimeout(rowTimer);
  if (t.dataset.issue) return issueModal(t.dataset.issue);
  if (t.dataset.entryToggle) { if (e.detail > 1) return; S.open[t.dataset.entryToggle] = !S.open[t.dataset.entryToggle]; render(); return; }
  if (t.dataset.entryOpen) { overlayClosedAt = Date.now(); const id = t.dataset.entryOpen; S.open[id] = true; render(); const b = document.querySelector('[data-entry-toggle="' + id + '"]'); if (b) { b.focus({ preventScroll:true }); b.scrollIntoView({ block:'center' }); } return; }
  if (t.dataset.orders) return openDrawer(t.dataset.orders, t.dataset.orders === 'other' ? 'Payments' : 'Orders');
  if (t.dataset.lineOrders) { const [a, b] = t.dataset.lineOrders.split(':'); const l = line(entry(a), b); return openDrawer(a, l.bucket, (['ref','fee','tax','bnk','pay'].includes(b) ? '-' : '') + money(l.dr !== undefined ? l.dr : l.cr, entry(a).cur), l.bucket); }
  if (t.dataset.entryOrders) { const [a, b] = t.dataset.entryOrders.split(':'); const e = entry(a); return openDrawer(a, b, (b === 'Activity' ? money(netOf(e), e.cur) : '-' + money(payoutOf(e), e.cur)), b); }
  if (t.id === 'toggleDecisions') { if (e.detail > 1) return; S.hideDecisions = !S.hideDecisions; render(); return; }
  if (t.dataset.reset) { const [a, b] = t.dataset.reset.split(':'); const l = line(entry(a), b); const prev = l.account, prevKey = S.acct[a + ':' + b]; l.account = l.rec; delete S.acct[a + ':' + b]; if (a === 'deferred' && (b === 'dco' || b === 'cog')) recomputeDeferred(); syncMemos(); render(); const focusSel = () => { const f = document.querySelector('[data-key="acct:' + a + ':' + b + '"]') || document.querySelector('[data-key="toggle:' + a + '"]'); if (f) f.focus({ preventScroll:true }); }; toast('Back to ' + l.rec + '.', () => { line(entry(a), b).account = prev; if (prevKey !== undefined) S.acct[a + ':' + b] = prevKey; if (a === 'deferred' && (b === 'dco' || b === 'cog')) recomputeDeferred(); syncMemos(); render(); toast('Change undone.'); focusSel(); }); focusSel(); if (e.detail === 0) { const u = document.getElementById('toastUndo'); if (u) u.focus(); } return; }
  if (t.id === 'exportCsv') { if (e.detail > 1) return; return exportCsv(); }
  if (t.id === 'srcCopy') { const text = [...document.querySelectorAll('.pm-source dt')].map(d => d.textContent + ': ' + d.nextElementSibling.textContent).join('\n'); if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Source row copied.'), () => toast('Could not copy.')); else toast('Could not copy.'); return; }
  if (t.dataset.reverse) { if (e.detail > 1) return; return reverseModal(t.dataset.reverse); }
  if (t.dataset.postRetry !== undefined) return postModal();
  if (t.id === 'postBtn') { if (e.detail > 1) return; if (t.getAttribute('aria-disabled') === 'true') { const note = document.getElementById('postNote'); return toast(note.textContent + '.'); } return postModal(); }
});
document.addEventListener('change', e => {
  const s = e.target;
  if (s.dataset && s.dataset.entry) {
    const l = line(entry(s.dataset.entry), s.dataset.line);
    const previous = l.account;
    const key = s.dataset.key;
    const entryId = s.dataset.entry, lineId = s.dataset.line;
    const remember = v => { const k = entryId + ':' + lineId; const cur = line(entry(entryId), lineId); if (!cur) return; cur.account = v; if (v === cur.rec) delete S.acct[k]; else S.acct[k] = v; if (entryId === 'deferred' && (lineId === 'dco' || lineId === 'cog')) recomputeDeferred(); syncMemos(); };
    remember(s.value);
    render();
    toast(l.bucket + ' now in ' + s.value + '.', () => { remember(previous); render(); toast('Change undone.'); const f = document.querySelector('[data-key="' + key + '"]') || document.querySelector('[data-key="toggle:' + entryId + '"]'); if (f) f.focus(); });
  }
});
/* This prototype is the Journal entries page only: other rail items stay inert, so nobody leaves and loses the decisions. */
document.querySelectorAll('.pm-rail__item[title="Settings"], .pm-rail__item[title="Connections"]').forEach(b => { b.onclick = null; b.setAttribute('tabindex', '-1'); b.setAttribute('aria-disabled', 'true'); });
render();
</script>
