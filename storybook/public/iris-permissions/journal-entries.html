  <style>
    /* Journal entries only: what the visual system has no class for, on its tokens. */
    /* Keyboard focus stops under the pinned head, not behind it. */
    @media (min-height:701px) { html { scroll-padding-top:116px; } }
    /* A row button in a card head keeps the head at 44. A card with no table closes at 12. */
    .ac-card__head .ac-btn-row { margin:-2px 0; }
    .ac-card--closed .ac-card__head { padding-bottom:12px; }
    .ac-head .ac-select { flex:none; }
    /* A clear button has no box to align: its text sits on the right edge, its fill reaches the row band. */
    body.ac .ac-btn-row.ac-btn-flush, body.ac .ac-cell-actions > div > .ac-btn-row:last-child:not(.btn-neutral) { padding:0 7px; margin-right:-8px; }
    /* The note keeps Export CSV still while items get decided. */
    .ac-actions #postNote:has(+ #postBtn) { min-width:152px; text-align:right; }
    @media (max-width:1279px) { .ac-actions #postNote { white-space:normal; line-height:16px; text-align:right; } }
    /* Name cell: a chip with no room wraps to a clipped second line instead of being cut. The padding keeps the toggle's focus ring. */
    .ac-name--fit { container-type:inline-size; flex-wrap:wrap; height:30px; box-sizing:border-box; padding:4px 0 4px 4px; margin:-4px 0 -4px -4px; row-gap:8px; overflow:hidden; }
    /* A rail's warning keeps the line. With no room for everything, the word reserve gives way first. */
    @container (max-width:303px) {
      .ac-yield { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
      .ac-yield-chip { display:none; }
    }
    @container (max-width:375px) { .ac-yield:has(~ .ac-chip--wait) { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); } }
    /* Status cell: a rail mismatch beside the status word, the word alone when there is no room. */
    .ac-pair { display:inline-flex; align-items:center; justify-content:flex-end; gap:8px; vertical-align:middle; }
    @media (max-width:1619px) {
      .ac-pair > :first-child { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); }
    }
    /* Open entry: account text sits under its head in both states, facts on one line, buttons at the right edge. */
    .ac-table .ac-child--head th.ac-acct-head { padding-left:calc(var(--ac-gut) + 13px); }
    .ac-acct { display:flex; align-items:center; gap:8px; min-width:0; }
    body.ac .ac-acct .ac-select--row { flex:0 1 320px; width:auto; min-width:0; }
    .ac-acct .btn { flex:none; }
    .ac-facts { display:flex; align-items:center; gap:16px; }
    @media (min-width:1280px) { .ac-only-narrow { display:none; } }
    @media (max-width:1279px) { .ac-only-wide { display:none; } }
    .ac-table td.ac-child-note { white-space:normal; }
    /* Under 1280 a long amount or status word keeps the column's full width: the numbers are right aligned, the gutter stays empty anyway. */
    @media (max-width:1279px) { .ac-table .ac-child td.ac-num, .ac-table tbody td.ac-right { padding-left:0; } }
    .ac-table td.ac-cell-actions { overflow:visible; }
    .ac-cell-actions > div { display:flex; justify-content:flex-end; gap:8px; }
    .ac-btn-text { padding:0; height:auto; min-height:0; font:inherit; letter-spacing:inherit; }
    /* The row behind a panel stays selected inside an open entry too. */
    .ac-table .ac-child.ac-row--sel td, .ac-table .ac-child.ac-row--sel th, .ac-table .ac-row--open.ac-row--sel td, .ac-table .ac-row--open.ac-row--sel th, .ac-table .ac-row--open.ac-row--sel:hover td, .ac-table .ac-row--open.ac-row--sel:hover th { background:var(--ac-sel); }
    /* A row header keeps the corners of the cell it replaced. */
    .ac-table .ac-row--open th:first-child { border-top-left-radius:6px; }
    .ac-table .ac-child--last th:first-child { border-bottom-left-radius:6px; }
    /* Panels and dialogs show tables of different columns. */
    .ac-table--fit { table-layout:auto; }
    .ac-lead { margin:0 0 16px; }
    .ac-lead--chip { display:flex; margin-top:-8px; }
    .ac-showing { margin:8px 0 16px; white-space:normal; }
    .ac-panel__body > .ac-note { margin:0; }
    .ac-hint { display:block; font-weight:400; color:var(--ac-2); }
    body.ac #postConfirm:disabled { cursor:progress; }
    /* accounting.css leaves this h2 at the browser's size. */
    .ac-empty__title { font-size:14px; line-height:20px; }
    /* A warning that leads somewhere, as on Balance. */
    a.ac-chip { text-decoration:underline solid var(--ac-ul) 1px; text-underline-offset:3px; }
    a.ac-chip:hover { color:var(--ac-pri); text-decoration-color:currentColor; }
    a.ac-chip:active { color:var(--ac-pri-d); text-decoration-color:currentColor; }
    /* The panel's column fits the chip exactly: the cell does not clip its focus ring. */
    .ac-table--panel tbody th:has(a.ac-chip) { overflow:visible; }
  </style>
</head>

  if (t.dataset.reset) { const [a, b] = t.dataset.reset.split(':'); const l = line(entry(a), b); const prev = l.account, prevKey = S.acct[a + ':' + b]; l.account = l.rec; delete S.acct[a + ':' + b]; if (a === 'deferred' && (b === 'dco' || b === 'cog')) recomputeDeferred(); syncMemos(); render(); const focusSel = () => focusNext(document.querySelector('[data-key="acct:' + a + ':' + b + '"]') || document.querySelector('[data-key="toggle:' + a + '"]'), { preventScroll:true }); toast('Back to ' + l.rec + '.', () => { line(entry(a), b).account = prev; if (prevKey !== undefined) S.acct[a + ':' + b] = prevKey; if (a === 'deferred' && (b === 'dco' || b === 'cog')) recomputeDeferred(); syncMemos(); render(); toast('Change undone.'); focusSel(); }); focusSel(); if (e.detail === 0) AC.focusAfterAction(document.getElementById('toastUndo')); return; }
  if (t.id === 'exportCsv') { if (e.detail > 1) return; return exportCsv(); }
  if (t.id === 'reconnect') { S.ledgerFixed = true; render(); toast(LEDGER + ' reconnected.'); AC.focusAfterAction(document.getElementById('postBtn')); return; }
  if (t.dataset.copySource !== undefined) { const text = [...document.querySelectorAll('.ac-source dt')].map(d => d.textContent + ': ' + d.nextElementSibling.textContent).join('\n'); if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Source row copied.'), () => toast('Could not copy.')); else toast('Could not copy.'); return; }
  if (t.dataset.reverse) { if (e.detail > 1) return; return reverseModal(t.dataset.reverse); }
  if (t.dataset.postRetry !== undefined) return postModal();
  if (t.id === 'postBtn') { if (e.detail > 1) return; if (t.getAttribute('aria-disabled') === 'true') { const note = document.getElementById('postNote'); return toast(note.textContent + '.'); } return postModal(); }
});
document.addEventListener('click', e => {
  const again = e.target.closest('[data-recorrect]');
  if (again) {
    const x = entry(again.dataset.recorrect), base = baseId(x);
    const fresh = correctedOf(x, base, S.entries.filter(y => baseId(y) === base && !y.reversalOf).length + 1);
    const mirror = S.entries.find(y => y.reversalOf === x.id);
    S.entries.splice(S.entries.indexOf(mirror || x) + 1, 0, fresh);
    S.open[fresh.id] = true;
    render();
    const toggle = document.querySelector('[data-entry-toggle="' + fresh.id + '"]');
    if (toggle) { toggle.scrollIntoView({ block:'center' }); toggle.focus({ preventScroll:true }); }
    return;
  }
  const d = e.target.closest('[data-discard]');
  if (!d) return;
  const x = entry(d.dataset.discard), at = S.entries.indexOf(x);
  S.entries.splice(at, 1);
  delete S.open[x.id];
  render();
  toast('Corrected ' + (x.baseName || x.name) + (x.cur ? ' ' + x.cur : '') + ' entry discarded.', () => { S.entries.splice(at, 0, x); S.open[x.id] = true; render(); toast('Discard undone.'); });
});
document.addEventListener('change', e => {
  const s = e.target;
  if (s.id === 'monthSelect') { AC.setMonth(s.value); render(); return; }
  if (s.dataset && s.dataset.entry) {
    const l = line(entry(s.dataset.entry), s.dataset.line);
    const previous = l.account;
    const key = s.dataset.key;
    const entryId = s.dataset.entry, lineId = s.dataset.line;
    const remember = v => { const k = entryId + ':' + lineId; const cur = line(entry(entryId), lineId); if (!cur) return; cur.account = v; if (v === cur.rec) delete S.acct[k]; else S.acct[k] = v; if (entryId === 'deferred' && (lineId === 'dco' || lineId === 'cog')) recomputeDeferred(); syncMemos(); };
    remember(s.value);
    render();
    toast(l.bucket + ' now in ' + s.value + '.', () => { remember(previous); render(); toast('Change undone.'); focusNext(document.querySelector('[data-key="' + key + '"]') || document.querySelector('[data-key="toggle:' + entryId + '"]')); });
  }
});
/* A closed month has every entry posted. */
function seedClosed() {
  if (!isClosed() || (S.posted && !unposted().length)) return;
  S = initial();
  ISSUES.forEach(i => { S.resolved[i.id] = i.options[0].id; });
  if (entry('deferred')) recomputeDeferred();
  ISSUES.forEach(i => applyIssue(i, i.options[0].id));
  S.posted = {};
  S.entries.forEach(e => { S.posted[e.id] = 'posted'; });
}
seedClosed();
applyMapping();
/* This prototype is the Journal entries page only: other rail items stay inert, so nobody leaves and loses the decisions. */
document.querySelectorAll('.pm-rail__item[title="Settings"], .pm-rail__item[title="Connections"]').forEach(b => { b.onclick = null; b.setAttribute('tabindex', '-1'); b.setAttribute('aria-disabled', 'true'); });
render();
/* A link from another page can open one entry, journal-entries.html#entry-tiktok, or one decision, #decide-unmatched. */
function openFromHash() {
  const m = location.hash.match(/^#entry-(.+)$/);
  const decide = location.hash === '#decide-unmatched' && ISSUES.some(i => i.id === 'unmatched');
  if (!decide && !(m && entry(m[1]))) return;
  if (otherMonth()) AC.setMonth(AC.MONTH);
  if (decide) {
    /* The dialog opens once: Back and a reload do not bring it again. */
    history.replaceState(null, '', location.pathname + location.search);
    render();
    if (!readOnly() && !document.getElementById('modalBackdrop')) { issueModal('unmatched'); returnFocus = document.querySelector('[data-issue-row="unmatched"]'); }
    return;
  }
  S.open[m[1]] = true;
  render();
  const toggle = document.querySelector(`[data-entry-toggle="${CSS.escape(m[1])}"]`);
  if (toggle) { toggle.closest('tr').scrollIntoView({ block:'center' }); toggle.focus({ preventScroll:true }); }
}
window.addEventListener('hashchange', openFromHash);
/* Back from the browser's page cache: the state as it is now, no old toast or overlay, and a reload elsewhere stays a reset. */
window.addEventListener('pageshow', ev => {
  if (!ev.persisted) return;
  clearTimeout(toastTimer);
  document.getElementById('toastHost').innerHTML = '';
  const raw = AC.stateRaw();
  if (!raw) { location.reload(); return; }
  clearTimeout(lateTimer);
  if (posting) { clearInterval(postTick); window.removeEventListener('beforeunload', postGuard); posting = false; }
  if (document.getElementById('modalBackdrop')) { returnFocus = null; closeModal(); }
  try {
    Object.assign(AC.state, JSON.parse(raw));
    const kept = takeKept();
    if (!kept) S = initial();
    else if (kept.search === QUERY) S = kept.state;
    settleChecking();
  } catch (err) { /* keep what is on screen */ }
  seedClosed();
  applyMapping();
  render();
});
openFromHash();
</script>
