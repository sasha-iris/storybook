document.addEventListener('click', e => {

  const remember = v => { const k = entryId + ':' + lineId; const cur = line(entry(entryId), lineId); if (!cur) return; unapprove(entryId); cur.account = v; if (v === cur.rec) delete S.acct[k]; else S.acct[k] = v; if (entryId === 'deferred' && (lineId === 'dco' || lineId === 'cog')) recomputeDeferred(); syncMemos(); };

AC.rerender = () => render();
document.addEventListener('change', ev => {

/* A closed month has every entry posted. */
function seedClosed() {

  if ((!isClosed() && !carried) || (S.posted && !unposted().length)) return;
  S = initial();
  ISSUES.forEach(i => { S.resolved[i.id] = i.options[0].id; });
  if (entry('deferred')) recomputeDeferred();
  ISSUES.forEach(i => applyIssue(i, i.options[0].id));

applyMapping();
document.querySelectorAll('.pm-rail__item[title="Connections"]').forEach(b => { b.onclick = null; b.setAttribute('tabindex', '-1'); b.setAttribute('aria-disabled', 'true'); });
document.querySelectorAll('.pm-rail__item[title="Settings"]').forEach(b => { b.onclick = () => { location.href = AC.hrefOf('settings'); }; });
document.querySelectorAll('.pm-rail__item[title="Accounting"]').forEach(b => { b.onclick = () => { location.href = AC.hrefOf('overview'); }; });

/* A link from another page can open one entry, journal-entries.html#entry-tiktok, or one decision, #decide-unmatched. */
function openFromHash() {
