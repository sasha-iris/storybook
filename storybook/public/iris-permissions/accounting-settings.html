<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting-layout.css">
</head>
<body class="pm-journal ac ds" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Settings";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
(function () {
  const esc = AC.esc;
  const $ = id => document.getElementById(id);
  const FIELDS = ['debit', 'credit', 'from', 'to'];
  const RAILS = AC.RAILS.filter(r => !r.cur && AC.MAPPING.some(m => m.source === r.name));
  const railOf = m => RAILS.find(r => r.name === m.source);
  const rowsOf = r => AC.MAPPING.filter(m => m.source === r.name);
  const railFromHash = () => { const r = RAILS.find(x => x.id === location.hash.slice(1)) || RAILS[0]; return r ? r.id : ''; };
  let rail = railFromHash();
  let lastUnmapped = '';

  /* Dates live as the data writes them, "Jan 1, 2026". The calendar speaks ISO. */
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const toIso = s => { const x = /^([A-Z][a-z]{2}) (\d{1,2}), (\d{4})$/.exec(s || ''); return x ? x[3] + '-' + String(MONTHS.indexOf(x[1]) + 1).padStart(2, '0') + '-' + x[2].padStart(2, '0') : ''; };
  const fromIso = s => { const x = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return x ? MONTHS[Number(x[2]) - 1] + ' ' + Number(x[3]) + ', ' + x[1] : ''; };

  /* Saved values, the draft over them, and what a row says about itself. */
  const clone = o => JSON.parse(JSON.stringify(o));
  const draft = () => (AC.VIEW_ONLY ? {} : AC.state.mappingDraft || (AC.state.mappingDraft = {}));
  const saved = m => { const s = AC.mappingOf(m); return { debit:s.debit || '', credit:s.credit || '', from:s.from || '', to:s.to || '' }; };
  const shown = m => Object.assign(saved(m), draft()[AC.mappingKey(m)]);
  const hasChanges = () => AC.MAPPING.some(m => draft()[AC.mappingKey(m)]);
  const needsCredit = m => !AC.NET_BUCKETS.includes(m.bucket);
  const statusOf = m => {
    const s = shown(m), complete = s.debit && (s.credit || !needsCredit(m));
    if (!complete) return 'Not mapped';
    return draft()[AC.mappingKey(m)] ? 'Changed' : 'Mapped';
  };
  const STATUS = {
    Mapped:'<span class="ac-muted">Mapped</span>',
    Changed:'<span class="badge badge-gray badge-sm">Changed</span>',
    'Not mapped':'<span class="badge badge-yellow badge-sm">Not mapped</span>',
  };

  /* ---------- Drawing ---------- */
  const keyOf = m => AC.mappingKey(m);
  const accountCell = (m, field, s, label) => {
    if (AC.VIEW_ONLY) return AC.td(s[field] ? esc(s[field]) : '<span class="ac-muted">Not mapped</span>', {});
    return AC.td(AC.filterMenu({ name:keyOf(m) + '|' + field, label:m.bucket + ' ' + label, value:s[field], quiet:true, options:[['', 'Not mapped']].concat(AC.ACCOUNTS.map(a => [a, a])) }), {});
  };
  const dateCell = (m, field, s, label, cls) => {
    if (AC.VIEW_ONLY) return AC.td(s[field] ? esc(s[field]) : AC.none, { cls });
    return AC.td(`<div class="ac-menu-wrap"><button type="button" class="ac-cell-btn" data-date="${esc(keyOf(m))}|${field}" data-key="date:${esc(keyOf(m))}|${field}" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(m.bucket + ' ' + label + ', ' + (s[field] || 'not set'))}">${s[field] ? esc(s[field]) : AC.none}</button></div>`, { cls });
  };
  const rowHtml = m => {
    const s = shown(m);
    const creditCell = needsCredit(m) ? accountCell(m, 'credit', s, 'credit account') : AC.td(`<span class="ac-fixed-acct" title="Follows the Charges debit account">${esc((AC.mappingOf(AC.MAPPING.find(x => x.source === m.source && x.bucket === 'Charges')) || {}).debit || '')}</span>`, {});
    return `<tr data-map="${esc(keyOf(m))}">${AC.td(esc(m.bucket), { head:true })}${accountCell(m, 'debit', s, 'debit account')}${creditCell}${dateCell(m, 'from', s, 'effective from')}${dateCell(m, 'to', s, 'effective to', 'ac-wide')}${AC.td(STATUS[statusOf(m)], {})}</tr>`;
  };
  const railButton = r => {
    const n = AC.unmapped().filter(m => m.source === r.name).length;
    return `<button type="button" class="btn${r.id === rail ? ' active' : ''}" aria-pressed="${r.id === rail}" data-rail="${r.id}" data-key="seg-${r.id}">${esc(r.name)}${n ? `<span class="btn-group-stat-count">${n}<span class="ac-sr"> not mapped</span></span>` : ''}</button>`;
  };
  const tableCard = () => {
    const r = AC.rail(rail), on = hasChanges();
    const footer = AC.VIEW_ONLY ? '' : `<div class="card-footer ac-close-foot"><span></span><span class="ac-toolbar">${on ? '<button type="button" class="btn btn-neutral btn-sm" id="discardBtn" data-key="discardBtn">Discard changes</button>' : ''}<button type="button" class="btn ${on ? 'btn-primary' : 'btn-neutral'} btn-sm" id="saveBtn" data-key="saveBtn"${on ? '' : ' disabled'}>Save changes</button></span></div>`;
    return `<section class="card" aria-label="Account mapping">${AC.cardBar(`<div class="btn-group" role="group" aria-label="Rail">${RAILS.map(railButton).join('')}</div>`)}<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--map"><caption class="ac-sr">${esc(r.name)} account mapping</caption><colgroup><col style="width:160px"><col><col><col style="width:136px"><col class="ac-wide" style="width:136px"><col style="width:128px"></colgroup><thead><tr>${AC.th('Component')}${AC.th('Debit account')}${AC.th('Credit account')}${AC.th('Effective from')}${AC.th('Effective to', { cls:'ac-wide' })}${AC.th('Status')}</tr></thead><tbody>${rowsOf(r).map(rowHtml).join('')}</tbody></table></div>${footer}</section>`;
  };
  const ledgerCard = () => `<section class="card" aria-labelledby="orgTitle">${AC.cardTitle('orgTitle', 'Organization')}<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--kv"><caption class="ac-sr">Organization</caption><colgroup><col style="width:160px"><col></colgroup><tbody><tr>${AC.td('Ledger', { head:true })}${AC.td(`<span class="ac-name"><span>${esc(AC.LEDGER)}</span><span class="badge badge-green badge-sm">Connected</span></span>`, {})}</tr><tr>${AC.td('Timezone', { head:true })}${AC.td(esc(AC.TIMEZONE), {})}</tr></tbody></table></div></section>`;

  /* ---------- Editing ---------- */
  function edit(m, field, value) {
    const k = keyOf(m);
    const next = Object.assign(shown(m), { [field]:value }), base = saved(m);
    if (FIELDS.every(f => next[f] === base[f])) delete draft()[k]; else draft()[k] = next;
    AC.save();
    AC.rerender();
  }
  const mappingOfKey = k => AC.MAPPING.find(m => keyOf(m) === k);
  AC.onMenuPick = (name, value) => {
    const [k, field] = name.split('|');
    edit(mappingOfKey(k), field, value);
    const b = document.querySelector(`[data-key="${CSS.escape('menu:' + name)}"]`);
    if (b) b.focus();
  };

  /* ---------- Calendar from the library, one at a time ---------- */
  let cal = null;
  const DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  const pad = n => String(n).padStart(2, '0');
  const NAV = dir => `<svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"${dir < 0 ? ' style="transform:rotate(180deg)"' : ''}><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L11.17 10 7.23 6.29a.75.75 0 1 1 1.04-1.08l4.5 4.25a.75.75 0 0 1 0 1.08l-4.5 4.25a.75.75 0 0 1-1.06-.02Z" clip-rule="evenodd"/></svg>`;
  function calHtml() {
    const s = shown(cal.m), iso = toIso(s[cal.field]);
    const min = cal.field === 'to' ? toIso(s.from) : '', max = cal.field === 'from' ? toIso(s.to) : '';
    const lead = new Date(cal.y, cal.mo, 1).getDay(), days = new Date(cal.y, cal.mo + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < lead; i += 1) cells.push('<span></span>');
    for (let d = 1; d <= days; d += 1) {
      const id = `${cal.y}-${pad(cal.mo + 1)}-${pad(d)}`, off = (min && id < min) || (max && id > max);
      cells.push(`<button type="button" class="iris-cal__day${id === iso ? ' iris-cal__day--range-selected' : ''}${off ? ' iris-cal__day--disabled' : ''}" data-day="${id}"${off ? ' disabled' : ''}${id === iso ? ' aria-current="date"' : ''}>${d}</button>`);
    }
    const clear = cal.field === 'to' && s.to ? '<div class="iris-cal__footer"><button type="button" class="btn btn-neutral btn-sm" data-day="">Clear</button></div>' : '';
    return `<div class="iris-cal ac-cal" role="dialog" aria-label="Choose a date"><div class="iris-cal__header"><button type="button" class="iris-cal__nav" data-cal-nav="-1" aria-label="Previous month">${NAV(-1)}</button><div class="iris-cal__title">${MONTHS[cal.mo]} ${cal.y}</div><button type="button" class="iris-cal__nav" data-cal-nav="1" aria-label="Next month">${NAV(1)}</button></div><div class="iris-cal__grid">${DOW.map(d => `<span class="iris-cal__day-header">${d}</span>`).join('')}${cells.join('')}</div>${clear}</div>`;
  }
  function closeCal(refocus) {
    if (!cal) return;
    const btn = cal.btn;
    document.querySelectorAll('.ac-cal').forEach(el => el.remove());
    cal = null;
    if (btn && btn.isConnected) { btn.setAttribute('aria-expanded', 'false'); if (refocus) btn.focus(); }
  }
  function drawCal() {
    document.querySelectorAll('.ac-cal').forEach(el => el.remove());
    cal.btn.insertAdjacentHTML('afterend', calHtml());
  }
  function openCal(btn) {
    const [k, field] = btn.dataset.date.split('|');
    closeCal();
    const m = mappingOfKey(k), s = shown(m), base = toIso(s[field]) || toIso(s.from) || '2026-09-01';
    cal = { m, field, btn, y:Number(base.slice(0, 4)), mo:Number(base.slice(5, 7)) - 1 };
    btn.setAttribute('aria-expanded', 'true');
    drawCal();
  }

  /* ---------- Actions ---------- */
  function selectRail(id) {
    if (id === rail) return;
    rail = id;
    location.hash = id;
    AC.rerender();
  }
  /* Undo: the saved mapping and draft as they were. An edit made since the toast appeared stays. */
  function restore(snapshot) {
    AC.state.mapping = snapshot.mapping;
    AC.state.mappingDraft = Object.assign(snapshot.draft, draft());
    AC.MAPPING.forEach(m => { const k = keyOf(m), d = draft()[k], base = saved(m); if (d && FIELDS.every(f => d[f] === base[f])) delete draft()[k]; });
    AC.save();
    AC.rerender();
    AC.focusAfterAction($('saveBtn'));
  }
  function save(byKey) {
    if ($('saveBtn').disabled) return;
    const before = { mapping:clone(AC.state.mapping), draft:clone(draft()) };
    Object.keys(draft()).forEach(k => { AC.state.mapping[k] = draft()[k]; });
    AC.state.mappingDraft = {};
    AC.save();
    AC.rerender();
    AC.toast('Mapping saved.', { undo:() => restore(before) });
    if (byKey) AC.focusAfterAction($('toastUndo'));
  }
  function discard(byKey) {
    const before = { mapping:clone(AC.state.mapping), draft:clone(draft()) };
    AC.state.mappingDraft = {};
    AC.save();
    AC.rerender();
    AC.toast('Changes discarded.', { undo:() => restore(before) });
    if (byKey) AC.focusAfterAction($('toastUndo'));
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-cal-nav]');
    if (nav) { const d = new Date(cal.y, cal.mo + Number(nav.dataset.calNav), 1); cal.y = d.getFullYear(); cal.mo = d.getMonth(); drawCal(); return; }
    const day = e.target.closest('[data-day]');
    if (day) { const { m, field } = cal, key = cal.btn.dataset.key; closeCal(); edit(m, field, fromIso(day.dataset.day)); const b = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (b) b.focus(); return; }
    const dateBtn = e.target.closest('[data-date]');
    if (dateBtn) { if (cal && cal.btn === dateBtn) closeCal(true); else openCal(dateBtn); return; }
    if (cal && !e.target.closest('.ac-cal')) closeCal();
    const seg = e.target.closest('[data-rail]');
    if (seg) { selectRail(seg.dataset.rail); return; }
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.id === 'discardBtn') discard(e.detail === 0);
    if (btn.id === 'saveBtn') save(e.detail === 0);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && cal) closeCal(true); });
  window.addEventListener('hashchange', () => {
    const id = railFromHash();
    if (id !== rail) { rail = id; AC.rerender(); }
  });

  const crumbs = () => `<div class="ac-crumbs">${AC.crumb(AC.hrefOf('settings'), undefined, 'Settings', 'Account mapping')}</div>`;
  AC.start({
    current:'settings',
    noMonth:true,
    head:() => ({ standalone:true }),
    render:() => (RAILS.length
      ? `${crumbs()}<div class="ac-stack">${tableCard()}${ledgerCard()}</div>`
      : `${crumbs()}<div class="ac-stack"><section class="card"><div class="ac-empty"><span class="ac-muted">No rails connected</span><a class="btn btn-neutral btn-sm" href="custom-groups.html#connections">Go to Connections</a></div></section>${ledgerCard()}</div>`),
  });
})();
</script>
</body>
</html>
