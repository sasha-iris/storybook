<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exceptions</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting-layout.css">
  <style>
    .ex-c0 { width:48px; } .ex-c1 { width:100px; } .ex-c2 { width:112px; } .ex-c3 { width:152px; } .ex-c4 { width:168px; } .ex-c5 { width:112px; } .ex-c6 { width:128px; } .ex-c7 { width:120px; } .ex-c8 { width:48px; }
    @media (max-width:1439px) { .ex-c1 { width:88px; } .ex-c2 { width:108px; } .ex-c3 { width:136px; } .ex-c4 { width:168px; } .ex-c5 { width:96px; } .ex-c6 { width:120px; } }
    @media (max-width:1279px) { .ex-c0 { width:44px; } .ex-c1 { width:80px; } .ex-c2 { width:100px; } .ex-c3 { width:144px; } .ex-c4 { width:164px; } .ex-c6 { width:108px; } .ex-c8 { width:40px; } }
    .ac-menu { position:fixed; top:0; left:0; right:auto; z-index:20; width:160px; }
    .ac-high { font-weight:600; }
    @media (max-width:1279px) { .ac-narrow-hide { display:none; } }
  </style>
</head>
<body class="pm-journal ac ds" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Accounting";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
(function () {
  const esc = AC.esc;
  const SEVERITIES = ['High', 'Medium', 'Low'];
  const SEGMENTS = [['open', 'Open'], ['resolved', 'Resolved'], ['accepted', 'Accepted'], ['all', 'All']];
  const ASSIGNEES = ['Unassigned', 'You', 'Controller', 'Bookkeeper'];
  const CHANGES = {
    investigate: { status:'investigating', log:'Investigating', toast:'Exception under investigation.', claim:true },
    resolve: { status:'resolved', log:'Resolved', toast:'Exception resolved.', claim:true },
    reopen: { status:'open', log:'Reopened', toast:'Exception reopened.', claim:false },
  };
  const KEBAB_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>';

  const byId = id => AC.EXCEPTIONS.find(ex => ex.id === id);
  const isOpenLike = status => status === 'open' || status === 'investigating';
  const railKey = ex => ex.rail || ex.channel.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const curOf = ex => (AC.rail(ex.rail) || {}).cur;
  const moneyOf = ex => AC.money(ex.amount, curOf(ex));
  const typeOf = ex => AC.EXCEPTION_TYPES[ex.type];
  const hasRows = () => AC.month() === AC.MONTH;
  const isLocked = () => AC.periodClosed(AC.month());
  const isReadOnly = () => isLocked() || AC.VIEW_ONLY;
  /* The three exceptions the Unmatched payments item on Journal entries settles. */
  const isUnmatched = ex => !!ex.link && ex.link.page === 'journal';

  /* Every rail, then the others that only appear on an exception, such as Afterpay. */
  function railOptions() {
    const options = AC.RAILS.map(r => ({ key:r.id, label:AC.railLabel(r) }));
    AC.EXCEPTIONS.forEach(ex => { if (!ex.rail && !options.some(o => o.key === railKey(ex))) options.push({ key:railKey(ex), label:ex.channel }); });
    return options;
  }

  /* ---------- Filters live in the hash: #status=resolved&severity=high&rail=tiktok&ex1 ---------- */
  const decoded = text => { try { return decodeURIComponent(text); } catch (err) { return text; } };
  function parseHash() {
    const out = { status:'open', severity:'', rail:'', ex:'' };
    location.hash.slice(1).split('&').filter(Boolean).forEach(part => {
      const [key, value = null] = part.split('=').map(decoded);
      if (value === null) { if (byId(key)) out.ex = key; return; }
      if (key === 'status' && SEGMENTS.some(s => s[0] === value.toLowerCase())) out.status = value.toLowerCase();
      if (key === 'severity') out.severity = SEVERITIES.find(s => s.toLowerCase() === value.toLowerCase()) || '';
      if (key === 'rail' && railOptions().some(o => o.key === value)) out.rail = value;
    });
    return out;
  }
  function hashFor(v, ex) {
    const parts = [];
    if (v.status !== 'open') parts.push('status=' + v.status);
    if (v.severity) parts.push('severity=' + v.severity.toLowerCase());
    if (v.rail) parts.push('rail=' + v.rail);
    if (ex) parts.push(ex);
    return parts.length ? '#' + parts.join('&') : '';
  }
  const view = parseHash();
  const setView = patch => { location.hash = hashFor(Object.assign({}, view, patch)); };

  /* ---------- Rows ---------- */
  const inSegment = (ex, segment) => {
    const status = AC.exceptionStatus(ex);
    return segment === 'all' || (segment === 'open' ? isOpenLike(status) : status === segment);
  };
  const matchesFilters = ex => (!view.severity || ex.severity === view.severity) && (!view.rail || railKey(ex) === view.rail);
  const countIn = segment => (hasRows() ? AC.EXCEPTIONS.filter(ex => matchesFilters(ex) && inSegment(ex, segment)).length : 0);
  function visibleRows() {
    if (!hasRows()) return [];
    const rank = ex => SEVERITIES.indexOf(ex.severity);
    return AC.EXCEPTIONS.filter(ex => matchesFilters(ex) && inSegment(ex, view.status)).sort((a, b) => rank(a) - rank(b) || b.amount - a.amount);
  }

  /* ---------- Selection: only what is on view and can still be accepted ---------- */
  let selected = new Set();
  const selectableIds = () => (isReadOnly() ? [] : visibleRows().filter(ex => isOpenLike(AC.exceptionStatus(ex))).map(ex => ex.id));
  const pruneSelection = () => { const ok = selectableIds(); selected = new Set([...selected].filter(id => ok.includes(id))); };

  const sumOf = ids => AC.money(AC.sum(ids, id => byId(id).amount));
  const selectionHtml = () => (selected.size ? `${selected.size} selected · ${sumOf([...selected])}` : '');
  function bulkHtml() {
    if (isLocked() && hasRows()) return `<span class="ac-muted">${esc(AC.month())} is closed</span>`;
    if (AC.VIEW_ONLY) return hasRows() ? '<span class="ac-muted">View only</span>' : '';
    return `<span class="ac-muted" id="selCount" role="status">${selectionHtml()}</span>${selected.size ? bulkButtons() : ''}`;
  }
  const bulkButtons = () => '<button type="button" class="btn btn-neutral btn-sm" id="clearSel" data-key="clearSel" aria-label="Clear selection">Clear</button><button type="button" class="btn btn-primary btn-sm" id="acceptSel" data-key="acceptSel">Accept selected</button>';

  /* Checkboxes change the bar without a redraw, so nothing flickers and focus stays put. */
  function syncSelection() {
    const ok = selectableIds();
    const all = document.getElementById('pickAll');
    if (all) { all.checked = ok.length > 0 && selected.size === ok.length; all.indeterminate = selected.size > 0 && selected.size < ok.length; }
    document.querySelectorAll('tr[data-ex]').forEach(row => {
      const on = selected.has(row.dataset.ex);
      row.classList.toggle('ac-row--picked', on);
      const box = row.querySelector('[data-pick]');
      if (box) box.checked = on;
    });
    const count = document.getElementById('selCount');
    if (!count) return;
    count.innerHTML = selectionHtml();
    const buttons = document.getElementById('acceptSel');
    if (selected.size && !buttons) count.insertAdjacentHTML('afterend', bulkButtons());
    if (!selected.size && buttons) { document.getElementById('clearSel').remove(); buttons.remove(); }
  }

  /* ---------- Page ---------- */
  function severityHtml(ex) { return ex.severity === 'High' ? `<span class="ac-high">${esc(ex.severity)}</span>` : esc(ex.severity); }
  function statusHtml(status, ex) {
    /* An unmatched payment is settled by its decision on Journal entries, so it waits there, not here. */
    if (ex && isUnmatched(ex) && isOpenLike(status) && !AC.state.journal.unmatchedDecision) return '<span class="badge badge-gray badge-sm">To decide</span>';
    const word = esc(AC.EXCEPTION_STATUS[status]);
    if (status === 'open') return `<span class="badge badge-yellow badge-sm">${word}</span>`;
    if (status === 'investigating') return `<span class="badge badge-gray badge-sm">${word}</span>`;
    return `<span class="ac-muted">${word}</span>`;
  }
  function hrefOfLink(link) { return link.page === 'settlements' ? AC.hrefOf('settlements') + '#' + link.id : AC.hrefOf('journal') + '#entry-other'; }
  const orderHref = order => AC.hrefOf('events') + '#q=' + order.replace('#', '');
  function subjectHref(ex) {
    if (ex.link) return hrefOfLink(ex.link);
    if (ex.subject.startsWith('#')) return orderHref(ex.subject);
    return ex.type === 'reserve_not_released' ? AC.hrefOf('balance') + '#' + ex.rail.replace('_', '-') : '';
  }
  function subjectHtml(ex, inTable) {
    const href = subjectHref(ex);
    return href ? `<a class="btn-link btn-link-semibold btn-sm" href="${esc(href)}"${inTable ? ` data-key="subject-${ex.id}"` : ''}>${esc(ex.subject)}</a>` : esc(ex.subject);
  }

  function rowHtml(ex) {
    const status = AC.exceptionStatus(ex);
    const locked = isReadOnly();
    const name = esc(typeOf(ex) + ', ' + ex.subject);
    const box = !locked && isOpenLike(status) ? `<label class="ac-pick"><input type="checkbox" class="form-check-input" data-pick="${ex.id}" data-key="pick-${ex.id}" aria-label="Select ${name}"${selected.has(ex.id) ? ' checked' : ''}></label>` : '';
    const kebab = locked ? '' : `<div class="ac-menu-host"><button type="button" class="pm-kebab" data-kebab="${ex.id}" data-key="kebab-${ex.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${name}">${KEBAB_ICON}</button></div>`;
    return `<tr class="ac-row${selected.has(ex.id) ? ' ac-row--picked' : ''}" data-drill data-ex="${ex.id}">
      ${AC.td(box, {})}
      ${AC.td(`<button type="button" class="ac-rowlink" data-open="${ex.id}" data-key="open-${ex.id}" aria-haspopup="dialog">${esc(typeOf(ex))}</button>`, { head:true })}
      ${AC.td(severityHtml(ex), {})}
      ${AC.td(esc(moneyOf(ex)), { num:true })}
      ${AC.td(esc(ex.channel), {})}
      ${AC.td(subjectHtml(ex, true), {})}
      ${AC.td(esc(ex.firstSeen), { cls:'ac-wide' })}
      ${AC.td(statusHtml(status, ex), {})}
      ${AC.td(esc(AC.exceptionAssignee(ex)), { cls:'ac-wide' })}
      ${AC.td(kebab, {})}
    </tr>`;
  }

  function tableHtml(rows) {
    const head = selectableIds().length ? `<label class="ac-pick"><input type="checkbox" class="form-check-input" id="pickAll" data-key="pickAll" aria-label="Select all on view"></label>` : '';
    return `<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin ac-dst--ex">
      <caption class="ac-sr">Exceptions for ${esc(AC.month())}</caption>
      <colgroup><col class="ex-c0"><col><col class="ex-c1"><col class="ex-c2"><col class="ex-c3"><col class="ex-c4"><col class="ex-c5 ac-wide"><col class="ex-c6"><col class="ex-c7 ac-wide"><col class="ex-c8"></colgroup>
      <thead><tr>${AC.th(head)}${AC.th('Type')}${AC.th('Severity')}${AC.th('Amount', { right:true })}${AC.th('Rail')}${AC.th('Subject')}${AC.th('First seen', { cls:'ac-wide' })}${AC.th('Status')}${AC.th('Assignee', { cls:'ac-wide' })}${AC.th('<span class="ac-sr">Actions</span>')}</tr></thead>
      <tbody>${rows.map(rowHtml).join('')}</tbody>
    </table></div>`;
  }

  function emptyHtml() {
    const box = inner => `<div class="ac-empty">${inner}</div>`;
    const title = text => `<span class="ac-muted">${esc(text)}</span>`;
    if (!hasRows()) return box(title((AC.MONTHS.includes(AC.month()) ? 'No exceptions for ' : 'No sample figures for ') + AC.month()));
    if (view.severity || view.rail) return box(title('No exceptions match these filters') + '<button type="button" class="btn btn-neutral btn-sm" id="clearFilters" data-key="clearFilters">Clear filters</button>');
    if (view.status === 'open') {
      const j = AC.state.journal;
      const left = !isLocked() && (j.open > 0 || j.total - j.posted > 0);
      return box(title('No open exceptions') + (AC.EXCEPTIONS.length ? '<a class="btn-link btn-link-semibold btn-sm" href="#status=all" data-key="viewAll">View resolved and accepted</a>' : '') + (left ? `<a class="btn-link btn-link-semibold btn-sm" href="${esc(AC.hrefOf('journal'))}" data-key="goJournal">Go to Journal entries</a>` : ''));
    }
    if (view.status === 'all') return box(title('No exceptions for ' + AC.month()));
    return box(title('No ' + view.status + ' exceptions'));
  }

  function barHtml() {
    const segments = SEGMENTS.map(s => `<button type="button" class="btn${view.status === s[0] ? ' active' : ''}" data-seg="${s[0]}" data-key="seg-${s[0]}" aria-pressed="${view.status === s[0]}">${esc(s[1])}<span class="btn-group-stat-count">${countIn(s[0])}</span></button>`).join('');
    const severity = AC.filterMenu({ name:'severity', label:'Severity', value:view.severity, options:[['', 'All severities']].concat(SEVERITIES.map(x => [x, x])) });
    const rail = AC.filterMenu({ name:'rail', label:'Rail', value:view.rail, options:[['', 'All rails']].concat(railOptions().map(o => [o.key, o.label])) });
    const left = `<div class="btn-group" role="group" aria-label="Status">${segments}</div>${hasRows() ? severity + rail : ''}`;
    const right = `<div class="ac-toolbar" id="bulkSlot">${bulkHtml()}</div><button type="button" class="btn btn-neutral btn-sm" id="exportCsv" data-key="exportCsv"${visibleRows().length ? '' : ' disabled'}>Export CSV</button>`;
    return AC.cardBar(left, right);
  }

  function exportCsv() {
    const rows = visibleRows();
    if (!rows.length) return;
    const lines = [['Exception', 'Type', 'Severity', 'Amount', 'Currency', 'Rail', 'Subject', 'First seen', 'Status', 'Assignee', 'Note']];
    rows.forEach(ex => lines.push([ex.id, typeOf(ex), ex.severity, ex.amount.toFixed(2), curOf(ex) || 'USD', ex.channel, ex.subject, AC.isoDate(ex.firstSeen), AC.EXCEPTION_STATUS[AC.exceptionStatus(ex)], AC.exceptionAssignee(ex), AC.exceptionNote(ex)]));
    AC.downloadCsv('exceptions-' + AC.month().toLowerCase().replace(' ', '-') + '.csv', lines);
    AC.toast('CSV exported.');
  }

  /* ---------- Changes: one write path, one undo ---------- */
  AC.state.exceptionLog = AC.state.exceptionLog || {};
  const claimed = ex => { const who = AC.exceptionAssignee(ex); return who === 'Unassigned' ? 'You' : who; };
  const logLine = (id, label) => { (AC.state.exceptionLog[id] = AC.state.exceptionLog[id] || []).push({ label, by:'You', when:'just now' }); };

  function focusAfter(indexBefore) {
    const active = document.activeElement;
    if (active && active !== document.body) return;
    const kebabs = [...document.querySelectorAll('[data-kebab]')];
    AC.focusAfterAction(kebabs[Math.min(indexBefore, kebabs.length - 1)] || document.querySelector('.btn-group .btn[aria-pressed="true"]'));
  }

  /* After a change in the panel focus rests on Close, so a second Enter never presses the next status action. */
  function redraw() { AC.rerender(); if (panelId) { showPanel(panelId); AC.focusAfterAction(document.getElementById('modalClose')); } }

  function applyChange(ids, nextOf, logWord, message) {
    const order = visibleRows().map(ex => ex.id);
    const indexBefore = Math.max(0, order.indexOf(ids[0]));
    const earlier = ids.map(id => ({ id, entry:AC.state.exceptions[id] || null, logged:(AC.state.exceptionLog[id] || []).length }));
    ids.forEach(id => {
      if ((AC.state.exceptions[id] || {}).by === 'journal') logLine(id, AC.EXCEPTION_STATUS.resolved);
      AC.state.exceptions[id] = nextOf(byId(id));
      logLine(id, logWord);
    });
    AC.save();
    redraw();
    focusAfter(indexBefore);
    AC.toast(message, { undo:() => {
      earlier.forEach(e => {
        if (e.entry) AC.state.exceptions[e.id] = e.entry; else delete AC.state.exceptions[e.id];
        if (AC.state.exceptionLog[e.id]) AC.state.exceptionLog[e.id].length = e.logged;
      });
      AC.save();
      AC.rerender();
      AC.focusAfterAction(document.querySelector(`[data-kebab="${ids[0]}"]`) || document.querySelector('.btn-group .btn[aria-pressed="true"]'));
    } });
  }

  function changeStatus(act, id) {
    const change = CHANGES[act];
    /* A reopened exception stays reopened through Investigate, so a later visit to Journal entries does not settle it again. */
    const reopened = act === 'reopen' || !!(AC.state.exceptions[id] || {}).reopened;
    applyChange([id], ex => Object.assign({ status:change.status, note:AC.exceptionNote(ex), assignee:change.claim ? claimed(ex) : AC.exceptionAssignee(ex) }, reopened ? { reopened:true } : {}), change.log, change.toast);
  }

  function acceptDialog(ids) {
    const n = ids.length;
    const title = n === 1 ? 'Accept exception' : `Accept ${n} exceptions`;
    const high = ids.map(byId).filter(ex => ex.severity === 'High');
    const facts = n === 1 ? AC.money(byId(ids[0]).amount, byId(ids[0]).cur) : `Total ${sumOf(ids)}`;
    /* High items are named before they are accepted with the rest. */
    const highTable = high.length && n > 1 ? `<div class="ac-wrap-scroll ac-boxed ac-accept-high"><table class="ac-dst ac-dst--fin ac-dst--auto"><caption class="ac-sr">High severity in this selection</caption><thead><tr>${AC.th('High severity')}${AC.th('Subject')}${AC.th('Amount', { right:true })}</tr></thead><tbody>${high.map(ex => `<tr>${AC.td(`<span class="ac-name"><span class="badge badge-red badge-sm">High</span>${esc(typeOf(ex))}</span>`, { head:true })}${AC.td(esc(ex.subject), {})}${AC.td(esc(AC.money(ex.amount, ex.cur)), { num:true })}</tr>`).join('')}</tbody></table></div>` : '';
    if (panelId) returnToPanel = panelId;
    AC.openDialog({
      title,
      body:`<p class="ac-line" id="acceptFacts" style="margin-bottom:12px;">${esc(facts)}</p>${highTable}<div class="ac-field"><label class="form-label" for="acceptNote">Note</label><textarea class="form-input" id="acceptNote" rows="3" required aria-describedby="acceptFacts acceptNoteError"></textarea><p class="ac-field-error" id="acceptNoteError" aria-live="polite"></p></div>`,
      actions:[
        { label:'Cancel', kind:'alternative', onClick:() => AC.closeDialog() },
        { label:title, kind:'primary', onClick:() => submitAccept(ids) },
      ],
    });
    const area = document.getElementById('acceptNote');
    area.addEventListener('input', () => {
      if (!area.classList.contains('is-error')) return;
      area.classList.remove('is-error');
      area.removeAttribute('aria-invalid');
      document.getElementById('acceptNoteError').textContent = '';
    });
    area.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitAccept(ids); } });
    AC.focusAfterAction(area);
  }
  function submitAccept(ids) {
    const area = document.getElementById('acceptNote');
    const note = area.value.trim();
    if (!note) {
      area.classList.add('is-error');
      area.setAttribute('aria-invalid', 'true');
      document.getElementById('acceptNoteError').textContent = 'Enter a note';
      area.focus();
      return;
    }
    const n = ids.length;
    returnToPanel = null;
    AC.closeDialog();
    applyChange(ids, ex => ({ status:'accepted', note, assignee:claimed(ex) }), 'Accepted', n === 1 ? 'Exception accepted.' : `${n} exceptions accepted.`);
  }

  /* ---------- Panel ---------- */
  let panelId = null, pushedPanel = false, returnToPanel = null;

  function markPanelRow() {
    document.querySelectorAll('tr[data-drill].ac-row--sel').forEach(row => row.classList.remove('ac-row--sel'));
    if (!panelId) return;
    const row = document.querySelector(`tr[data-ex="${panelId}"]`);
    if (row) row.classList.add('ac-row--sel');
    if (!document.getElementById('modalBackdrop')) return;
    const back = row ? row.querySelector('[data-open]') : document.querySelector('.btn-group .btn[aria-pressed="true"]');
    if (back) AC.keepReturnFocus(back);
  }

  function panelActions(ex, status) {
    if (isReadOnly()) return '';
    const button = (act, label, kind, key) => `<button type="button" class="btn ${kind} btn-sm" data-act="${act}" data-id="${ex.id}" data-key="${key}">${label}</button>`;
    const decide = isUnmatched(ex) && !AC.state.journal.unmatchedDecision ? `<a class="btn btn-primary btn-sm" href="${esc(AC.hrefOf('journal') + '#decide-unmatched')}" data-key="panelPrimary">Decide in Journal entries</a>` : '';
    const primary = decide || button('accept', 'Accept with note', 'btn-primary', 'panelPrimary');
    if (status === 'open') return button('investigate', 'Investigate', 'btn-neutral', 'panelNeutral') + primary;
    if (status === 'investigating') return button('resolve', 'Resolve', 'btn-neutral', 'panelNeutral') + primary;
    return button('reopen', 'Reopen', 'btn-neutral', 'panelNeutral') + decide;
  }

  /* What a settlement break needs to be judged: both nets and the order behind the gap. */
  function breakFacts(ex) {
    if (ex.type !== 'settlement_waterfall_break') return [];
    const s = AC.settlement(ex.link.id);
    const order = AC.ORDERS[s.rail].find(o => o[4] === s.id);
    return [['Reported net', esc(AC.money(s.reportedNet, s.cur))], ['Expected net', esc(AC.money(s.expectedNet, s.cur))]].concat(order ? [['Order', `<a class="btn-link btn-link-semibold btn-sm" href="${esc(orderHref(order[0]))}">${esc(order[0])}</a>`]] : []);
  }

  function panelBody(ex, status) {
    const note = AC.exceptionNote(ex);
    const who = AC.exceptionAssignee(ex);
    const assignee = isReadOnly() ? esc(who) : AC.filterMenu({ name:'assignee', label:'Assignee', value:who, options:ASSIGNEES.map(a => [a, a]) });
    const decision = isUnmatched(ex) ? AC.state.journal.unmatchedDecision : '';
    const entry = AC.state.exceptions[ex.id];
    const lines = (AC.state.exceptionLog[ex.id] || []).slice();
    if (entry && entry.by === 'journal') lines.push({ label:AC.EXCEPTION_STATUS[entry.status], by:'You', when:'just now' });
    return `${AC.kv([
        ['Severity', severityHtml(ex)],
        ['Subject', subjectHtml(ex)],
        ex.type === 'payout_failed' ? ['Reason', esc((AC.settlement(ex.subject) || {}).failureText || '')] : null,
        ...breakFacts(ex),
        ['Status', statusHtml(status, ex)],
        ['Assignee', assignee],
        decision && note === decision ? null : ['Note', note ? `<span class="ac-note-text">${esc(note)}</span>` : AC.none],
        decision ? ['Decision', `<span class="ac-note-text">${esc(decision)}</span>`] : null,
      ], { only:true, caption:'Exception' })}
      <div>
        <h2 class="ac-section-title">History</h2>
        ${AC.kv([['First seen', esc(ex.firstSeen)]].concat(lines.map(l => [l.label, `<span class="ac-muted">${esc(l.by)} · ${esc(l.when)}</span>`])), { caption:'History' })}
      </div>`;
  }

  function showPanel(id, focusKey) {
    const ex = byId(id);
    if (!ex) return;
    panelId = id;
    const status = AC.exceptionStatus(ex);
    AC.openPanel({ title:typeOf(ex), amount:moneyOf(ex), meta:`${ex.channel} · ${curOf(ex) || 'USD'} · ${AC.MONTH}`, actions:panelActions(ex, status), body:panelBody(ex, status) });
    markPanelRow();
    const target = focusKey && (document.querySelector(`#modalHost [data-key="${focusKey}"]`) || document.querySelector('#modalHost [data-key="panelNeutral"]'));
    if (target) target.focus();
  }

  function openFromRow(id) {
    showPanel(id);
    pushedPanel = true;
    location.hash = hashFor(view, id);
  }

  function panelClosed() {
    panelId = null;
    markPanelRow();
    if (!parseHash().ex) { pushedPanel = false; return; }
    if (pushedPanel) { pushedPanel = false; history.back(); return; }
    history.replaceState(null, '', location.pathname + location.search + hashFor(view));
  }

  /* The shell has one overlay host. A dialog over the panel replaces it, so the panel comes back when the dialog goes. */
  new MutationObserver(() => {
    if (document.getElementById('modalBackdrop')) return;
    if (returnToPanel) { const id = returnToPanel; returnToPanel = null; showPanel(id, 'panelPrimary'); return; }
    if (panelId) panelClosed();
  }).observe(document.getElementById('modalHost'), { childList:true });

  function changeAssignee(id, who) {
    const ex = byId(id);
    AC.state.exceptions[id] = Object.assign({}, AC.state.exceptions[id], { status:AC.exceptionStatus(ex), note:AC.exceptionNote(ex), assignee:who });
    logLine(id, who === 'Unassigned' ? 'Unassigned' : 'Assigned to ' + (who === 'You' ? 'you' : who));
    AC.save();
    AC.rerender();
    showPanel(id, 'menu:assignee');
  }

  /* ---------- Kebab menu ---------- */
  let menuFor = null;
  function menuItems(status) {
    if (status === 'open') return [['investigate', 'Investigate'], ['resolve', 'Resolve'], ['accept', 'Accept with note']];
    if (status === 'investigating') return [['resolve', 'Resolve'], ['accept', 'Accept with note']];
    return [['reopen', 'Reopen']];
  }
  const kebabOf = id => document.querySelector(`[data-kebab="${id}"]`);
  function openMenu(button, byKeyboard) {
    closeMenu();
    const id = button.dataset.kebab;
    const ex = byId(id);
    menuFor = id;
    button.setAttribute('aria-expanded', 'true');
    button.insertAdjacentHTML('afterend', `<div class="pm-menu ac-menu" role="menu" aria-label="Actions" tabindex="-1">${menuItems(AC.exceptionStatus(ex)).map(i => `<button type="button" role="menuitem" class="pm-menu__item" data-act="${i[0]}" data-id="${id}"><span class="pm-menu__label">${i[1]}</span></button>`).join('')}</div>`);
    const menu = button.nextElementSibling;
    const at = button.getBoundingClientRect();
    const height = menu.offsetHeight;
    const below = at.bottom + 4 + height <= window.innerHeight - 8;
    menu.style.left = (at.right - menu.offsetWidth) + 'px';
    menu.style.top = (below ? at.bottom + 4 : Math.max(8, at.top - 4 - height)) + 'px';
    if (byKeyboard) menu.querySelector('[role="menuitem"]').focus(); else menu.focus({ preventScroll:true });
  }
  function closeMenu(refocus) {
    if (!menuFor) return;
    const button = kebabOf(menuFor);
    menuFor = null;
    if (!button) return;
    button.setAttribute('aria-expanded', 'false');
    const menu = button.nextElementSibling;
    if (menu) menu.remove();
    if (refocus) button.focus();
  }
  function menuKeys(e) {
    if (!menuFor) return;
    const items = [...document.querySelectorAll('.ac-menu [role="menuitem"]')];
    const at = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); return; }
    if (e.key === 'Tab') { closeMenu(true); return; }
    const to = e.key === 'ArrowDown' ? (at + 1) % items.length : e.key === 'ArrowUp' ? (at <= 0 ? items.length - 1 : at - 1) : e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : -1;
    if (to >= 0) { e.preventDefault(); items[to].focus(); }
  }

  /* ---------- Events ---------- */
  function perform(act, id) {
    closeMenu(true);
    if (act === 'accept') acceptDialog([id]);
    else if (CHANGES[act]) changeStatus(act, id);
  }

  document.addEventListener('click', e => {
    if (e.detail > 1) return;
    const item = e.target.closest('[data-act]');
    if (item) { perform(item.dataset.act, item.dataset.id); return; }
    const kebab = e.target.closest('[data-kebab]');
    if (kebab) { if (menuFor === kebab.dataset.kebab) closeMenu(true); else openMenu(kebab, e.detail === 0); return; }
    const segment = e.target.closest('[data-seg]');
    if (segment) { setView({ status:segment.dataset.seg }); return; }
    const open = e.target.closest('[data-open]');
    if (open) { openFromRow(open.dataset.open); return; }
    const button = e.target.closest('button');
    if (!button) return;
    if (button.id === 'exportCsv') exportCsv();
    if (button.id === 'acceptSel') acceptDialog([...selected]);
    if (button.id === 'clearSel') {
      selected.clear();
      syncSelection();
      const all = document.getElementById('pickAll');
      if (all) all.focus({ preventScroll:true });
    }
    if (button.id === 'clearFilters') setView({ severity:'', rail:'' });
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'pickAll') { selected = new Set(t.checked ? selectableIds() : []); syncSelection(); }
    if (t.dataset && t.dataset.pick) { if (t.checked) selected.add(t.dataset.pick); else selected.delete(t.dataset.pick); syncSelection(); }
  });

  AC.onMenuPick = (name, value) => {
    if (name === 'assignee') { changeAssignee(panelId, value); return; }
    setView({ [name]:value });
  };

  document.addEventListener('keydown', e => {
    if (menuFor) { menuKeys(e); return; }
    const kebab = e.target.closest && e.target.closest('[data-kebab]');
    if (kebab && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); openMenu(kebab, true); }
  });

  /* A click outside only closes the menu. It does not also open the row under it. */
  let swallowClick = false;
  window.addEventListener('mousedown', e => {
    swallowClick = false;
    if (!menuFor || e.target.closest('.ac-menu-host')) return;
    swallowClick = !e.target.closest('[data-kebab]');
    closeMenu();
  }, true);
  window.addEventListener('click', e => { if (swallowClick) { swallowClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
  window.addEventListener('scroll', () => closeMenu(), true);
  window.addEventListener('resize', () => closeMenu());

  AC.rowClick('tr[data-ex]', row => openFromRow(row.dataset.ex));

  /* ---------- Hash ---------- */
  function syncFromHash() {
    const next = parseHash();
    const changed = next.status !== view.status || next.severity !== view.severity || next.rail !== view.rail;
    view.status = next.status; view.severity = next.severity; view.rail = next.rail;
    closeMenu();
    if (next.ex && !hasRows()) { AC.setMonth(AC.MONTH); AC.rerender(); }
    else if (changed) {
      AC.rerender();
      const active = document.activeElement;
      if (!active || active === document.body) { const seg = document.querySelector('.btn-group .btn[aria-pressed="true"]'); if (seg) seg.focus({ preventScroll:true }); }
    }
    if (next.ex) { if (panelId !== next.ex) showPanel(next.ex); return; }
    if (document.getElementById('modalBackdrop')) { panelId = null; returnToPanel = null; pushedPanel = false; AC.closePanel(); }
  }

  AC.start({
    current:'exceptions',
    noMonth:false,
    render:() => {
      menuFor = null;
      pruneSelection();
      const rows = visibleRows();
      return `<div class="ac-stack"><section class="card" aria-label="Exceptions">${barHtml()}${rows.length ? tableHtml(rows) : emptyHtml()}</section></div>`;
    },
    after:() => { syncSelection(); markPanelRow(); },
    ready:() => {
      window.addEventListener('hashchange', syncFromHash);
      window.addEventListener('pageshow', ev => { if (ev.persisted && panelId) showPanel(panelId); });
      syncFromHash();
    },
  });
})();
</script>
</body>
</html>
