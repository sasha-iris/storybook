<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/iris-tokens.css">
  <link rel="stylesheet" href="assets/iris-components.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/panorama-match.css">
  <link rel="stylesheet" href="assets/accounting-layout.css">
  <style>
    .ev-c0 { width:80px; } .ev-c1 { width:164px; } .ev-c2 { width:14%; } .ev-c3 { width:112px; } .ev-c4 { width:124px; }
    @media (max-width:1439px) { .ev-c1 { width:148px; } .ev-c2 { width:128px; } .ev-c4 { width:112px; } }
    @media (max-width:1279px) { .ev-c0 { width:76px; } .ev-c1 { width:152px; } .ev-c2 { width:120px; } .ev-c3 { width:104px; } .ev-c4 { width:104px; } }
  </style>
</head>
<body class="pm-journal ac ds" style="margin:0;background:var(--color-bg-default);font-family:'Inter',sans-serif;">
<div style="display:flex;min-height:100vh;">
  <aside class="sidebar sidebar--collapsed" aria-label="Main navigation" style="height:auto;"></aside>
  <main id="app" style="flex:1;min-width:0;box-sizing:border-box;"></main>
</div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.PM_RAIL_EXTRA = "Accounting"; window.PM_RAIL_ACTIVE = "Accounting";</script>
<script src="assets/panorama-match.js"></script>
<script src="assets/accounting-data.js"></script>
<script src="assets/accounting-shell.js"></script>
<script>
(function () {
  const esc = AC.esc;
  const PAGE_SIZE = 25;
  const ALL = AC.allEvents();
  const bareAcct = s => String(s).replace('…', '');
  const ACCOUNTS = [...new Set(AC.RAILS.map(r => r.acct))];
  const NO_VALUE = AC.none;
  const hasData = () => AC.month() === AC.MONTH;
  const CATEGORIES = [AC.CATEGORIES[0], AC.CATEGORIES[1], AC.CATEGORIES[2], AC.CATEGORIES[3], ['feetax', 'Fees and tax'], AC.CATEGORIES[4]];
  const inCategory = (e, cat) => (cat ? e.cat === cat || (cat === 'feetax' && (e.cat === 'fee' || e.cat === 'tax')) : e.cat !== 'fee' && e.cat !== 'tax');
  const kindsOf = cat => (cat === 'feetax' ? ['fee', 'tax'] : [cat || 'activity']);
  const FILTERS = ['rail', 'acct', 'cur', 'cat', 'q'];
  const NOUNS = { charge:['charge', 'charges'], refund:['refund', 'refunds'], fee:['fee', 'fees'], tax:['tax event', 'tax events'], feetax:['fee and tax event', 'fee and tax events'], payout:['payout', 'payouts'] };

  /* ---------- Filters live in the hash ---------- */
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const acct = bareAcct(p.get('acct') || '');
    const rail = p.get('rail') || '', cur = p.get('cur') || '', cat = p.get('cat') || '';
    return {
      rail:AC.rail(rail) ? rail : '',
      acct:ACCOUNTS.some(a => bareAcct(a) === acct) ? acct : '',
      cur:AC.CURRENCIES.includes(cur) ? cur : '',
      cat:CATEGORIES.some(c => c[0] === cat) ? cat : '',
      q:p.get('q') || '',
      page:Math.max(1, parseInt(p.get('page'), 10) || 1),
    };
  }
  function urlOf(s) {
    const p = new URLSearchParams();
    FILTERS.forEach(k => { if (s[k]) p.set(k, s[k]); });
    if (s.page > 1) p.set('page', s.page);
    const hash = p.toString();
    return location.pathname + location.search + (hash ? '#' + hash : '');
  }
  let f = readHash();
  let typing = false;

  /* ---------- What the filters select ---------- */
  const railsInFilter = () => AC.RAILS.filter(r => (!f.rail || r.id === f.rail) && (!f.acct || bareAcct(r.acct) === f.acct) && (!f.cur || (r.cur || 'USD') === f.cur));
  function rowsInFilter() {
    if (!hasData()) return [];
    const rails = new Set(railsInFilter().map(r => r.id));
    const q = f.q.trim().toLowerCase();
    return ALL.filter(e => rails.has(e.rail) && (inCategory(e, f.cat) || (q && !f.cat)) && (!q || [e.txn, e.order, e.payout].some(v => v && v.toLowerCase().includes(q))));
  }

  /* The tile states the true total of the rails in view, never a sum of the sample rows. Currencies never add up. */
  function tileFacts() {
    const rails = railsInFilter();
    const curs = AC.CURRENCIES.filter(c => rails.some(r => (r.cur || 'USD') === c));
    const kinds = kindsOf(f.cat);
    const railsIn = c => rails.filter(r => (r.cur || 'USD') === c);
    return {
      curs,
      total:c => AC.sum(railsIn(c), r => AC.sum(kinds, k => AC.kindTotal(r, k))),
      count:railsIn(curs[0]).reduce((n, r) => n + kinds.reduce((m, k) => m + AC.kindCount(r, k), 0), 0),
    };
  }
  function tileHtml() {
    const label = f.cat ? CATEGORIES.find(c => c[0] === f.cat)[1] : 'Net balance change from activity';
    if (f.q.trim()) return `<div class="card-header"><div class="ac-name"><span class="card-header-title">${NO_VALUE}</span><span class="ac-muted">${esc(label)}</span></div></div>`;
    const { curs, total, count } = tileFacts();
    const shown = c => (total(c) === 0 ? AC.money(0, c) : AC.signed(total(c), c));
    const others = curs.slice(1).map(c => ' · ' + shown(c)).join('');
    return `<div class="card-header"><div class="ac-name"><span class="card-header-title">${esc(shown(curs[0]))}</span><span class="ac-muted">${esc(label)}${curs.length > 1 ? ', ' + esc(curs[0]) : ''} (${AC.count(count)})${esc(others)}</span></div></div>`;
  }
  /* The foot counts what the tile counts. With no category it counts every event the rows can hold, payouts too. */
  function sampleText() {
    const n = railsInFilter().reduce((m, r) => m + (f.cat ? kindsOf(f.cat).reduce((k, kind) => k + AC.kindCount(r, kind), 0) : r.n.charge + r.n.refund + r.n.payout), 0);
    const noun = f.cat ? NOUNS[f.cat] : ['event', 'events'];
    return `Sample of ${AC.count(n)} ${noun[n === 1 ? 0 : 1]}`;
  }

  /* ---------- Table ---------- */
  const payoutLink = (id, key) => `<a class="btn-link btn-link-semibold btn-sm" href="${esc(AC.hrefOf('settlements') + '#' + id)}"${key ? ` data-key="${esc(key)}"` : ''}>${esc(id)}</a>`;
  const rowHtml = e => `<tr class="ac-row" data-drill data-ev="${esc(e.txn)}">
    ${AC.td(`<button type="button" class="ac-rowlink" data-open data-key="ev:${esc(e.txn)}" aria-haspopup="dialog" aria-label="${esc(e.date)}, open ${esc(e.txn)}">${esc(e.date)}</button>`, { head:true })}
    ${AC.td(esc(e.channel), {})}
    ${AC.td(esc(e.txn), { cls:'ac-wide' })}
    ${AC.td(esc(e.desc), {})}
    ${AC.td(AC.amt(e.amount, e.cur), { num:true })}
    ${AC.td(AC.amt(AC.round2(e.fee + (e.tax || 0)), e.cur), { num:true })}
    ${AC.td(AC.amt(e.net, e.cur), { num:true })}
    ${AC.td(e.payout ? payoutLink(e.payout, 'po:' + e.txn) : NO_VALUE, {})}
    ${AC.td(`<span class="ac-muted">${esc(e.status)}</span>`, { cls:'ac-wide' })}
  </tr>`;
  function tableHtml(rows) {
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (f.page > pages) f.page = pages;
    const start = (f.page - 1) * PAGE_SIZE;
    const shown = rows.slice(start, start + PAGE_SIZE);
    return `<div class="ac-wrap-scroll"><table class="ac-dst ac-dst--fin">
      <caption class="ac-sr">Events</caption>
      <colgroup><col class="ev-c0"><col class="ev-c1"><col class="ac-wide" style="width:140px"><col><col class="ev-c2"><col class="ev-c3"><col class="ev-c2"><col class="ev-c4"><col class="ac-wide" style="width:96px"></colgroup>
      <thead><tr>${AC.th('Date')}${AC.th('Rail')}${AC.th('Transaction', { cls:'ac-wide' })}${AC.th('Description')}${AC.th('Amount', { right:true })}${AC.th('Fee and tax', { right:true })}${AC.th('Net', { right:true })}${AC.th('Settlement')}${AC.th('Status', { cls:'ac-wide' })}</tr></thead>
      <tbody>${shown.map(rowHtml).join('')}</tbody>
    </table></div>
    ${AC.foot(sampleText(), AC.pager({ start:start + 1, end:start + shown.length, total:rows.length, page:f.page, pages }))}`;
  }
  function resultsHtml() {
    if (!hasData()) return `<div class="ac-empty"><span class="ac-muted">${AC.MONTHS.includes(AC.month()) ? 'No events for ' : 'No sample figures for '}${esc(AC.month())}</span></div>`;
    const rows = rowsInFilter();
    if (!rows.length) return '<div class="ac-empty"><span class="ac-muted">No events match these filters</span><button type="button" class="btn btn-neutral btn-sm" id="evClear" data-key="evClear">Clear filters</button></div>';
    return `${tileHtml()}${tableHtml(rows)}`;
  }

  /* ---------- Filter bar ---------- */
  const SEARCH_ICON = '<span class="form-search-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.45 4.39l3.08 3.08a.75.75 0 1 1-1.06 1.06l-3.08-3.08A7 7 0 0 1 2 9Z" clip-rule="evenodd"/></svg></span>';
  const barHtml = () => AC.cardBar(`
    ${AC.filterMenu({ name:'rail', label:'Rail', value:f.rail, options:[['', 'All rails']].concat(AC.RAILS.map(r => [r.id, AC.railLabel(r)])) })}
    ${AC.filterMenu({ name:'acct', label:'Rail account', value:f.acct, options:[['', 'All accounts']].concat(ACCOUNTS.map(a => [bareAcct(a), a])) })}
    ${AC.filterMenu({ name:'cur', label:'Currency', value:f.cur, options:[['', 'All currencies']].concat(AC.CURRENCIES.map(c => [c, c])) })}
    ${AC.filterMenu({ name:'cat', label:'Category', value:f.cat, options:[['', 'All categories']].concat(CATEGORIES) })}
    <div class="form-search-wrap ac-search">${SEARCH_ICON}<input type="search" class="form-input form-input-sm" id="evSearch" data-key="evSearch" aria-label="Search by ID" placeholder="Search by ID" autocomplete="off" spellcheck="false" value="${esc(f.q)}"${hasData() ? '' : ' disabled'}></div>`, exportHtml());

  /* ---------- Export ---------- */
  const exportHtml = () => `<button type="button" class="btn btn-neutral btn-sm" id="evExport" data-key="evExport"${rowsInFilter().length ? '' : ' disabled'}>Export CSV</button>`;
  function syncExport() { document.getElementById('evExport').disabled = !rowsInFilter().length; }
  function exportCsv() {
    const head = ['Date', 'Rail', 'Rail account', 'Transaction', 'Order', 'Description', 'Currency', 'Amount', 'Fee', 'Tax', 'Net', 'Settlement', 'Status'];
    const rows = rowsInFilter().map(e => [AC.isoDate(e.date), e.channel, AC.rail(e.rail).acct, e.txn, e.order || '', e.desc, e.cur || 'USD', e.amount.toFixed(2), e.fee.toFixed(2), (e.tax || 0).toFixed(2), e.net.toFixed(2), e.payout || '', e.status]);
    const name = ['events', f.rail, f.acct, f.cur, f.cat].filter(Boolean).join('-').toLowerCase() + '-' + AC.isoDate('Sep 1').slice(0, 7) + '.csv';
    AC.downloadCsv(name, [head].concat(rows));
    AC.toast('CSV exported.');
  }

  /* ---------- Panel ---------- */
  function openEvent(row) {
    const e = ALL.find(x => x.txn === row.dataset.ev);
    const rail = AC.rail(e.rail);
    AC.openPanel({
      title:e.desc,
      amount:AC.signed(e.amount, e.cur),
      meta:[rail.name, e.cur || 'USD', e.date].join(' · '),
      body:`${AC.kv([
        ['Fee', AC.amt(e.fee, e.cur)],
        ['Tax', AC.amt(e.tax, e.cur)],
        ['Net', esc(AC.signed(e.net, e.cur))],
        ['Settlement', e.payout ? payoutLink(e.payout) : NO_VALUE],
        ['Status', esc(e.status)],
        ['Transaction', esc(e.txn)],
        e.order ? ['Order', esc(e.order)] : null,
        ['Rail account', esc(rail.acct)],
      ], { only:true, caption:'Event' })}${AC.sourceRow(AC.sourcePairs(e))}`,
    });
    AC.keepReturnFocus(row.querySelector('[data-open]'));
  }

  /* ---------- Drawing after a change ---------- */
  function keepFocus(draw) {
    const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : '';
    draw();
    if (!key) return;
    const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (el && !el.disabled) { if (document.activeElement !== el) el.focus({ preventScroll:true }); return; }
    const alt = key === 'evClear' && document.querySelector('[data-key="menu:rail"]');
    if (alt) AC.focusAfterAction(alt);
  }
  /* The live region stays through a redraw, so what is written to it is heard. */
  const live = document.createElement('div');
  live.className = 'ac-sr';
  live.id = 'evLive';
  live.setAttribute('role', 'status');
  document.body.appendChild(live);
  function announce(paged) {
    const range = paged ? document.querySelector('[data-showing]') : null;
    const n = rowsInFilter().length;
    live.textContent = range ? range.textContent : n === 1 ? '1 event' : AC.count(n) + ' events';
  }
  function update(paged) {
    const host = document.getElementById('evResults');
    if (!host) return;
    host.innerHTML = resultsHtml();
    syncExport();
    announce(paged);
  }
  function go(paged) { history.pushState(null, '', urlOf(f)); keepFocus(() => update(paged)); }

  const app = document.getElementById('app');
  AC.onMenuPick = (name, value) => {
    f[name] = value;
    f.page = 1;
    history.pushState(null, '', urlOf(f));
    AC.rerender();
    announce();
    const b = document.querySelector(`[data-key="menu:${name}"]`);
    if (b) b.focus();
  };
  app.addEventListener('input', e => {
    if (e.target.id !== 'evSearch') return;
    f.q = e.target.value;
    f.page = 1;
    /* One history entry per search, not one per letter. */
    history[typing ? 'replaceState' : 'pushState'](null, '', urlOf(f));
    typing = !!f.q;
    update();
  });
  app.addEventListener('focusout', e => { if (e.target.id === 'evSearch') typing = false; });
  app.addEventListener('keydown', e => {
    if (e.target.id !== 'evSearch' || e.key !== 'Escape' || !e.target.value) return;
    e.preventDefault();
    e.target.value = '';
    e.target.dispatchEvent(new Event('input', { bubbles:true }));
  });
  app.addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    if (open) { openEvent(open.closest('tr')); return; }
    const exp = e.target.closest('#evExport');
    if (exp) { if (e.detail <= 1 && !exp.disabled) exportCsv(); return; }
    if (e.target.closest('#evClear')) {
      f = { rail:'', acct:'', cur:'', cat:'', q:'', page:1 };
      history.pushState(null, '', urlOf(f));
      AC.rerender();
      announce();
      document.querySelector('[data-key="menu:rail"]').focus({ preventScroll:true });
      return;
    }
    const pageBtn = e.target.closest('[data-page]');
    if (!pageBtn) return;
    f.page = Number(pageBtn.dataset.page);
    go(true);
    if (document.documentElement.classList.contains('pm-pointer')) window.scrollTo(0, 0);
  });
  window.addEventListener('hashchange', () => {
    AC.closePanel();
    const was = f;
    f = readHash();
    typing = false;
    keepFocus(AC.rerender);
    announce(FILTERS.every(k => was[k] === f[k]) && was.page !== f.page);
  });

  AC.rowClick('tr[data-ev]', openEvent);
  AC.start({
    current:'events',
    render:() => `<div class="ac-crumbs">${AC.crumb(AC.hrefOf('balance'), undefined, 'Balance', 'All events')}</div><div class="ac-stack"><section class="card" aria-label="Events">${barHtml()}<div id="evResults">${resultsHtml()}</div></section></div>`,
  });
})();
</script>
</body>
</html>
